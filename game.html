<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- ★폰 세로가 기준이다(390×844). viewport-fit=cover 로 노치 아래까지 쓰고,
     safe-area-inset 으로 버튼이 홈 인디케이터에 안 걸리게 한다.
     user-scalable=no — 3D 를 손가락으로 돌리다 페이지가 통째로 확대되면 조작이 망가진다. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14101c">
<title>볕 · 첫 플레이</title>

<!-- house.js·textures.js 가 전역 THREE 를 쓴다(index.html 과 같은 r128).
     v0는 방을 그리지 않고 조도 계산에만 쓴다 — 렌더러를 만들지 않는다. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- ★GLTFLoader 가 빠져 있었다(2026-08-03). 방을 안 그리던 시절에는 GLB 를 쓸 일이 없어
     안 드러났다 — 방 전경이 붙는 순간 화분·식물이 통째로 안 나타나고
     콘솔에만 "GLTFLoader 미로드"가 남았다. plant_grow.html 은 처음부터 둘 다 싣고 있다. -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;font-family:'Gaegu',sans-serif;background:#14101c;color:#f2eef8;overflow:hidden}
  /* ★ 한글은 어절 단위로 끊는다. 기본값은 글자 단위라 "…옮겨 보세 / 요." 처럼
     마지막 줄에 한 글자만 남는 고아 줄이 생긴다(퀘스트 박스에서 실제로 났다). */
  .quest,.itemline,.note,.slotline,.bad,.err,.sub,#stageEmpty,#event{word-break:keep-all;overflow-wrap:break-word}
  #app{display:flex;height:100%}
/* ══════════════════════════════════════════════════════════════════════════
   폰 세로 셸 (2026-08-03) — ★여기가 게임 화면이다.
   방 3D 전경이 화면의 대부분이고, 화분을 탭하면 식물이 확대된다.
   위 규칙들은 데스크톱 검수용으로 남겨 두고, 아래에서 레이아웃만 덮어쓴다.
   ⚠ element id 는 하나도 안 바꿨다 — 아래 module 스크립트가 전부 id 로 찾는다.
══════════════════════════════════════════════════════════════════════════ */
  :root{
    --safe-t:env(safe-area-inset-top,0px);   --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px);  --safe-r:env(safe-area-inset-right,0px);
    --tap:44px;                              /* ★터치 타깃 최소치. 이보다 작게 만들지 말 것 */
    --topbar-h:56px;  --bottom-h:112px;
    --ink:#f2eef8;  --dim:rgba(255,255,255,.55);  --gold:#ffb454;  --leaf:#9fdc86;
  }
  html,body{
    /* ★100dvh — 폰 주소창이 접히고 펴질 때 100vh 는 화면 밖으로 삐져나간다 */
    height:100dvh;overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;   /* 탭할 때 파란 사각형이 3D 위에 뜬다 */
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;                 /* 더블탭 확대 끄기 — 3D 조작과 충돌한다 */
  }
  #app{flex-direction:column;height:100dvh;width:100%;max-width:none}

  /* ── 상단 상태 ─────────────────────────────────────────────────────── */
  #topbar{flex:0 0 auto;padding:calc(var(--safe-t) + 8px) calc(var(--safe-r) + 12px) 8px calc(var(--safe-l) + 12px);
          background:linear-gradient(180deg,rgba(20,16,28,.96) 0,rgba(20,16,28,.72) 70%,transparent 100%);
          position:relative;z-index:20}
  #topbar .resourcebar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0}
  #topbar .resource{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 4px;
          background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);border-radius:10px}
  #topbar .resource span{font-size:10px;color:var(--dim);line-height:1.1}
  #topbar .resource b{font-family:'Jua';font-size:14px;color:var(--ink);line-height:1.15}
  #topbar .r-saved b{color:var(--leaf)}

  /* ── 방 전경 = 무대 ───────────────────────────────────────────────── */
  #stage{flex:1 1 auto;min-height:0;position:relative;background:#0f0c16}
  /* ★방 3D. 이게 게임 화면이고, plant_grow(iframe)는 탭했을 때 위로 올라오는 확대다. */
  #roomCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #roomFallback{position:absolute;inset:0;display:none;place-items:center;padding:24px;text-align:center;
          font-size:13px;color:var(--dim);line-height:1.7}
  #stage.room-failed #roomFallback{display:grid}
  /* 확대 오버레이 — 기본은 숨어 있다. display:none 은 안 쓴다(iframe 이 멈추면 growth 계약이 끊긴다) */
  #growth{position:absolute;inset:0;z-index:30;opacity:0;pointer-events:none;
          transition:opacity .28s ease;background:#0f0c16}
  #stage.zoom #growth{opacity:1;pointer-events:auto}
  #closeZoom{position:absolute;z-index:31;top:calc(var(--safe-t) + 10px);right:12px;display:none;
          width:var(--tap);height:var(--tap);border-radius:50%;border:1px solid rgba(255,255,255,.18);
          background:rgba(20,16,28,.82);color:var(--ink);font-size:18px;line-height:1}
  #stage.zoom #closeZoom{display:block}
  /* 확대 중에는 no-plant 가림막이 위를 덮으면 안 된다 */
  #stage.zoom.no-plant #growth{opacity:1;pointer-events:auto}
  #stage.zoom #stageEmpty{display:none}

  /* 배치 모드 안내 — 3D 위에 얇게 뜬다 */
  #placeHint{position:absolute;z-index:25;left:12px;right:12px;top:10px;display:none;
          padding:9px 12px;border-radius:12px;background:rgba(20,16,28,.86);
          border:1px solid rgba(255,180,84,.30);font-size:13px;color:var(--ink);text-align:center;
          word-break:keep-all}
  #stage.placing #placeHint{display:block}
  #placeHint b{color:var(--gold)}

  /* ── 하단 액션 ─────────────────────────────────────────────────────── */
  #bottom{flex:0 0 auto;padding:10px calc(var(--safe-r) + 12px) calc(var(--safe-b) + 10px) calc(var(--safe-l) + 12px);
          background:linear-gradient(0deg,rgba(20,16,28,.97) 55%,rgba(20,16,28,.80) 100%);
          border-top:1px solid rgba(255,255,255,.07);position:relative;z-index:20}
  #bottom .quest{margin:0 0 9px;font-size:13.5px;line-height:1.5;color:var(--ink);
          background:rgba(255,180,84,.09);border:1px solid rgba(255,180,84,.20);
          border-radius:11px;padding:8px 11px}
  .actionbar{display:flex;gap:7px}
  /* ★엄지로 누르는 자리. 44px 밑으로 내리지 말 것 */
  .actionbar button{flex:1;min-height:var(--tap);font-family:'Jua';font-size:14px;border-radius:12px}
  .actionbar button#next{flex:1.5}
  .actionbar button:disabled{opacity:.42}

  /* ── 바텀시트 (가방·자리·설정) ───────────────────────────────────── */
  #sheet{position:fixed;z-index:40;left:0;right:0;bottom:0;max-height:78dvh;
         transform:translateY(101%);transition:transform .3s cubic-bezier(.22,.9,.3,1);
         background:linear-gradient(180deg,#213326 0,#18241d 42%,#171421 100%);
         border-top:1px solid rgba(255,255,255,.12);border-radius:18px 18px 0 0;
         display:flex;flex-direction:column;box-shadow:0 -14px 40px rgba(0,0,0,.55)}
  #sheet.open{transform:translateY(0)}
  #sheetScrim{position:fixed;z-index:39;inset:0;background:rgba(0,0,0,.5);opacity:0;
         pointer-events:none;transition:opacity .3s}
  #sheetScrim.open{opacity:1;pointer-events:auto}
  #sheet .grip{flex:0 0 auto;width:44px;height:4px;border-radius:3px;margin:9px auto 4px;
         background:rgba(255,255,255,.28)}
  .sheettabs{flex:0 0 auto;display:flex;gap:5px;padding:4px 12px 8px;overflow-x:auto;scrollbar-width:none}
  .sheettabs::-webkit-scrollbar{display:none}
  .sheettabs button{flex:0 0 auto;min-height:36px;padding:0 14px;border-radius:999px;font-size:13px;
         background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);color:var(--dim);
         background-image:none}
  .sheettabs button[aria-selected=true]{background:rgba(255,180,84,.16);border-color:rgba(255,180,84,.42);color:var(--gold)}
  .sheetbody{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
         padding:2px 12px calc(var(--safe-b) + 16px);overscroll-behavior:contain}
  .sheetpage{display:none}  .sheetpage.on{display:block}
  #sheet .box{margin-bottom:9px}
  /* 시트 안에서는 라벨이 세로로 — 폰 폭에서 78px 라벨 + select 는 너무 좁다 */
  #sheet label{flex-direction:column;align-items:stretch;gap:4px}
  #sheet label>span{width:auto;flex:0 0 auto;font-size:11px}
  #sheet select,#sheet input[type=number]{min-height:var(--tap);font-size:14px}
  #sheet .btns button{min-height:var(--tap);flex:1 0 auto}

  /* 아이템 카드 — 폰에서는 한 열 */
  #sheet .inventory{display:grid;grid-template-columns:1fr;gap:8px}
  #sheet .itemcard .place{display:flex;gap:6px;align-items:stretch}
  #sheet .itemcard .place select{flex:1}
  #sheet .itemcard .place button{min-height:var(--tap);padding:0 14px}

  /* 개발용은 접어 둔다 — 플레이어 화면이 아니다 */
  #sheet details.dev summary{min-height:var(--tap);display:flex;align-items:center}

  /* ── 태블릿·좁은 PC — 폰 화면을 가운데 세워 둔다 ─────────────────── */
  @media (min-width:820px) and (min-height:700px){
    body{display:grid;place-items:center;background:#0a0810}
    #app{width:min(420px,96vw);height:min(880px,94dvh);border-radius:26px;overflow:hidden;
         border:1px solid rgba(255,255,255,.12);box-shadow:0 26px 80px rgba(0,0,0,.7)}
    #sheet,#sheetScrim{position:absolute}
  }

  /* ══ PC 와이드 (2026-08-03) ═══════════════════════════════════════════
     ★마크업은 폰과 **같은 한 벌**이다. 시트를 아래에서 오른쪽으로 옮기고
       항상 펴 둘 뿐이다 — 레이아웃을 두 벌 만들면 한쪽이 반드시 낡는다.
     방이 넓게 보이는 것이 이 화면의 값어치다. UI 를 키우는 게 아니다. */
  @media (min-width:1000px) and (min-aspect-ratio:13/10){
    :root{--pane-w:360px}
    /* ★place-items 를 반드시 되돌린다 — 위 820px 규칙이 body 를 grid+center 로 만들었고,
       display 만 block 으로 덮으면 정렬이 남아 #app 이 폭 0 으로 접힌다(실제로 그랬다).
       세 자식이 전부 absolute 라 안에 흐르는 내용이 없어 0 이 되고, 화면이 새까매진다. */
    body{display:block;place-items:normal;background:#0a0810}
    /* ★position:relative — 아래에서 #stage·#topbar·#bottom 을 absolute 로 만든다.
       기준점이 없으면 뷰포트에 붙어 오른쪽 패널 밑으로 깔린다. */
    #app{position:relative;width:calc(100% - var(--pane-w));max-width:none;height:100dvh;
         margin:0;border:0;border-radius:0;box-shadow:none;overflow:hidden}
    /* 시트 = 오른쪽 고정 패널. 항상 열려 있고 스크림·손잡이는 없앤다 */
    #sheet{position:fixed;top:0;right:0;bottom:0;left:auto;width:var(--pane-w);max-height:none;
           transform:none;border-radius:0;border-top:0;border-left:1px solid rgba(255,255,255,.12);
           box-shadow:none}
    #sheet .grip{display:none}
    #sheetScrim{display:none}
    #openBag{display:none}                 /* 늘 보이므로 여는 버튼이 필요 없다 */
    .sheetbody{padding:2px 14px 20px}
    /* 넓으니 라벨을 다시 가로로 — 폰에서 세로로 세운 건 폭이 없어서였다 */
    #sheet label{flex-direction:row;align-items:center}
    #sheet label>span{width:84px;flex:0 0 84px;font-size:12px}
    #sheet .inventory{grid-template-columns:1fr 1fr}
    /* 하단 액션바는 방 위에 얹는다 — 넓은 화면에서 바를 통째로 깔면 방이 눌린다 */
    #bottom{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(20,16,28,.92) 40%,transparent 100%);
            border-top:0;padding:26px 20px 18px}
    #bottom .quest{max-width:620px;margin:0 auto 10px}
    .actionbar{max-width:420px;margin:0 auto}
    #topbar{position:absolute;left:0;right:0;top:0;background:linear-gradient(180deg,rgba(20,16,28,.86) 0,transparent 100%)}
    #topbar .resourcebar{max-width:520px;margin:0 auto}
    #stage{position:absolute;inset:0}
  }
  /* ══ 대화 (2026-08-03) ═══════════════════════════════════════════════
     ★화면을 가리지 않는다. 방과 식물이 위쪽에 계속 보여야 "무슨 얘기 중인지" 읽힌다.
     ★식물신은 초상화가 없다 — first_play.md 확정("대사 한 줄. 외형 없음").
       얼굴 자리에 빛만 둔다. 얼굴을 그려 넣지 말 것. */
  #dlg{position:absolute;z-index:34;left:0;right:0;bottom:0;display:none;
       padding:0 10px calc(var(--safe-b) + 10px);pointer-events:auto}
  #stage.talking #dlg{display:block}
  #dlgBox{position:relative;display:flex;gap:10px;align-items:flex-end;
       min-height:132px;padding:12px 14px 14px;border-radius:16px;
       background:rgba(16,13,24,.94);border:1px solid rgba(255,255,255,.12);
       box-shadow:0 -8px 30px rgba(0,0,0,.5)}
  /* 초상화는 상자 위로 삐져나온다 — 상자 안에 가두면 얼굴이 작아져 안 읽힌다 */
  #dlgFace{flex:0 0 92px;width:92px;height:132px;margin-top:-46px;align-self:flex-end;
       background:center bottom/contain no-repeat;filter:drop-shadow(0 4px 10px rgba(0,0,0,.55))}
  #dlgBox.noface #dlgFace{width:56px;flex-basis:56px;height:56px;margin:0 0 6px;
       border-radius:50%;background:radial-gradient(circle at 50% 45%,
         rgba(255,229,168,.95) 0,rgba(255,190,96,.42) 42%,rgba(255,180,84,0) 72%);
       animation:godPulse 2.6s ease-in-out infinite}
  @keyframes godPulse{0%,100%{opacity:.72;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
  #dlgMain{flex:1;min-width:0}
  #dlgWho{display:inline-block;font-family:'Jua';font-size:12px;color:var(--gold);
       padding:2px 9px;border-radius:999px;background:rgba(255,180,84,.14);margin-bottom:6px}
  #dlgBox.noface #dlgWho{color:#ffe6a8;background:rgba(255,229,168,.13)}
  #dlgText{font-size:15px;line-height:1.55;color:var(--ink);word-break:keep-all;min-height:48px}
  #dlgText b{color:var(--leaf)}
  #dlgNext{position:absolute;right:12px;bottom:9px;font-size:11px;color:var(--dim);
       animation:dlgBob 1.4s ease-in-out infinite}
  @keyframes dlgBob{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(3px);opacity:1}}
  #dlgSkip{position:absolute;right:12px;top:-30px;min-height:30px;padding:0 12px;font-size:11.5px;
       border-radius:999px;background:rgba(16,13,24,.86);border:1px solid rgba(255,255,255,.14);
       color:var(--dim);background-image:none}
  /* 대화 중에는 하단 액션이 눌리면 안 된다 — 대사를 넘기려다 하루가 지나간다 */
  #stage.talking ~ #bottom{opacity:.35;pointer-events:none}

  /* 마우스가 있는 환경에서만 호버를 켠다 — 터치에서 호버는 "탭했는데 안 눌림"이 된다 */
  @media (hover:hover) and (pointer:fine){
    .actionbar button:not(:disabled):hover,.sheettabs button:hover{filter:brightness(1.12)}
    #roomCanvas{cursor:grab}  #roomCanvas:active{cursor:grabbing}
    #stage.placing #roomCanvas{cursor:pointer}
  }
  /* ★ HUD는 iframe 위에 겹치지 않는다. plant_grow 자체 표시와 나란히 놓고 대조한다. */
  #side{width:450px;flex:0 0 450px;height:100%;overflow-y:auto;padding:14px;
        background:linear-gradient(180deg,#213326 0,#18241d 48%,#171421 100%);
        border-right:1px solid rgba(255,255,255,.09)}
  #stage{flex:1;position:relative;background:#0f0c16;overflow:hidden}
  #growth{position:absolute;inset:0;width:100%;height:100%;border:0}
  #growth{transition:opacity .4s,filter .4s}
  /* ★ 식물이 없을 때는 무대를 **실제로 가린다** (2026-08-03).
     예전엔 opacity .18 + blur 라 "아직 몬스테라가 없습니다" 뒤로 화분·잎이 그대로 비쳤고,
     iframe 좌하단 카메라 버튼도 배경에 묻혀 반쯤 읽히는 상태로 남았다 —
     첫 플레이 Day 0 에 몬스테라는 **없는 것**이라(first_play.md §1) 비치면 안 된다.
     display:none 은 쓰지 않는다 — iframe 이 멈추면 growth 계약이 끊긴다. 보이지만 않게 한다. */
  #stage.no-plant #growth{opacity:0;pointer-events:none}
  #stage.no-plant{background:radial-gradient(120% 90% at 50% 46%,#171226 0,#0d0a13 72%)}
  #stageEmpty{display:none;position:absolute;inset:0;z-index:7;place-items:center;pointer-events:none}
  #stage.no-plant #stageEmpty{display:grid}
  #stageEmpty b{font-family:'Jua';font-size:22px;color:#dff8d4;text-align:center;text-shadow:0 3px 15px #000}
  #stageEmpty i{display:block;font:normal 13px 'Gaegu';color:rgba(255,255,255,.62);margin-top:7px}
  /* 빈 무대에도 '올 것'의 그림자는 보여 준다 — 글자만 있으면 무엇을 기다리는지 안 읽힌다 */
  #stageEmpty img{display:block;width:92px;margin:0 auto 12px;opacity:.42;filter:grayscale(.55)}
  h1{font-family:'Jua';font-size:19px;margin-bottom:2px}
  h1 b{color:#ffb454}
  .sub{font-size:12px;color:rgba(255,255,255,.45);margin-bottom:12px}
  .box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);
       border-radius:12px;padding:11px;margin-bottom:10px}
  .box>h3{font-family:'Jua';font-size:12px;color:#ffb454;margin-bottom:8px;letter-spacing:.5px}
  label{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:7px}
  label>span{width:78px;color:rgba(255,255,255,.55);flex:0 0 78px}
  select,input[type=number]{flex:1;min-width:0;font:inherit;font-size:12px;padding:5px 7px;border-radius:8px;
       border:1px solid rgba(255,255,255,.14);background:#241d33;color:#f2eef8}
  .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  /* ★ 버튼 바탕은 2D 에셋(assets/ui/button_plate_*.png)이다. 색만 다른 세 판을

<!-- ★ 부팅 감시 — **모듈 밖에서** 지켜본다 (2026-08-03).
     아래 module 스크립트는 top-level import 와 top-level await 를 쓴다. 그 둘이 실패하면
     본문이 한 줄도 실행되지 않아 **맨 아래 try/catch 가 아예 돌지 않는다** —
     화면에는 아무 안내도 없고 [다음 날]만 잠긴 채로 남는다. 플레이어에게는
     "눌러도 아무 일이 없다"로만 보이고, 그게 제일 늦게 발견되는 종류의 고장이다.
     그래서 ① 스크립트 로드 실패 ② 처리 안 된 거절(top-level await) ③ 부팅 신호 미도착
     셋을 밖에서 잡아 한 줄이라도 띄운다. 진행 버튼은 원래 잠긴 채이므로 여기서 건드리지 않는다. -->
<script>
(function () {
  var shown = false;
  function say(why) {
    if (shown || window.__byeotBooted) return;
    shown = true;
    /* ★폰 세로로 바뀌며 #side 가 없어졌다. 하단 액션바 위에 띄운다 —
       화면 밖으로 밀리면 "버튼이 안 눌린다"만 남고 이유는 안 보인다. */
    var host = document.getElementById('bottom') || document.body;
    host.insertAdjacentHTML('afterbegin',
      '<div class="err" style="margin-bottom:8px">⛔ 게임 코드를 불러오지 못했습니다 — 진행 버튼은 잠긴 채로 둡니다<br>' +
      String(why) +
      '<br>파일을 직접 연 것이라면 <code>python tools/serve.py</code> 로 띄운 주소에서 열어 주세요.</div>');
  }
  /* 자원(script/모듈) 로드 실패는 버블링하지 않는다 — 캡처 단계에서만 잡힌다 */
  window.addEventListener('error', function (e) {
    if (e && e.target && e.target !== window && e.target.tagName === 'SCRIPT')
      say('모듈 파일을 읽지 못했습니다 — ' + (e.target.src || '경로 미상'));
  }, true);
  /* top-level await 안에서 던진 것(fetch 실패·HTTP 오류)은 여기로 온다 */
  window.addEventListener('unhandledrejection', function (e) {
    say((e && e.reason && e.reason.message) || '부팅 중 처리되지 않은 오류');
  });
  setTimeout(function () { say('20초 안에 부팅이 끝나지 않았습니다'); }, 20000);
})();
</script>

<!-- ══ 폰 세로 셸 조작 (2026-08-03) ═══════════════════════════════════════
     시트 열고 닫기 · 탭 · 확대 오버레이. **모듈 밖 classic 스크립트**로 둔다 —
     게임 로직이 못 뜨더라도 화면은 최소한 움직여야 원인을 볼 수 있다.
     게임 상태는 하나도 안 만진다. 여기는 껍데기 조작만 한다. -->
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var sheet = $('sheet'), scrim = $('sheetScrim'), stage = $('stage');

  /* ── 바텀시트 ───────────────────────────────────────────────────── */
  function openSheet(tab) {
    sheet.classList.add('open'); scrim.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');
    if (tab) selectTab(tab);
  }
  function closeSheet() {
    sheet.classList.remove('open'); scrim.classList.remove('open');
    sheet.setAttribute('aria-hidden', 'true');
  }
  $('openBag').addEventListener('click', function () { openSheet('tabBag'); });
  scrim.addEventListener('click', closeSheet);

  /* 손잡이를 아래로 끌면 닫힌다 — 폰에서 스크림을 정확히 누르기 어렵다 */
  (function () {
    var y0 = null;
    var grip = sheet.querySelector('.grip');
    function start(e) { y0 = (e.touches ? e.touches[0] : e).clientY; }
    function move(e) {
      if (y0 == null) return;
      var dy = (e.touches ? e.touches[0] : e).clientY - y0;
      if (dy > 0) sheet.style.transform = 'translateY(' + dy + 'px)';
    }
    function end(e) {
      if (y0 == null) return;
      var dy = ((e.changedTouches ? e.changedTouches[0] : e).clientY) - y0;
      sheet.style.transform = '';
      y0 = null;
      if (dy > 70) closeSheet();
    }
    ['touchstart', 'mousedown'].forEach(function (t) { grip.addEventListener(t, start, { passive: true }); });
    ['touchmove', 'mousemove'].forEach(function (t) { grip.addEventListener(t, move, { passive: true }); });
    ['touchend', 'mouseup', 'touchcancel'].forEach(function (t) { grip.addEventListener(t, end); });
  })();

  /* ── 탭 ─────────────────────────────────────────────────────────── */
  var TABS = { tabBag: 'pageBag', tabRoom: 'pageRoom', tabDev: 'pageDev' };
  function selectTab(tabId) {
    Object.keys(TABS).forEach(function (t) {
      var on = (t === tabId);
      $(t).setAttribute('aria-selected', String(on));
      $(TABS[t]).classList.toggle('on', on);
    });
    var body = sheet.querySelector('.sheetbody'); if (body) body.scrollTop = 0;
  }
  Object.keys(TABS).forEach(function (t) {
    $(t).addEventListener('click', function () { selectTab(t); });
  });

  /* ── 확대 오버레이 ─────────────────────────────────────────────────
     방에서 화분을 탭하면 열린다. 지금은 방 3D 가 붙기 전이라 무대 탭으로도 열린다 —
     room_view 가 붙으면 onPlantTap 이 이 함수를 부른다. */
  window.__byeotZoom = {
    open: function () { stage.classList.add('zoom'); closeSheet(); },
    close: function () { stage.classList.remove('zoom'); },
    isOpen: function () { return stage.classList.contains('zoom'); }
  };
  $('closeZoom').addEventListener('click', window.__byeotZoom.close);
  /* 안드로이드 뒤로가기·ESC 로도 닫힌다 */
  window.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (window.__byeotZoom.isOpen()) window.__byeotZoom.close();
    else if (sheet.classList.contains('open')) closeSheet();
  });

  /* ── 방 3D 가 아직 없을 때의 안내 ───────────────────────────────────
     room_view.js 가 붙기 전까지는 캔버스가 비어 있다. 빈 검은 화면만 두면
     "고장났나"로 읽히므로, 무엇을 기다리는 중인지 적어 둔다. */
  window.__byeotRoomFallback = function (msg) {
    stage.classList.add('room-failed');
    $('roomFallback').innerHTML = msg;
  };
  window.__byeotSheet = { open: openSheet, close: closeSheet, tab: selectTab };
})();
</script>

<script type="module">
import { newState, SIM_MODES, pot0, pushLog, givePlant, hasPlant, ARRIVAL } from './src/game/state.js';
import {
  FIRST_PLAY_ASSETS,
  firstPlayRulesFromBalance,
  openSiruContractFromManifest,
  moveMonstera,
  placeBeansprout,
  slotFitsDiameter
} from './src/game/first_play.js';
import { createLightEngine } from './src/game/light_adapter.js';
import { createGrowthAdapter } from './src/game/growth_adapter.js';
import { createDialogue, SPEAKERS } from './src/game/dialogue.js';
import { nextDay, runDays, avg, rollingAvg,
         startFastForward, stopFastForward, isFastForwarding, nextEventPreview,
         timeModeOf } from './src/game/loop.js';
import { renderHUD, renderLog, renderReport, renderSpark } from './src/game/ui.js';

const ARRIVAL_POT_D = FIRST_PLAY_ASSETS.monsteraPotDiameterM;
const $ = (id) => document.getElementById(id);
const side = $('side');

/* ---- 데이터 (house = 구조·에셋 / balance = plan 소유 튜닝값) ---- */
const j = (p, fb) => fetch(p).then(r => r.json()).catch(() => fb);
const [houseRooms, winPresets, doorPresets, finishes, furnPresets, lightPresets, shadePresets,
       lightTh, weatherBalance] = await Promise.all([
  j('./data/house_rooms.json', { rooms: {} }),
  j('./data/window_presets.json', {}).then(d => d.presets || d),
  j('./data/door_presets.json', {}).then(d => d.presets || d),
  j('./data/room_finishes.json', null),
  j('./data/furniture_presets.json', {}).then(d => d.presets || d),
  j('./data/lighting_presets.json', {}),
  j('./data/shading_presets.json', { presets: {} }),
  j('./data/balance/light_thresholds.json', null),
  j('./data/balance/weather.json', null)
]);

const io = {
  light: createLightEngine({ houseRooms, winPresets, doorPresets, finishes, furnPresets,
                             lightPresets, shadePresets, lightTh, weatherBalance }),
  growth: createGrowthAdapter($('growth'))
};

const balanceResponse = await fetch('./data/balance/characters.json');
if (!balanceResponse.ok) throw new Error(`[첫 플레이] characters.json HTTP ${balanceResponse.status}`);
const FIRST_RULES = firstPlayRulesFromBalance(await balanceResponse.json());
const manifestResponse = await fetch('./assets/manifest.json');
if (!manifestResponse.ok) throw new Error(`[첫 플레이] assets/manifest.json HTTP ${manifestResponse.status}`);
const OPEN_SIRU = openSiruContractFromManifest(await manifestResponse.json());
/* ★ 수확 뒤에 썸네일을 콩나물 낱개(`crops/thumbs/beansprout_l`)로 바꿔 봤다가 되돌렸다 —
   낱개 원화는 거의 흰색 세로 막대라 46px 슬롯에서 흰 덩어리로만 읽혔다.
   반지하 저채도 톤에서 가장 밝은 물체가 되어 버려서, 시루 하나로 끝까지 간다. */
let S = newState({ room: 'banjiha', mode: 'novice', firstPlay: true, firstPlayRules: FIRST_RULES });
let lastTurn = null;
/* ★ 표시 전용 — 몬스테라가 **도착한** 자리. first_play 는 옮기면 slotId 를 덮어써서
   "아직 그 자리인가"를 나중에 물어볼 수 없다. 상태를 고치지 않고 화면 쪽에서 기억한다.
   왜 필요한가: 단계(fp.phase)는 [다음 날]을 눌러 새순이 올라야 move_monstera 를 벗어난다.
   그래서 옮긴 직후 한 프레임 동안 카드는 "창턱 화분받침"인데 퀘스트는 "옮겨 보세요"였다 —
   두 곳이 서로 다른 말을 하면 플레이어는 자기 선택이 먹혔는지 알 수 없다. */
let arrivalSlotId = null;
$('cropThumb').src = OPEN_SIRU.thumbnail;

/* ---- 셀렉트 채우기 ---- */
$('room').innerHTML = io.light.rooms()
  .map(r => `<option value="${r.id}">${r.label} (${r.light})</option>`).join('');
$('mode').innerHTML = Object.entries(SIM_MODES)
  .map(([k, m]) => `<option value="${k}">${m.ko}</option>`).join('');

function fillLamps() {
  const n = io.light.growLampCount();
  $('lamps').innerHTML = Array.from({ length: n + 1 }, (_, i) =>
    `<option value="${i}">${i}개${i === 0 ? ' (자연광만)' : ''}</option>`).join('');
  $('lamps').value = String(Math.min(S.lamps.count, n));
  S.lamps.count = +$('lamps').value;
}

/* 자리 목록 — 오늘 조건에서 밝은 순. 계약을 미리 한 번 돌려 보는 것이라 이력에 쌓이지 않는다. */
/* 자리 목록 — 오늘 조건에서 밝은 순.
   ★ 등을 켜면 순위가 바뀐다(자연광 최고 자리 ≠ 등 밑 자리). 화분은 자동으로 안 옮긴다 —
     옮기는 건 플레이어의 선택이어야 하고, 그 차이가 이 게임의 핵심이다.
   pick=true 일 때만(방을 새로 조립할 때) 가장 밝은 자리로 놓는다.
   ★ 식물이 아직 도착 전이면 목록만 채우고 화분은 건드리지 않는다. */
/* 사람이 읽는 자리 이름. raw slotId(`banjiha-shelf_etagere_3tier-7:0`)나 "0단"은
   플레이어 언어가 아니다 — 가구 이름 + 1부터 세는 칸 번호로 바꾼다. */
/* 가구 종류 → 사람이 쓰는 이름. **키워드 포함**으로 찾는다 —
   slotId 는 `{가구 uid}:{단}` 이고 uid 는 `banjiha-sill` 처럼 프리셋 이름이 아닐 수도 있어서
   앞뒤를 잘라 맞추면 raw 문자열이 그대로 화면에 남는다(실제로 남았다). */
const FURN_KO = [
  ['sill', '창턱 화분받침'], ['etagere', '3단 선반'], ['ladder', '사다리 선반'],
  ['growrack', '재배 선반'], ['cart', '이동 선반'], ['shelf_low', '낮은 선반'], ['shelf', '선반'],
  ['plant_step', '화분 계단'], ['pedestal', '화분 받침대'], ['nightstand', '협탁'],
  ['dresser', '서랍장'], ['desk_student', '학생 책상'], ['desk', '책상'], ['table_round', '원탁'],
  ['table', '탁자'], ['shoe_cabinet', '신발장'], ['locker', '사물함'], ['lectern', '교탁'],
  ['bed', '침대'], ['wardrobe', '옷장'], ['sofa', '소파']
];
function slotLabel(slotId) {
  const [uid, tier] = String(slotId || '').split(':');
  const key = uid.toLowerCase();
  /* 물리 슬롯이 알려 주는 종류(owner)를 먼저 보고, 없으면 uid 키워드로 찾는다 */
  const owner = ((io.light.room && io.light.room.slots) || [])
    .find(s => s.slotId === slotId);
  const hay = `${owner && owner.owner ? owner.owner : ''} ${key}`.toLowerCase();
  const hit = FURN_KO.find(([k]) => hay.includes(k));
  const ko = hit ? hit[1] : '가구';
  const n = Number(tier);
  /* ★ "0단" 금지 — 사람은 1부터 센다. 칸이 하나뿐인 가구는 번호를 붙이지 않는다. */
  if (!Number.isFinite(n)) return ko;
  const sameOwner = ((io.light.room && io.light.room.slots) || [])
    .filter(s => String(s.slotId).split(':')[0] === uid).length;
  return sameOwner > 1 ? `${ko} ${n + 1}번 칸` : ko;
}

function fillSlots(pick) {
  const preview = io.light.daily(S.day + 1, S).report;
  const roomSlot = new Map((io.light.room.slots || []).map(s => [s.slotId, s]));
  /* ★ 몬스테라 화분이 **물리적으로 올라가는** 자리만 보여 준다 — 치수가 숫자로 확인된 슬롯만.
     못 올라가는 자리를 고를 수 있으면 배치 규칙이 화면에서만 사라진 것이다. */
  const fits = preview.slots.filter(s =>
    slotFitsDiameter(roomSlot.get(s.slotId) || s, ARRIVAL_POT_D));
  /* ★ 첫 플레이는 **완료 뒤에도** 정답순·원시 DLI를 숨긴다(무엇이 밝은지는 방을 보고 배우는 것).
     개발 검수 시나리오(첫 플레이 꺼짐)만 예전처럼 밝은 순 + DLI 를 본다. */
  const devMode = !(S.firstPlay && S.firstPlay.enabled);
  const list = devMode
    ? [...fits].sort((a, b) => b.dli - a.dli)
    : [...fits].sort((a, b) => slotLabel(a.slotId).localeCompare(slotLabel(b.slotId), 'ko'));
  $('slot').innerHTML = list.map(s =>
    `<option value="${s.slotId}">${slotLabel(s.slotId)}${devMode ? ` — DLI ${s.dli.toFixed(2)}` : ''}</option>`
  ).join('');
  const p = pot0(S);
  if (p && (pick || !list.some(s => s.slotId === p.slotId)))
    p.slotId = list[0] ? list[0].slotId : null;
  $('slot').value = (p && p.slotId) || (list[0] ? list[0].slotId : '');
  $('slot').disabled = !p;
}

/* 열린 시루는 방 슬롯 DLI를 그대로 받는다. 실제 지름이 올라가는 자리만 보여 준다.
   기본 UI는 DLI·정답순을 숨긴다 — 무엇이 어두운지는 방을 보고 고르는 학습 대상이다. */
function cropCandidates() {
  const preview = io.light.daily(S.day + 1, S).report;
  const roomSlot = new Map((io.light.room.slots || []).map(s => [s.slotId, s]));
  /* ★ 치수가 숫자로 확인된 자리만. `maxPotD == null` 을 통과시키면 시루가 못 올라가는
     자리에 조용히 놓인다(폴백 금지 — loop.js 의 몬스테라 후보와 같은 규칙). */
  return [...preview.slots].filter(s =>
    slotFitsDiameter(roomSlot.get(s.slotId) || s, OPEN_SIRU.diameterM));
}

function fillCropSlots() {
  const list = cropCandidates().sort((a, b) => a.slotId.localeCompare(b.slotId));
  $('cropSlot').innerHTML = list.map(s =>
    `<option value="${s.slotId}">${slotLabel(s.slotId)}</option>`).join('');
  if (S.firstPlay.beansprout.slotId) $('cropSlot').value = S.firstPlay.beansprout.slotId;
  /* ★ 수확 전이면 언제든 옮길 수 있다 (2026-08-02 정정).
     예전엔 하루라도 자라면 잠가서, 그 자리의 조도 계약이 깨지면 고칠 방법이 없었다. */
  const locked = S.firstPlay.beansprout.harvested;
  $('cropSlot').disabled = locked;
  $('placeCrop').disabled = locked || !list.length;
}

/* ★ 개체 도착 경계. Day 4 선물과 개발 시나리오가 같은 원자적 생성 함수를 쓴다.
   앱을 열었다고 식물이 생기지 않는다 — 이 경계를 통과해야 생긴다.
   setGrowth(143) 는 여기서 딱 한 번. 그 뒤 하루 진행은 전부 advanceTo 다. */
function arrive(slotId) {
  if (hasPlant(S)) return pot0(S);
  const p = givePlant(S, io, { slotId: slotId || $('slot').value || null });
  arrivalSlotId = p.slotId;
  renderLog($('log'), S);
  return p;
}

function buildRoom(id) {
  io.light.build(id);
  io.light.clearCache();
  S.home.room = id;
  if (pot0(S)) pot0(S).slotId = null;
  fillLamps();
  fillSlots(true);          // 새 방에서는 가장 밝은 자리에 놓고 시작한다
  if (S.firstPlay && S.firstPlay.enabled) fillCropSlots();
  draw();
}

/* ★ 코어 한글 표는 삭제했다 (2026-08-02). growth 의 `phaseKo` 를 그대로 쓴다 —
   표를 들면 growth 가 단계를 늘리거나 이름을 바꿀 때 **오류 없이 틀린 라벨**이 뜬다.
   실제로 그 표엔 seed·sprout 가 빠져 조용히 '도착함' 으로 떨어지고 있었다.
   phaseKo 가 없는 옛 growth 면 phaseId 키를 그대로 보여준다(조용히 비우지 않는다). */
const phaseLabel = (gp) => (gp && (gp.phaseKo || gp.phaseId)) || null;

function drawJourney() {
  const fp = S.firstPlay;
  if (!fp || !fp.enabled) return;
  const crop = fp.beansprout, food = fp.food, plant = fp.monstera;
  $('resDay').textContent = `Day ${S.day}`;
  $('resFood').textContent = `${food.cashFoodWon.toLocaleString()}원`;
  $('resSaved').textContent = `${food.totalFoodSavedWon.toLocaleString()}원`;
  $('cropMeter').style.width = `${Math.min(100, crop.ageDays / crop.harvestDays * 100)}%`;
  $('cropState').textContent = crop.harvested ? `${crop.meals}끼 수확 완료`
    : crop.slotId ? `${crop.ageDays}/${crop.harvestDays}일 자람` : '가방에 있음';
  $('cropInfo').textContent = crop.harvested
    ? `${crop.meals}끼 수확 · 수확일 ${Math.min(crop.meals, fp.rules.dailyCropMealCap)}끼 사용 · 남은 ${food.pantryMeals}끼`
    : crop.slotId ? `자리 ${slotLabel(crop.slotId)}` : '4일 뒤 첫 수확';
  /* 표시만 바꾼다 — 몬스테라 슬롯은 도착 전까지 빛이 죽어 있다 */
  $('plantCard').classList.toggle('locked', !plant.arrived);

  const gp = plant.growthPhase;
  $('plantMeter').style.width = `${gp ? Math.round(gp.progress01 * 100) : 0}%`;
  $('plantState').textContent = !plant.arrived ? '아직 만나지 못함'
    : fp.completed ? '첫 새순 확인!' : (phaseLabel(gp) || '도착함');
  $('plantInfo').textContent = !plant.arrived ? '콩나물 첫 수확 뒤 도착'
    : fp.completed ? `말린 새순 단계 시작 · ${gp ? Math.round(gp.progress01 * 100) : 0}%`
    : `${slotLabel(plant.slotId)} · ${gp ? Math.round(gp.progress01 * 100) + '%' : '준비 중'}`;

  const quest = {
    place_beansprout: '가방의 열린 시루를 방 안 어두운 자리에 놓아 보세요.',
    grow_beansprout: `콩나물이 자라는 중입니다. 수확까지 ${Math.max(0, crop.harvestDays - crop.ageDays)}일.`,
    monstera_gift: '콩나물을 수확했습니다. 새로운 화분이 옵니다.',
    move_monstera: '몬스테라는 어두운 자리에서 자라지 않습니다. 높은 창가 자리로 옮겨 보세요.',
    /* ★ 형태가 오르기 시작하면 여기로 넘어온다(first_play.markMonsteraPhase).
       "옮겨 보세요"가 옮긴 뒤에도 남아 있으면 플레이어는 자기 선택이 먹혔는지 알 수 없다. */
    grow_monstera: '자리를 옮긴 뒤부터 새순이 오르고 있습니다. 말린 새순이 설 때까지 하루씩 넘겨 보세요.',
    complete: '말린 새순이 나왔습니다! 어두운 자리와 밝은 자리를 모두 찾았습니다.'
  };
  /* ★ 옮긴 직후에도 "옮겨 보세요"가 남지 않게 한다 — 단계는 아직 move_monstera 지만
     플레이어는 이미 옮겼다. 판정(새순이 오르는지)은 하루를 넘겨야 나오므로 그렇게 말해 준다. */
  const justMoved = fp.phase === 'move_monstera' && plant.arrived &&
                    arrivalSlotId != null && plant.slotId !== arrivalSlotId;
  $('quest').textContent = justMoved
    ? `${slotLabel(plant.slotId)}(으)로 옮겼습니다. [다음 날]을 눌러 새순이 오르는지 보세요.`
    : (quest[fp.phase] || '첫 플레이를 진행하세요.');
  $('slot').disabled = !plant.arrived;
  /* 30일 자동은 개발용 장기 관찰이다. 첫 학습 루프를 끝내기 전에는 우회 진입시키지 않는다. */
  $('run30').disabled = !fp.completed;
  $('stage').classList.toggle('no-plant', !plant.arrived);
  fillCropSlots();
}

function draw() {
  renderHUD($('hud'), S, lastTurn, io);
  renderLog($('log'), S);
  drawJourney();
  ffHint();                 /* 상태가 바뀌면 "무엇까지 감는지"도 바뀐다 */
  syncRoom();               /* 방 전경도 같은 상태를 본다 — 화면이 둘로 갈리면 안 된다 */
}

/* ---- 배선 ---- */
$('room').onchange = e => buildRoom(e.target.value);
$('slot').onchange = e => {
  if (pot0(S)) {
    pot0(S).slotId = e.target.value;
    if (S.firstPlay.enabled) moveMonstera(S.firstPlay, e.target.value);
    pushLog(S, `🪴 몬스테라를 ${slotLabel(e.target.value)}(으)로 옮겼습니다`);
    unlockAfterFix();
    /* ★도착 자리에서 벗어난 순간이 두 번째 학습이 일어난 순간이다 */
    if (arrivalSlotId && e.target.value !== arrivalSlotId) dlgOpen('monsteraMoved');
    syncRoom();
  }
  draw();
};
$('lamps').onchange = e => { S.lamps.count = +e.target.value; io.light.clearCache(); fillSlots(); draw(); };
$('lit').onchange = e => { S.lamps.litHours = Math.max(0, Math.min(24, +e.target.value || 0)); io.light.clearCache(); draw(); };
$('mode').onchange = e => { S.sim.mode = e.target.value; io.light.clearCache(); draw(); };
$('placeCrop').onclick = guard(() => {
  const target = $('cropSlot').value;
  const r = placeBeansprout(S.firstPlay, target);
  pushLog(S, r.moved
    ? `🥣 열린 시루를 ${slotLabel(target)}(으)로 옮겼습니다 — 지금까지 받은 ${r.keptDays}일치 빛은 그대로입니다`
    : `🥣 열린 시루를 ${slotLabel(target)}에 두었습니다`);
  unlockAfterFix();                    // 자리를 고쳤으니 다시 시도할 수 있다
  dlgOpen('cropPlaced');
  syncRoom();
  draw();
});

/* loop.js 는 UI를 모른다 — S와 turn을 받아 화면을 그리는 건 여기 몫이다(헤드리스 시뮬 대비) */

/* ★ 계약이 끊기면(iframe 새로고침 등) 진행 버튼을 도로 잠그고 이유를 띄운다.
   조용히 넘어가면 '눌렀는데 아무 일도 안 남'이 되고, 그게 제일 늦게 발견된다. */
/* ★ 고칠 수 있는 실수는 잠그지 않는다 (2026-08-02 정정).
   예전엔 어떤 예외든 진행 버튼을 전부 껐고 다시 켜는 곳이 부팅밖에 없었다 —
   "시루를 먼저 놓아 주세요" 한 번이면 새로고침 전까지 게임이 죽었다.
   되돌려진 턴(core_rolled_back)·시작도 안 한 턴(not_started)·입력 실수는 **고쳐서 다시** 하면 된다.
   반대로 growth 가 이미 진행됐거나(growth_advanced) 진행 여부를 모르는(unknown) 경우만 잠근다 —
   그때 계속 누르면 어긋남이 조용히 쌓인다. */
/* ★ not_started 는 **growth 계약 단절**이다 — 고쳐서 다시 누를 수 있는 실수가 아니다.
   복구 가능은 ① 입력 안내(firstPlayInput) ② 되돌려진 턴(core_rolled_back) 둘뿐이다. */
const RECOVERABLE_TURN_STATES = new Set(['core_rolled_back']);
function isRecoverable(e) {
  if (e && e.recoverable === true) return true;
  if (e && e.turnState) return RECOVERABLE_TURN_STATES.has(e.turnState);
  return !!(e && e.firstPlayInput);          // 시루 미배치 같은 입력 안내
}
/* 자리를 고쳤을 때 다시 열어 주는 창구 — 잠긴 채로 방치하지 않는다. */
function unlockAfterFix() {
  if (document.body.dataset.hardLock === '1') return;   // 어긋남 잠금은 안 푼다
  GATED.forEach(id => { $(id).disabled = false; });
  if (S.firstPlay && S.firstPlay.enabled) $('run30').disabled = !S.firstPlay.completed;
}

function guard(fn) {
  return (...a) => {
    try { return fn(...a); }
    catch (e) {
      const recoverable = isRecoverable(e);
      if (!recoverable) { GATED.forEach(id => { $(id).disabled = true; }); document.body.dataset.hardLock = '1'; }
      /* drawn===false 처럼 **하루는 진행된** 예외는 턴을 싣고 온다 — 버리지 않고 그린다.
         화면이 어제 상태로 남으면 플레이어는 무슨 일이 있었는지 알 길이 없다. */
      if (e.turn) { lastTurn = e.turn; }
      pushLog(S, (recoverable ? '⚠ ' : '⛔ ') + e.message);
      renderLog($('log'), S);
      try { draw(); } catch { /* 그리기까지 실패하면 로그만 남긴다 */ }
      const stateText = {
        not_started: '계약 확인에서 멈춰 오늘은 시작되지 않았습니다',
        core_rolled_back: '코어 날짜를 되감았습니다',
        growth_input_recorded: '날짜는 되감았지만 growth에 오늘 빛 입력이 남았을 수 있습니다',
        growth_advanced: 'growth는 하루 진행됐고 이 턴 결과만 받지 못했습니다',
        unknown: 'growth 진행 여부를 확인할 수 없어 상태를 잠갔습니다'
      }[e.turnState] || (recoverable ? '고친 뒤 다시 [다음 날]을 누르면 됩니다'
                                     : '진행 상태를 확인할 수 없어 멈췄습니다');
      side.insertAdjacentHTML('afterbegin',
        `<div class="err">${recoverable ? '⚠ 오늘은 진행되지 않았습니다' : '⛔ 진행을 멈췄습니다'} — ` +
        `${stateText}<br>${e.message}</div>`);
      console.error(e);
    }
  };
}

/* Day 4 엔 수확과 도착이 같은 턴에 난다 — 모아서 한 번에 띄운다(위 banners 주석). */
function showFirstPlayEvents(turn) {
  const ev = turn && turn.firstPlayEvent;
  const events = [];
  if (ev && ev.harvested) {
    events.push({ title: `🥣 콩나물 ${ev.meals}끼 수확!`,
      sub: `오늘 식비 ${ev.cashFoodWon.toLocaleString()}원 · ${ev.foodSavedWon.toLocaleString()}원 절감` });
  }
  if (turn && turn.plantArrived) {
    arrivalSlotId = pot0(S).slotId;          // 표시용 — 옮겼는지 비교할 기준점
    fillSlots(false);
    $('slot').value = pot0(S).slotId;
    /* ★식물신 대사를 배너 부제에서 뺐다. 계약 순서가 수확 → 식비 → **식물신** → 도착이라
       도착 배너에 붙이면 순서가 뒤집히고, 누가 하는 말인지도 화면에서 안 보였다.
       이제 대화로 나온다(dialogue.js SCRIPTS.god1). */
    events.push({ title: '🪴 몬스테라가 도착했습니다', sub: '창가가 아닌 자리에 놓였습니다' });
  }
  if (S.firstPlay.completed)
    events.push({ title: '🌱 말린 새순이 나왔어요!', sub: '자리에 따라 필요한 빛이 다릅니다.' });
  banners(events);

  /* 배너는 숫자를, 대화는 뜻을 말한다. 둘 다 있어야 "얼마"와 "왜"가 같이 남는다. */
  const ids = [];
  if (ev && ev.harvested)       ids.push('harvest', 'god1');
  if (turn && turn.plantArrived) ids.push('monsteraArrived');
  if (S.firstPlay.completed)     ids.push('spearFurled');
  if (ids.length) dlgOpen(ids);
}

$('next').onclick = guard(() => {
  if (!S.firstPlay.beansprout.slotId) {
    const e = new Error('가방의 열린 시루를 먼저 방 안에 놓아 주세요');
    e.firstPlayInput = true;                 // 안내지 고장이 아니다 — 버튼을 잠그지 않는다
    throw e;
  }
  lastTurn = nextDay(S, io).turn;
  showFirstPlayEvents(lastTurn);
  draw();
});

/* ══ 대화 ═══════════════════════════════════════════════════════════════
   ★대사 순서는 계약이다 — Day 4 는 수확 → (식비는 화면이 숫자로) → 식물신 → 도착.
     dialogue.js 가 그 줄 세우기를 갖고 있고 여기서는 그리기만 한다. */
const dlg = createDialogue();
const FACE_FILE = {
  jachwi: { base: 'neutral', happy: 'happy',   worry: 'worried' },
  moni:   { base: 'neutral', happy: 'excited', sad:   'sad'     }
};
function dlgPaint() {
  const line = dlg.current();
  if (!line) { $('stage').classList.remove('talking'); ffResume(); return; }
  const sp = SPEAKERS[line.who] || { ko: line.who, portrait: false };
  const box = $('dlgBox');
  box.classList.toggle('noface', !sp.portrait);
  $('dlgWho').textContent = sp.ko;
  /* **굵게** 만 지원한다 — 대사에 HTML 을 넣게 두면 데이터가 코드가 된다 */
  $('dlgText').innerHTML = String(line.text)
    .replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  if (sp.portrait) {
    /* 표정 키 → 실제 파일명. 대사 데이터는 뜻으로 쓰고(happy·worry·sad) 파일 이름은 여기서만 안다 —
       초상화를 다시 뽑아 이름이 바뀌어도 대사는 안 고친다. */
    const file = (FACE_FILE[line.who] || {})[line.face || 'base'] || 'neutral';
    const dir = './assets/characters/portraits';
    /* 표정이 없으면 기본으로 떨어진다 — 없는 그림 하나에 대화가 멈추면 안 된다 */
    $('dlgFace').style.backgroundImage =
      `url(${dir}/portrait_${line.who}_${file}.png), url(${dir}/portrait_${line.who}_neutral.png)`;
  } else $('dlgFace').style.backgroundImage = '';   /* ★식물신 — CSS 의 빛이 드러나야 한다 */
  $('stage').classList.add('talking');
}
/* 대화가 뜨면 빨리감기를 세운다 — 말하는 동안 날짜가 계속 가면 대사와 화면이 어긋난다 */
let ffWasRunning = false;
function dlgOpen(scriptIds) {
  const ids = [].concat(scriptIds).filter(Boolean);
  let any = false;
  for (const id of ids) { try { if (dlg.push(id)) any = true; } catch (e) { console.warn(e.message); } }
  if (!any) return false;
  if (isFastForwarding()) { ffWasRunning = true; stopFastForward('stopped'); }
  dlgPaint();
  return true;
}
function ffResume() { ffWasRunning = false; }     /* 자동 재개는 안 한다 — 읽고 나서 직접 누른다 */
$('dlgBox').addEventListener('click', () => { dlg.next(); dlgPaint(); });
$('dlgSkip').addEventListener('click', (e) => { e.stopPropagation(); dlg.skip(); dlgPaint(); });

/* ══ 방 3D 전경 ═══════════════════════════════════════════════════════════
   ★여기가 게임 화면이다. iframe#growth 는 화분을 탭했을 때 올라오는 상세다.
   room_view.js 는 별도 모듈이라 아직 없을 수 있다 — **없어도 게임은 돌아간다.**
   빈 검은 화면만 두면 "고장났나"로 읽히므로 무엇을 기다리는지 적어 둔다. */
let roomView = null;
async function bootRoomView() {
  let mod = null;
  try { mod = await import('./src/game/room_view.js'); }
  catch {
    window.__byeotRoomFallback(
      '방 전경은 아직 준비 중입니다.<br>화분을 탭하는 대신 아래 <b>가방</b>에서 자리를 고를 수 있습니다.');
    return;
  }
  try {
    roomView = await mod.createRoomView($('roomCanvas'), {
      roomId: S.home.room, lightEngine: io.light,   /* ★S.room 이 아니다 — state.js 는 home.room 에 둔다 */
      onPlantTap: () => window.__byeotZoom.open(),
      onSlotTap: (slotId) => placeMode.pick(slotId),
      onError: (e) => window.__byeotRoomFallback('방을 그리지 못했습니다 — ' + (e && e.message || e))
    });
    syncRoom();
    addEventListener('resize', () => roomView && roomView.resize());
  } catch (e) {
    window.__byeotRoomFallback('방을 그리지 못했습니다 — ' + (e && e.message || e));
  }
}
/* 코어 상태 → 방 화면. 한 방향으로만 흐른다 — 방이 게임 상태를 바꾸지 않는다. */
/* ⚠ setPlant 는 GLB 를 싣느라 **Promise 를 돌려준다**(모듈 실제 시그니처).
   try/catch 로는 거절을 못 잡으므로 .catch 를 반드시 붙인다 —
   안 붙이면 화분이 조용히 안 나타나고 콘솔에만 남는다. */
let syncSeq = 0;
function syncRoom() {
  if (!roomView) return;
  const my = ++syncSeq;                 // 늦게 끝난 옛 요청이 새 상태를 덮어쓰지 않게
  const p = pot0(S);
  const b = S.firstPlay && S.firstPlay.beansprout;
  const warn = (what) => (e) => {
    if (my !== syncSeq) return;         // 이미 지난 요청이면 조용히 버린다
    console.warn('[방] ' + what + ' 갱신 실패 —', (e && e.message) || e);
  };
  try {
    Promise.resolve(roomView.setPlant(p && p.slotId, p ? {
      kind: 'monstera',
      phaseId: lastTurn && lastTurn.growthPhase && lastTurn.growthPhase.phaseId,
      progress01: lastTurn && lastTurn.growthPhase && lastTurn.growthPhase.progress01,
      band: lastTurn && lastTurn.band,
      fade: p.fade
    } : null)).catch(warn('몬스테라'));
    if (b && b.slotId) {
      /* ★progress01 을 반드시 넘긴다. 안 넘기면 room_view 안에서 lerp(4,11,undefined)가
         NaN 이 되어 **시루만 놓이고 콩나물이 0포기** 난다 — 빈 그릇만 보인다. */
      const days = S.firstPlay.rules ? S.firstPlay.rules.harvestDays : 4;
      const p01 = Math.max(0, Math.min(1, (b.ageDays || 0) / Math.max(1, days)));
      Promise.resolve(roomView.setPlant(b.slotId, { kind: 'beansprout', progress01: p01 }))
        .catch(warn('콩나물'));
    }
  } catch (e) { warn('방')(e); }
}
/* 배치 모드 — 탭으로 고르고, 놓을 수 있는 자리를 밝기와 함께 빛나게 한다.
   ★드래그는 안 쓴다. 폰 3D 에서 카메라 회전과 충돌하고 슬롯이 작아 오조작이 난다. */
const placeMode = {
  target: null,                        // 'monstera' | 'beansprout'
  begin(what, allowed, hint) {
    this.target = what;
    $('stage').classList.add('placing');
    $('placeHint').innerHTML = hint;
    if (roomView) roomView.highlightSlots(allowed);
    window.__byeotSheet.close();
  },
  end() {
    this.target = null;
    $('stage').classList.remove('placing');
    if (roomView) roomView.highlightSlots([]);
  },
  pick(slotId) {
    if (!this.target) { window.__byeotZoom.open(); return; }   // 배치 중이 아니면 그냥 상세
    const sel = this.target === 'beansprout' ? $('cropSlot') : $('slot');
    sel.value = slotId;
    sel.dispatchEvent(new Event('change', { bubbles: true }));
    this.end();
  }
};

/* ══ 빨리감기 — ★순간이동이 아니다 (박사님 2026-08-03) ═══════════════════
   "점점 자라는 모습을 보여주면서 점핑하게." 하루씩 진짜로 돌면서 매일 그린다.
   그래서 어두운 자리에 둔 채 감으면 **날짜만 가고 형태는 그대로 서 있다** —
   그 대비가 이 게임이 가르치려는 것이라 빨리감기에서도 살아 있어야 한다. */
let ffHandle = null;
function ffStop(reason) {
  stopFastForward(reason || 'stopped');
}
/* ★빨리감기 중에는 창으로 드는 빛이 계속 돈다 (박사님 2026-08-03) —
   "시간이 빨리 가는 게 딱 느껴지게." 날짜 숫자만 올라가면 시간이 흐르는 감각이 없다.

   ⚠ 하루(140ms)마다 한 바퀴 돌리지 않는다. 12일이면 12바퀴라 **깜빡임**이 된다.
     한 바퀴를 1.6초로 두면 12일 감기(1.7초)에 대략 한 바퀴가 지나가고,
     아침→낮→저녁이 눈에 읽힌다. 날짜 수와 묶지 않는 것이 핵심이다. */
const DAY_SWEEP_MS = 1600;
let dayLoop = null, dayPhase = 0.28;       /* 0.28 ≈ 아침. 낮부터 시작하면 변화가 덜 보인다 */
function dayCycleStart() {
  if (dayLoop || !roomView) return;
  let prev = performance.now();
  const step = (now) => {
    if (!dayLoop) return;
    dayPhase = (dayPhase + (now - prev) / DAY_SWEEP_MS) % 1; prev = now;
    try { roomView.setDaylight(dayPhase); } catch { /* 방이 없거나 실패해도 감기는 계속된다 */ }
    dayLoop = requestAnimationFrame(step);
  };
  dayLoop = requestAnimationFrame(step);
}
function dayCycleStop() {
  if (!dayLoop) return;
  cancelAnimationFrame(dayLoop); dayLoop = null;
  /* 멈출 때는 한낮으로 되돌린다 — 저녁에 멈춰 서면 방이 어두운 채로 남아 "고장났나"가 된다 */
  try { if (roomView) roomView.setDaylight(0.5); } catch { }
}
let ffNextWas = null;                      /* 빨리감기 전에 [다음 날]이 눌리는 상태였는지 */
function ffPaint(on) {
  const b = $('ff');
  b.textContent = on ? '■ 멈추기' : '▶▶ 빨리감기';
  b.classList.toggle('primary', on);
  if (on) { ffNextWas = $('next').disabled; $('next').disabled = true; dayCycleStart(); }
  else { dayCycleStop(); if (ffNextWas !== null) { $('next').disabled = ffNextWas; ffNextWas = null; } }
}
/* 버튼 밑에 "무엇까지 감는지"를 적어 둔다 — 어디로 가는지 모르고 누르면 불안하다.
   loop 가 이미 다음 이벤트를 알고 있으므로(nextEventPreview) 코어에 새 계산을 만들지 않는다. */
function ffHint() {
  if (isFastForwarding()) return;
  let p = null; try { p = nextEventPreview(S); } catch { /* 미리보기 실패로 버튼을 막지 않는다 */ }
  $('ff').title = p ? `${p.ko} 까지` : '다음 일이 생길 때까지';
}
$('ff').onclick = guard(() => {
  if (isFastForwarding()) { ffStop('stopped'); return; }
  if (!S.firstPlay.beansprout.slotId) {
    const e = new Error('가방의 열린 시루를 먼저 방 안에 놓아 주세요');
    e.firstPlayInput = true; throw e;
  }
  ffHandle = startFastForward(S, io, {
    msPerDay: 140,                      /* 3D 를 실제로 다시 그리므로 계약값 120 보다 여유를 둔다 */
    onDay(turn) { lastTurn = turn; showFirstPlayEvents(turn); draw(); },
    onStop(reason, info) {
      ffPaint(false);
      if (reason === 'event') return;   /* 이벤트에서 선 것은 정상이다 — 배너가 이미 떴다 */
      if (reason === 'stopped' || reason === 'maxDays') return;
      /* 나머지는 진짜 고장이다. 조용히 넘기지 않는다. */
      banner('빨리감기를 멈췄습니다', reason + (info && info.blocked ? ' · ' + info.blocked : ''));
    }
  });
  ffPaint(true);
});
/* ★페이지를 떠날 때 타이머를 반드시 끈다. loop.js 는 DOM 을 모르므로 여기서 붙인다 —
   안 끄면 화면이 사라진 뒤에도 턴이 계속 돈다(유령 턴). */
window.addEventListener('pagehide', () => ffStop('stopped'));

$('run30').onclick = guard(() => {
  arrive();
  const { turns } = runDays(S, io, 30);
  lastTurn = turns[turns.length - 1];
  draw();
  renderReport($('report'), S, io, turns);
});

/* ★ 방 프로파일 내보내기 — 밸런스 자동 시뮬이 THREE 없이 읽는 파일.
   조도 기하는 방마다 고정이라 한 번만 뽑으면 된다(src/game/room_profile.js). */
$('prof').onclick = () => {
  const p = io.light.profile([0, 1, 2]);
  const blob = new Blob([JSON.stringify(p, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `room_profile.${p.room}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  pushLog(S, `방 프로파일 저장 — ${p.room} · 슬롯 ${p.slots.length}`);
  renderLog($('log'), S);
};

$('reset').onclick = () => {
  const keep = { room: S.home.room, mode: S.sim.mode, lamps: { ...S.lamps } };
  S = newState({ room: keep.room, mode: 'novice', firstPlay: true, firstPlayRules: FIRST_RULES });
  S.lamps = keep.lamps;
  lastTurn = null;
  arrivalSlotId = null;
  io.growth.reset();
  $('report').innerHTML = '<div class="ph">30일을 돌리면 나옵니다</div>';
  $('spark').innerHTML = '';
  $('firstResult').className = 'simresult';
  $('firstResult').textContent = '';
  delete $('firstResult').dataset.status;
  delete document.body.dataset.hardLock;      // 새 판이므로 잠금도 푼다
  GATED.forEach(id => { $(id).disabled = false; });
  buildRoom(keep.room);
};

/* ============================================================
   ★ 재미 확인 시나리오 — v0의 완료 조건을 눈으로 본다
     "등을 켰더니 잎이 갈라지기 시작했어요"가 실제로 뜨는지.
     판정은 growth의 canFenestrate()(7일평균 기준)를 그대로 쓴다 — 하루 값으로 띄우면 거짓말이 된다.
============================================================ */
const SCENARIOS = [
  { id:'first', kind:'firstPlay', ko:'★ 첫 플레이 · 콩나물→말린 새순 (7일)' },
  { id:'a', ko:'① 등 0개 · 좋은 자리 (90일)', days:90, lamps:0, pick:'brightest',
    hint:'반지하 자연광만. 아무 일도 일어나지 않는 것이 정답이다' },
  { id:'b', ko:'② 등 1개 · 나쁜 자리 (90일)', days:90, lamps:1, pick:'darkest',
    hint:'등값·전기만 나가고 식물은 그대로 — 등을 "샀다"고 되는 게 아니다' },
  { id:'c', ko:'③ 등 1개 · 좋은 자리 (90일)', days:90, lamps:1, pick:'brightest',
    hint:'같은 등, 자리만 다르다' },
  { id:'d', ko:'★④ 20일 뒤 등을 켠다 (좋은 자리)', days:90, lamps:0, pick:'brightest',
    at:21, thenLamps:1, cause:'등을 켰더니',
    hint:'★ 이게 v0의 완료 조건. 켜고 나서 며칠 뒤에 켜지는지 보라' },
  { id:'e', ko:'★⑤ 등 1개 · 20일 뒤 자리를 옮긴다', days:90, lamps:1, pick:'darkest',
    at:21, thenPick:'brightest', cause:'화분을 옮겼더니',
    hint:'★ 등은 그대로. 자리만 바꾼다 — "자리가 등보다 크다"' }
];
$('scen').innerHTML = SCENARIOS.map(s => `<option value="${s.id}">${s.ko}</option>`).join('');

const sleep = ms => new Promise(r => setTimeout(r, ms));
let stopFlag = false;

/* 지금 설정에서 밝은/어두운 자리 — 등을 켜면 순위가 바뀌므로 그때그때 다시 본다 */
function pickSlot(how) {
  const list = [...io.light.daily(S.day + 1, S).report.slots].sort((a, b) => b.dli - a.dli);
  return how === 'darkest' ? list[list.length - 1].slotId : list[0].slotId;
}

/* ★ 한 턴에 사건이 둘이면 **함께** 띄운다 (2026-08-02 정정).
   예전엔 banner() 가 #event 를 통째로 덮어써서, Day 4 의 수확·식비 결과가 같은 프레임에서
   몬스테라 도착 안내로 지워졌다 — 첫 자리 선택의 답안지를 플레이어가 못 보고 넘어갔다.
   순서는 계약 그대로 수확 → 식비 → 도착이고(first_play.md §2), 위에서 아래로 그 순서로 쌓는다.
   타이머도 하나만 둔다 — 배너마다 걸면 먼저 건 쪽이 나중 배너를 일찍 지운다. */
let bannerTimer = null;
function banners(events) {
  const list = (events || []).filter(Boolean);
  if (!list.length) return;
  const el = $('event');
  el.innerHTML = list.map(e => `<b>${e.title}${e.sub ? `<i>${e.sub}</i>` : ''}</b>`).join('');
  el.classList.add('on');
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => el.classList.remove('on'), 6000);
}
function banner(title, sub) { banners([{ title, sub }]); }

function fenOn() {
  const f = io.growth.canFenestrate ? io.growth.canFenestrate(pot0(S) && pot0(S).variegated) : null;
  if (f !== null) return f;
  const p = pot0(S); if (!p) return null;
  const a7 = avg(S.dliHist, 7), th = io.light.thresholdsOf(p.plantId, false);
  return a7 != null && th && th.fenestrate != null && a7 >= th.fenestrate;
}

async function playFirstPlayScenario() {
  stopFlag = false;
  document.body.classList.add('scen-run');
  $('play').disabled = true; $('firstRun').disabled = true; $('stop').disabled = false;

  S = newState({ room: 'banjiha', mode: 'novice', firstPlay: true, firstPlayRules: FIRST_RULES });
  S.lamps.count = 0;
  lastTurn = null;
  arrivalSlotId = null;
  io.growth.reset();
  $('room').value = 'banjiha'; $('mode').value = 'novice'; $('lamps').value = '0';
  buildRoom('banjiha');

  /* 시루가 들어가는 슬롯 중 가장 어두운 자리를 자동 시나리오의 플레이어 선택으로 삼는다. */
  const darkest = cropCandidates().sort((a, b) => a.dli - b.dli)[0];
  const darkSlot = darkest && darkest.slotId;
  if (!darkSlot) throw new Error('첫 플레이 자동 시뮬: 열린 시루가 들어갈 자리가 없습니다');
  placeBeansprout(S.firstPlay, darkSlot);
  pushLog(S, `🥣 자동 시뮬: 열린 시루를 ${darkSlot}(으)로 옮겼습니다`);

  const speed = +$('speed').value;
  const turns = [];
  for (let day = 1; day <= 4; day++) {
    lastTurn = nextDay(S, io).turn; turns.push(lastTurn); showFirstPlayEvents(lastTurn);
    draw(); if (speed) await sleep(speed);
  }

  const sill = io.light.room.slots.find(s => s.slotId === 'banjiha-sill:0');
  if (!pot0(S) || !sill) throw new Error('첫 플레이 자동 시뮬: 몬스테라 또는 창턱 슬롯이 없습니다');
  pot0(S).slotId = sill.slotId;
  moveMonstera(S.firstPlay, sill.slotId);
  fillSlots(false); $('slot').value = sill.slotId;
  pushLog(S, `🪴 자동 시뮬: 몬스테라를 ${sill.slotId}(으)로 옮겼습니다`);

  for (let day = 5; day <= 7 && !S.firstPlay.completed; day++) {
    lastTurn = nextDay(S, io).turn; turns.push(lastTurn); showFirstPlayEvents(lastTurn);
    draw(); if (speed) await sleep(speed);
  }
  if (!S.firstPlay.completed)
    throw new Error(`첫 플레이 자동 시뮬: Day ${S.day}까지 말린 새순이 나오지 않았습니다`);

  window.__firstPlayResult = {
    ok: true,
    day: S.day,
    cropSlot: S.firstPlay.beansprout.slotId,
    cropAvgDli: S.firstPlay.beansprout.avgDli,
    cropMeals: S.firstPlay.beansprout.meals,
    foodSavedWon: S.firstPlay.food.totalFoodSavedWon,
    monsteraSlot: pot0(S).slotId,
    growthPhase: S.firstPlay.monstera.growthPhase
  };
  const resultEl = $('firstResult');
  resultEl.className = 'simresult on';
  resultEl.dataset.status = 'pass';
  resultEl.dataset.day = String(S.day);
  resultEl.dataset.cropMeals = String(S.firstPlay.beansprout.meals);
  resultEl.dataset.foodSavedWon = String(S.firstPlay.food.totalFoodSavedWon);
  resultEl.dataset.monsteraPhase = S.firstPlay.monstera.growthPhase.phaseId;
  resultEl.textContent = `✅ Day ${S.day} 완료 · 콩나물 ${S.firstPlay.beansprout.meals}끼 · ` +
    `식비 ${S.firstPlay.food.totalFoodSavedWon.toLocaleString()}원 절감 · 말린 새순 등장`;
  renderReport($('report'), S, io, turns);
  pushLog(S, '✅ 첫 플레이 자동 시뮬레이션 완료 — 콩나물 수확부터 말린 새순까지 연결됨');
  draw();
  $('play').disabled = false; $('firstRun').disabled = false; $('stop').disabled = true;
  document.body.classList.remove('scen-run');
  return window.__firstPlayResult;
}

async function playScenario(sc) {
  if (sc.kind === 'firstPlay') return playFirstPlayScenario();
  stopFlag = false;
  document.body.classList.add('scen-run');
  $('play').disabled = true; $('stop').disabled = false;

  /* 초기화 — 같은 조건에서 다시 돌릴 수 있어야 비교가 된다.
     ★ 개체가 새로 '도착'한다. setGrowth 는 그 한 번뿐이고 이후는 advanceTo 다. */
  S = newState({ room: S.home.room, mode: S.sim.mode });
  S.lamps.count = sc.lamps;
  arrivalSlotId = null;
  io.growth.reset();
  $('lamps').value = String(sc.lamps);
  const startSlot = pickSlot(sc.pick);
  arrive(startSlot);
  fillSlots(); $('slot').value = pot0(S).slotId;
  pushLog(S, `시나리오 ${sc.ko} — ${sc.hint}`);

  const th = io.light.thresholdsOf(pot0(S).plantId, false);
  const speed = +$('speed').value;
  const turns = [];
  let announced = false, switched = false;

  for (let d = 1; d <= sc.days; d++) {
    if (stopFlag) { pushLog(S, `${sc.ko} 정지 (${d - 1}일)`); break; }

    /* 전환 시점 — 등을 켜거나 자리를 옮긴다 */
    if (sc.at && d === sc.at && !switched) {
      switched = true;
      if (sc.thenLamps != null) {
        S.lamps.count = sc.thenLamps; $('lamps').value = String(sc.thenLamps);
        io.light.clearCache();
        pushLog(S, `☀ 식물등을 켰습니다 (${d}일)`);
        banner('☀ 식물등을 켰습니다', '이제 며칠 지켜보세요 — 판정은 7일 평균입니다');
      }
      if (sc.thenPick) {
        pot0(S).slotId = pickSlot(sc.thenPick); $('slot').value = pot0(S).slotId;
        pushLog(S, `🪴 화분을 밝은 자리로 옮겼습니다 (${d}일)`);
        banner('🪴 화분을 옮겼습니다', '등은 그대로입니다 — 자리만 바꿨습니다');
      }
      if (speed) await sleep(1400);
    }

    lastTurn = nextDay(S, io).turn;
    turns.push(lastTurn);

    /* ★ 갈라짐이 켜지는 순간 */
    if (!announced && fenOn()) {
      announced = true;
      const since = sc.at ? ` · ${sc.cause || '바꾸고'} ${d - sc.at + 1}일 만에` : '';
      pushLog(S, `🌿 잎이 갈라지기 시작했습니다 (${d}일)`);
      banner(`🌿 ${sc.cause ? sc.cause + ' ' : ''}잎이 갈라지기 시작했어요!`,
             `${d}일째 · 7일 평균 ${(turn7()).toFixed(2)} ≥ 문턱 ${th.fenestrate}${since}`);
      if (speed) await sleep(2200);
    }

    if (speed === 0) { if (d % 15 === 0 || d === sc.days) { draw(); await sleep(0); } }
    else { draw(); renderSpark($('spark'), S.dliHist, th && th.fenestrate, null); await sleep(speed); }
  }

  draw();
  renderSpark($('spark'), S.dliHist, th && th.fenestrate, fenDayOf(th));
  renderReport($('report'), S, io, turns);
  $('play').disabled = false; $('stop').disabled = true;
  document.body.classList.remove('scen-run');
  if (!announced) {
    pushLog(S, `${sc.days}일 동안 갈라지지 않았습니다 — 7일평균이 문턱 ${th.fenestrate}에 닿지 않았습니다`);
    renderLog($('log'), S);
  }
}

const turn7 = () => io.growth.dli7() ?? avg(S.dliHist, 7) ?? 0;

/* 이력에서 처음 문턱을 넘은 날 — 그래프에 세로선으로 표시한다 */
function fenDayOf(th) {
  if (!th || th.fenestrate == null) return null;
  /* ★ 같은 창을 쓴다 — loop.rollingAvg(최근 7개 유효 관측). 여기서 다시 짜면 그래프와 어긋난다. */
  const a7 = rollingAvg(S.dliHist, 7);
  for (let i = 0; i < a7.length; i++)
    if (a7[i] != null && a7[i] >= th.fenestrate) return i + 1;
  return null;
}

$('play').onclick = () => playScenario(SCENARIOS.find(s => s.id === $('scen').value))
  .catch(e => {                                  // 시나리오 도중 계약이 끊긴 경우도 같은 처리
    stopFlag = true;
    $('stop').disabled = true;
    document.body.classList.remove('scen-run');
    if (!isRecoverable(e)) { GATED.forEach(id => { $(id).disabled = true; }); document.body.dataset.hardLock = '1'; }
    pushLog(S, '⛔ ' + e.message); renderLog($('log'), S);
    side.insertAdjacentHTML('afterbegin',
      `<div class="err">⛔ 시나리오를 멈췄습니다 — 상태 ${e.turnState || 'unknown'}<br>${e.message}</div>`);
    console.error(e);
  });
$('stop').onclick = () => { stopFlag = true; };
$('firstRun').onclick = () => playFirstPlayScenario().catch(e => {
  window.__firstPlayResult = { ok: false, error: e.message };
  if (!isRecoverable(e)) { $('play').disabled = true; $('firstRun').disabled = true; document.body.dataset.hardLock = '1'; }
  $('stop').disabled = true;
  pushLog(S, '⛔ ' + e.message); renderLog($('log'), S);
  $('firstResult').className = 'simresult on fail';
  $('firstResult').dataset.status = 'fail';
  $('firstResult').textContent = `⛔ ${e.message}`;
  side.insertAdjacentHTML('afterbegin', `<div class="err">⛔ 첫 플레이 시뮬레이션 실패<br>${e.message}</div>`);
  console.error(e);
});

/* ---- 시작 ---- */
/* ★ 생장 계약이 준비되기 전에는 진행 버튼을 열지 않는다 (2026-08-02).
   일곱 함수(setDailyLight·advanceTo·calendarDay·growthDays·growthBlocked·growthPhase·setGrowth)가
   다 있어야 ready() 가 통과한다. 실패하면 버튼은 계속 잠긴 채로 둔다 —
   반쯤 도는 상태로 굴리면 '왜 안 자라지'가 계약 문제인지 빛 문제인지 못 가른다. */
/* ★'ff' 도 여기 있어야 한다 — 계약이 깨졌을 때 [다음 날]만 잠그고 빨리감기를 열어 두면
   플레이어가 그쪽으로 우회해 고장난 상태로 며칠을 돌린다. 같이 잠기고 같이 열린다. */
const GATED = ['next', 'run30', 'play', 'firstRun', 'ff'];
try {
  $('room').value = S.home.room;
  $('mode').value = S.sim.mode;
  buildRoom(S.home.room);
  await io.growth.ready();
  GATED.forEach(id => { $(id).disabled = false; });
  /* 첫 플레이는 고정 지역·novice·식물등 없음. 개발 검수 시나리오에서는 재설정할 수 있다. */
  $('room').disabled = true; $('mode').disabled = true; $('lamps').disabled = true; $('lit').disabled = true;
  pushLog(S, '첫 플레이 준비 완료 — 열린 시루를 놓고 [다음 날]을 눌러 보세요');
  draw();
  window.__byeotBooted = true;      // 밖의 감시자에게 "여기까지는 왔다"고 알린다
  bootRoomView();                   // 방 3D — 실패해도 게임은 돌아간다(아래)
  dlgOpen('intro');                 // 몬이가 무엇을 하는 게임인지 한 번에 말해 준다
} catch (err) {
  GATED.forEach(id => { $(id).disabled = true; });       // 실패하면 계속 잠근다
  /* ★#side 는 폰 세로로 바뀌며 없어졌다. 하단에 띄운다 — 안 보이면 "버튼이 안 눌린다"만 남는다 */
  ($('bottom') || document.body).insertAdjacentHTML('afterbegin',
    `<div class="err" style="margin-bottom:8px">⚠ 진행 버튼을 잠갔습니다<br>${err.message.split('\n').join('<br>')}</div>`);
  console.error(err);
  /* 여기까지 왔으면 부팅 자체는 돌았고 안내도 이미 떴다 — 감시자가 같은 말을 또 하지 않게 한다 */
  window.__byeotBooted = true;
}
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>볕 · 첫 플레이</title>

<!-- house.js·textures.js 가 전역 THREE 를 쓴다(index.html 과 같은 r128).
     v0는 방을 그리지 않고 조도 계산에만 쓴다 — 렌더러를 만들지 않는다. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;font-family:'Gaegu',sans-serif;background:#14101c;color:#f2eef8;overflow:hidden}
  #app{display:flex;height:100%}
  /* ★ HUD는 iframe 위에 겹치지 않는다. plant_grow 자체 표시와 나란히 놓고 대조한다. */
  #side{width:450px;flex:0 0 450px;height:100%;overflow-y:auto;padding:14px;
        background:linear-gradient(180deg,#213326 0,#18241d 48%,#171421 100%);
        border-right:1px solid rgba(255,255,255,.09)}
  #stage{flex:1;position:relative;background:#0f0c16;overflow:hidden}
  #growth{position:absolute;inset:0;width:100%;height:100%;border:0}
  #growth{transition:opacity .4s,filter .4s}
  #stage.no-plant #growth{opacity:.18;filter:blur(7px)}
  #stageEmpty{display:none;position:absolute;inset:0;z-index:7;place-items:center;pointer-events:none}
  #stage.no-plant #stageEmpty{display:grid}
  #stageEmpty b{font-family:'Jua';font-size:22px;color:#dff8d4;text-align:center;text-shadow:0 3px 15px #000}
  #stageEmpty i{display:block;font:normal 13px 'Gaegu';color:rgba(255,255,255,.62);margin-top:7px}
  h1{font-family:'Jua';font-size:19px;margin-bottom:2px}
  h1 b{color:#ffb454}
  .sub{font-size:12px;color:rgba(255,255,255,.45);margin-bottom:12px}
  .box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);
       border-radius:12px;padding:11px;margin-bottom:10px}
  .box>h3{font-family:'Jua';font-size:12px;color:#ffb454;margin-bottom:8px;letter-spacing:.5px}
  label{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:7px}
  label>span{width:78px;color:rgba(255,255,255,.55);flex:0 0 78px}
  select,input[type=number]{flex:1;min-width:0;font:inherit;font-size:12px;padding:5px 7px;border-radius:8px;
       border:1px solid rgba(255,255,255,.14);background:#241d33;color:#f2eef8}
  .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  button{font-family:'Jua';font-size:13px;padding:8px 13px;border:0;border-radius:11px;cursor:pointer;
         background:#ffb454;color:#3a2c12;box-shadow:0 3px 0 rgba(0,0,0,.35)}
  button.ghost{background:rgba(255,255,255,.14);color:#f2eef8}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
  button:disabled{opacity:.45;cursor:default}
  .row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .row.big{font-size:15px;margin-bottom:9px}
  .row .k{color:rgba(255,255,255,.45);font-size:12px}
  .row b{font-family:'Jua';color:#fff}
  .sep{width:1px;height:12px;background:rgba(255,255,255,.18);margin:0 3px}
  .mode{margin-left:auto;font-size:11px;color:#9ad9a0;background:rgba(154,217,160,.12);
        padding:2px 8px;border-radius:9px}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:7px}
  .cell{background:rgba(0,0,0,.22);border-radius:9px;padding:7px 8px;min-width:0}
  .cell span{display:block;font-size:10px;color:rgba(255,255,255,.42)}
  .cell b{font-family:'Jua';font-size:17px;color:#fff;display:block;line-height:1.25}
  .cell i{font-style:normal;font-size:10px;color:rgba(255,255,255,.42);display:block;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cell i.warn{color:#ff9a8a}
  .slotline{font-size:11px;color:rgba(255,255,255,.45);margin-top:2px}
  code{font-family:ui-monospace,monospace;font-size:10px;color:#c8b6ff}
  .bad{margin-top:8px;padding:8px;border-radius:9px;background:rgba(255,90,70,.14);
       border:1px solid rgba(255,90,70,.35);color:#ffb3a7;font-size:11px;line-height:1.5}
  .ph{color:rgba(255,255,255,.35);font-size:13px;padding:14px 2px}
  .li{font-size:12px;color:rgba(255,255,255,.62);padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .li span{display:inline-block;width:38px;color:rgba(255,255,255,.32);font-size:10px}
  #log{max-height:150px;overflow-y:auto}
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  td{padding:4px 3px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
  td:first-child{color:rgba(255,255,255,.5);width:38%}
  tr.hl td{background:rgba(255,180,84,.10)}
  td b{font-family:'Jua';font-size:14px;color:#fff}
  td i{font-style:normal;color:rgba(255,255,255,.35)}
  #report h4{font-family:'Jua';font-size:12px;margin-bottom:6px;color:#fff}
  .note{font-size:10.5px;color:rgba(255,255,255,.38);margin-top:7px;line-height:1.5}
  .err{padding:12px;background:rgba(255,90,70,.15);border-radius:10px;font-size:12px;line-height:1.6}
  .sparkleg{display:flex;gap:9px;flex-wrap:wrap;font-size:10px;margin-top:3px}
  /* ★ 이벤트 배너 — 갈라짐이 켜지는 순간. v0가 증명하려는 것이 이 한 줄이다 */
  #event{position:absolute;left:50%;top:34px;transform:translate(-50%,-14px);z-index:9;
    opacity:0;transition:opacity .45s,transform .45s;pointer-events:none;max-width:88%}
  #event.on{opacity:1;transform:translate(-50%,0)}
  #event b{display:block;font-family:'Jua';font-size:19px;color:#14240f;
    background:linear-gradient(#bff5b0,#7ce69a);padding:11px 22px;border-radius:16px;
    box-shadow:0 8px 26px rgba(0,0,0,.45);text-align:center;line-height:1.45}
  #event i{font-style:normal;display:block;font-size:12px;color:#2c4a22;margin-top:3px}
  .scen-run #play{opacity:.45}
  .resourcebar{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}
  .resource{padding:8px 9px;border-radius:11px;background:rgba(238,255,225,.09);
    border:1px solid rgba(190,235,165,.16)}
  .resource span{display:block;font-size:10px;color:rgba(255,255,255,.5)}
  .resource b{display:block;font-family:'Jua';font-size:16px;color:#e8ffd9;margin-top:1px}
  .journey{border-color:rgba(190,235,165,.25);background:rgba(224,255,207,.07)}
  .quest{padding:9px 11px;border-radius:10px;background:rgba(7,20,10,.35);color:#dff8d4;
    font-size:13px;line-height:1.45;margin-bottom:9px}
  .inventory{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .itemcard{min-width:0;padding:8px;border-radius:12px;background:rgba(255,255,255,.065);
    border:1px solid rgba(255,255,255,.09)}
  .itemhead{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .thumb{width:48px;height:48px;flex:0 0 48px;border-radius:10px;object-fit:contain;
    background:radial-gradient(circle,#eaf4d8,#a8b58f);padding:4px}
  .emoji-thumb{display:grid;place-items:center;font-size:31px}
  .itemhead b{font-family:'Jua';font-size:13px;display:block}
  .itemhead small{font-size:10px;color:rgba(255,255,255,.46)}
  .meter{height:8px;border-radius:9px;background:rgba(0,0,0,.35);overflow:hidden;margin:5px 0}
  .meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8fd36f,#d5ef8b);
    transition:width .35s}
  .itemline{font-size:10.5px;color:rgba(255,255,255,.55);min-height:26px;line-height:1.3}
  .place{display:flex;gap:5px;margin-top:7px}.place select{font-size:10px}.place button{padding:6px 8px;font-size:11px}
  .primary{width:100%;margin-top:9px;background:linear-gradient(#d9f09e,#96d270);color:#1d381c}
  .simresult{display:none;margin-top:8px;padding:8px 10px;border-radius:10px;font-size:11px;line-height:1.45;
    background:rgba(124,230,154,.12);border:1px solid rgba(124,230,154,.35);color:#dff8d4}
  .simresult.on{display:block}.simresult.fail{background:rgba(255,90,70,.14);border-color:rgba(255,90,70,.35)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  details.dev>summary{cursor:pointer;font-family:'Jua';font-size:12px;color:rgba(255,255,255,.58)}
  details.dev[open]>summary{margin-bottom:9px}
  @media(max-width:900px){#app{display:block;overflow:auto}#side{width:100%;height:auto}#stage{height:70vh}.inventory{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <h1>볕 · <b>반지하의 첫 여름</b></h1>
    <div class="sub">어두운 자리도, 밝은 자리도 쓸모가 있습니다.</div>

    <div class="resourcebar">
      <div class="resource"><span>오늘</span><b id="resDay">Day 0</b></div>
      <div class="resource"><span>첫 수확일 식비</span><b id="resFood">—</b></div>
      <div class="resource"><span>아낀 식비</span><b id="resSaved">0원</b></div>
    </div>

    <div class="box journey">
      <h3>첫 플레이 · 자리의 차이</h3>
      <div class="quest" id="quest">가방의 열린 시루를 방 안 어두운 자리에 놓아 보세요.</div>
      <div class="inventory">
        <div class="itemcard">
          <div class="itemhead"><img class="thumb" id="cropThumb" alt="열린 콩나물 시루">
            <div><b>열린 콩나물 시루</b><small id="cropState">가방에 있음</small></div></div>
          <div class="meter"><i id="cropMeter"></i></div><div class="itemline" id="cropInfo">4일 뒤 첫 수확</div>
          <div class="place"><label for="cropSlot" class="sr-only">콩나물 자리</label><select id="cropSlot"></select><button id="placeCrop">두기</button></div>
        </div>
        <div class="itemcard">
          <div class="itemhead"><div class="thumb emoji-thumb">🪴</div>
            <div><b>몬스테라</b><small id="plantState">아직 만나지 못함</small></div></div>
          <div class="meter"><i id="plantMeter"></i></div><div class="itemline" id="plantInfo">콩나물 첫 수확 뒤 도착</div>
        </div>
      </div>
      <button id="firstRun" class="primary" disabled>▶ 첫 플레이 자동 시뮬레이션</button>
      <div id="firstResult" class="simresult" aria-live="polite"></div>
    </div>

    <div class="box" id="ctl">
      <h3>방 안에서 하기</h3>
      <label><span>방</span><select id="room"></select></label>
      <label for="slot"><span>몬스테라 자리</span><select id="slot" disabled></select></label>
      <label><span>식물등</span><select id="lamps"></select></label>
      <label><span>점등시간</span><input id="lit" type="number" min="0" max="24" step="1" value="12"></label>
      <label><span>모드</span><select id="mode"></select></label>
      <div class="btns">
        <button id="next" disabled>다음 날 ▸</button>
        <button id="run30" class="ghost" disabled>30일 자동</button>
        <button id="reset" class="ghost">초기화</button>
        <button id="prof" class="ghost" title="이 방의 조도 기하를 JSON으로 — 밸런스 시뮬이 THREE 없이 읽는다">방 프로파일 ⭳</button>
      </div>
    </div>

    <details class="box dev" id="scbox">
      <summary>개발 검수 시나리오</summary>
      <label><span>시나리오</span><select id="scen"></select></label>
      <div class="btns">
        <button id="play" disabled>▶ 돌려보기</button>
        <button id="stop" class="ghost" disabled>■ 정지</button>
        <label style="margin:0 0 0 auto"><span style="width:auto">속도</span>
          <select id="speed" style="width:74px;flex:0 0 74px">
            <option value="90">느림</option><option value="45" selected>보통</option>
            <option value="12">빠름</option><option value="0">즉시</option>
          </select></label>
      </div>
      <div id="spark"></div>
    </details>

    <details class="box dev"><summary>개발 HUD·리포트·기록</summary>
      <h3>오늘</h3><div id="hud"></div>
      <h3>검수 리포트</h3><div id="report"><div class="ph">30일을 돌리면 나옵니다</div></div>
      <h3>기록</h3><div id="log"></div>
    </details>
  </aside>

  <main id="stage">
    <!-- growth 창 소유. 자체 UI(슬라이더·[다음 날])를 그대로 둔다 —
         코어를 안 거치고 직접 넣었을 때와 대조할 수 있어야 한다. -->
    <iframe id="growth" src="./plant_grow.html?embed=game"></iframe>
    <div id="stageEmpty"><b>아직 몬스테라가 없습니다<i>콩나물을 수확하면 새로운 화분이 찾아옵니다.</i></b></div>
    <!-- ★ v0의 완료 조건이 걸린 자리 — "등을 켰더니 갈라지기 시작했어요"가 여기 뜬다 -->
    <div id="event"></div>
  </main>
</div>

<script type="module">
import { newState, SIM_MODES, pot0, pushLog, givePlant, hasPlant, ARRIVAL } from './src/game/state.js';
import {
  FIRST_PLAY_ASSETS,
  firstPlayRulesFromBalance,
  openSiruContractFromManifest,
  moveMonstera,
  placeBeansprout,
  slotFitsDiameter
} from './src/game/first_play.js';
import { createLightEngine } from './src/game/light_adapter.js';
import { createGrowthAdapter } from './src/game/growth_adapter.js';
import { nextDay, runDays, avg, rollingAvg } from './src/game/loop.js';
import { renderHUD, renderLog, renderReport, renderSpark } from './src/game/ui.js';

const ARRIVAL_POT_D = FIRST_PLAY_ASSETS.monsteraPotDiameterM;
const $ = (id) => document.getElementById(id);
const side = $('side');

/* ---- 데이터 (house = 구조·에셋 / balance = plan 소유 튜닝값) ---- */
const j = (p, fb) => fetch(p).then(r => r.json()).catch(() => fb);
const [houseRooms, winPresets, doorPresets, finishes, furnPresets, lightPresets, shadePresets,
       lightTh, weatherBalance] = await Promise.all([
  j('./data/house_rooms.json', { rooms: {} }),
  j('./data/window_presets.json', {}).then(d => d.presets || d),
  j('./data/door_presets.json', {}).then(d => d.presets || d),
  j('./data/room_finishes.json', null),
  j('./data/furniture_presets.json', {}).then(d => d.presets || d),
  j('./data/lighting_presets.json', {}),
  j('./data/shading_presets.json', { presets: {} }),
  j('./data/balance/light_thresholds.json', null),
  j('./data/balance/weather.json', null)
]);

const io = {
  light: createLightEngine({ houseRooms, winPresets, doorPresets, finishes, furnPresets,
                             lightPresets, shadePresets, lightTh, weatherBalance }),
  growth: createGrowthAdapter($('growth'))
};

const balanceResponse = await fetch('./data/balance/characters.json');
if (!balanceResponse.ok) throw new Error(`[첫 플레이] characters.json HTTP ${balanceResponse.status}`);
const FIRST_RULES = firstPlayRulesFromBalance(await balanceResponse.json());
const manifestResponse = await fetch('./assets/manifest.json');
if (!manifestResponse.ok) throw new Error(`[첫 플레이] assets/manifest.json HTTP ${manifestResponse.status}`);
const OPEN_SIRU = openSiruContractFromManifest(await manifestResponse.json());
let S = newState({ room: 'banjiha', mode: 'novice', firstPlay: true, firstPlayRules: FIRST_RULES });
let lastTurn = null;
$('cropThumb').src = OPEN_SIRU.thumbnail;

/* ---- 셀렉트 채우기 ---- */
$('room').innerHTML = io.light.rooms()
  .map(r => `<option value="${r.id}">${r.label} (${r.light})</option>`).join('');
$('mode').innerHTML = Object.entries(SIM_MODES)
  .map(([k, m]) => `<option value="${k}">${m.ko}</option>`).join('');

function fillLamps() {
  const n = io.light.growLampCount();
  $('lamps').innerHTML = Array.from({ length: n + 1 }, (_, i) =>
    `<option value="${i}">${i}개${i === 0 ? ' (자연광만)' : ''}</option>`).join('');
  $('lamps').value = String(Math.min(S.lamps.count, n));
  S.lamps.count = +$('lamps').value;
}

/* 자리 목록 — 오늘 조건에서 밝은 순. 계약을 미리 한 번 돌려 보는 것이라 이력에 쌓이지 않는다. */
/* 자리 목록 — 오늘 조건에서 밝은 순.
   ★ 등을 켜면 순위가 바뀐다(자연광 최고 자리 ≠ 등 밑 자리). 화분은 자동으로 안 옮긴다 —
     옮기는 건 플레이어의 선택이어야 하고, 그 차이가 이 게임의 핵심이다.
   pick=true 일 때만(방을 새로 조립할 때) 가장 밝은 자리로 놓는다.
   ★ 식물이 아직 도착 전이면 목록만 채우고 화분은 건드리지 않는다. */
/* 사람이 읽는 자리 이름. raw slotId(`banjiha-shelf_etagere_3tier-7:0`)나 "0단"은
   플레이어 언어가 아니다 — 가구 이름 + 1부터 세는 칸 번호로 바꾼다. */
/* 가구 종류 → 사람이 쓰는 이름. **키워드 포함**으로 찾는다 —
   slotId 는 `{가구 uid}:{단}` 이고 uid 는 `banjiha-sill` 처럼 프리셋 이름이 아닐 수도 있어서
   앞뒤를 잘라 맞추면 raw 문자열이 그대로 화면에 남는다(실제로 남았다). */
const FURN_KO = [
  ['sill', '창턱 화분받침'], ['etagere', '3단 선반'], ['ladder', '사다리 선반'],
  ['growrack', '재배 선반'], ['cart', '이동 선반'], ['shelf_low', '낮은 선반'], ['shelf', '선반'],
  ['plant_step', '화분 계단'], ['pedestal', '화분 받침대'], ['nightstand', '협탁'],
  ['dresser', '서랍장'], ['desk_student', '학생 책상'], ['desk', '책상'], ['table_round', '원탁'],
  ['table', '탁자'], ['shoe_cabinet', '신발장'], ['locker', '사물함'], ['lectern', '교탁'],
  ['bed', '침대'], ['wardrobe', '옷장'], ['sofa', '소파']
];
function slotLabel(slotId) {
  const [uid, tier] = String(slotId || '').split(':');
  const key = uid.toLowerCase();
  /* 물리 슬롯이 알려 주는 종류(owner)를 먼저 보고, 없으면 uid 키워드로 찾는다 */
  const owner = ((io.light.room && io.light.room.slots) || [])
    .find(s => s.slotId === slotId);
  const hay = `${owner && owner.owner ? owner.owner : ''} ${key}`.toLowerCase();
  const hit = FURN_KO.find(([k]) => hay.includes(k));
  const ko = hit ? hit[1] : '가구';
  const n = Number(tier);
  /* ★ "0단" 금지 — 사람은 1부터 센다. 칸이 하나뿐인 가구는 번호를 붙이지 않는다. */
  if (!Number.isFinite(n)) return ko;
  const sameOwner = ((io.light.room && io.light.room.slots) || [])
    .filter(s => String(s.slotId).split(':')[0] === uid).length;
  return sameOwner > 1 ? `${ko} ${n + 1}번 칸` : ko;
}

function fillSlots(pick) {
  const preview = io.light.daily(S.day + 1, S).report;
  const roomSlot = new Map((io.light.room.slots || []).map(s => [s.slotId, s]));
  /* ★ 몬스테라 화분이 **물리적으로 올라가는** 자리만 보여 준다 — 치수가 숫자로 확인된 슬롯만.
     못 올라가는 자리를 고를 수 있으면 배치 규칙이 화면에서만 사라진 것이다. */
  const fits = preview.slots.filter(s =>
    slotFitsDiameter(roomSlot.get(s.slotId) || s, ARRIVAL_POT_D));
  /* ★ 첫 플레이는 **완료 뒤에도** 정답순·원시 DLI를 숨긴다(무엇이 밝은지는 방을 보고 배우는 것).
     개발 검수 시나리오(첫 플레이 꺼짐)만 예전처럼 밝은 순 + DLI 를 본다. */
  const devMode = !(S.firstPlay && S.firstPlay.enabled);
  const list = devMode
    ? [...fits].sort((a, b) => b.dli - a.dli)
    : [...fits].sort((a, b) => slotLabel(a.slotId).localeCompare(slotLabel(b.slotId), 'ko'));
  $('slot').innerHTML = list.map(s =>
    `<option value="${s.slotId}">${slotLabel(s.slotId)}${devMode ? ` — DLI ${s.dli.toFixed(2)}` : ''}</option>`
  ).join('');
  const p = pot0(S);
  if (p && (pick || !list.some(s => s.slotId === p.slotId)))
    p.slotId = list[0] ? list[0].slotId : null;
  $('slot').value = (p && p.slotId) || (list[0] ? list[0].slotId : '');
  $('slot').disabled = !p;
}

/* 열린 시루는 방 슬롯 DLI를 그대로 받는다. 실제 지름이 올라가는 자리만 보여 준다.
   기본 UI는 DLI·정답순을 숨긴다 — 무엇이 어두운지는 방을 보고 고르는 학습 대상이다. */
function cropCandidates() {
  const preview = io.light.daily(S.day + 1, S).report;
  const roomSlot = new Map((io.light.room.slots || []).map(s => [s.slotId, s]));
  /* ★ 치수가 숫자로 확인된 자리만. `maxPotD == null` 을 통과시키면 시루가 못 올라가는
     자리에 조용히 놓인다(폴백 금지 — loop.js 의 몬스테라 후보와 같은 규칙). */
  return [...preview.slots].filter(s =>
    slotFitsDiameter(roomSlot.get(s.slotId) || s, OPEN_SIRU.diameterM));
}

function fillCropSlots() {
  const list = cropCandidates().sort((a, b) => a.slotId.localeCompare(b.slotId));
  $('cropSlot').innerHTML = list.map(s =>
    `<option value="${s.slotId}">${slotLabel(s.slotId)}</option>`).join('');
  if (S.firstPlay.beansprout.slotId) $('cropSlot').value = S.firstPlay.beansprout.slotId;
  /* ★ 수확 전이면 언제든 옮길 수 있다 (2026-08-02 정정).
     예전엔 하루라도 자라면 잠가서, 그 자리의 조도 계약이 깨지면 고칠 방법이 없었다. */
  const locked = S.firstPlay.beansprout.harvested;
  $('cropSlot').disabled = locked;
  $('placeCrop').disabled = locked || !list.length;
}

/* ★ 개체 도착 경계. Day 4 선물과 개발 시나리오가 같은 원자적 생성 함수를 쓴다.
   앱을 열었다고 식물이 생기지 않는다 — 이 경계를 통과해야 생긴다.
   setGrowth(143) 는 여기서 딱 한 번. 그 뒤 하루 진행은 전부 advanceTo 다. */
function arrive(slotId) {
  if (hasPlant(S)) return pot0(S);
  const p = givePlant(S, io, { slotId: slotId || $('slot').value || null });
  renderLog($('log'), S);
  return p;
}

function buildRoom(id) {
  io.light.build(id);
  io.light.clearCache();
  S.home.room = id;
  if (pot0(S)) pot0(S).slotId = null;
  fillLamps();
  fillSlots(true);          // 새 방에서는 가장 밝은 자리에 놓고 시작한다
  if (S.firstPlay && S.firstPlay.enabled) fillCropSlots();
  draw();
}

/* ★ 코어 한글 표는 삭제했다 (2026-08-02). growth 의 `phaseKo` 를 그대로 쓴다 —
   표를 들면 growth 가 단계를 늘리거나 이름을 바꿀 때 **오류 없이 틀린 라벨**이 뜬다.
   실제로 그 표엔 seed·sprout 가 빠져 조용히 '도착함' 으로 떨어지고 있었다.
   phaseKo 가 없는 옛 growth 면 phaseId 키를 그대로 보여준다(조용히 비우지 않는다). */
const phaseLabel = (gp) => (gp && (gp.phaseKo || gp.phaseId)) || null;

function drawJourney() {
  const fp = S.firstPlay;
  if (!fp || !fp.enabled) return;
  const crop = fp.beansprout, food = fp.food, plant = fp.monstera;
  $('resDay').textContent = `Day ${S.day}`;
  $('resFood').textContent = `${food.cashFoodWon.toLocaleString()}원`;
  $('resSaved').textContent = `${food.totalFoodSavedWon.toLocaleString()}원`;
  $('cropMeter').style.width = `${Math.min(100, crop.ageDays / crop.harvestDays * 100)}%`;
  $('cropState').textContent = crop.harvested ? `${crop.meals}끼 수확 완료`
    : crop.slotId ? `${crop.ageDays}/${crop.harvestDays}일 자람` : '가방에 있음';
  $('cropInfo').textContent = crop.harvested
    ? `${crop.meals}끼 수확 · 수확일 ${Math.min(crop.meals, fp.rules.dailyCropMealCap)}끼 사용 · 남은 ${food.pantryMeals}끼`
    : crop.slotId ? `자리 ${slotLabel(crop.slotId)}` : '4일 뒤 첫 수확';

  const gp = plant.growthPhase;
  $('plantMeter').style.width = `${gp ? Math.round(gp.progress01 * 100) : 0}%`;
  $('plantState').textContent = !plant.arrived ? '아직 만나지 못함'
    : fp.completed ? '첫 새순 확인!' : (phaseLabel(gp) || '도착함');
  $('plantInfo').textContent = !plant.arrived ? '콩나물 첫 수확 뒤 도착'
    : fp.completed ? `말린 새순 단계 시작 · ${gp ? Math.round(gp.progress01 * 100) : 0}%`
    : `${slotLabel(plant.slotId)} · ${gp ? Math.round(gp.progress01 * 100) + '%' : '준비 중'}`;

  const quest = {
    place_beansprout: '가방의 열린 시루를 방 안 어두운 자리에 놓아 보세요.',
    grow_beansprout: `콩나물이 자라는 중입니다. 수확까지 ${Math.max(0, crop.harvestDays - crop.ageDays)}일.`,
    monstera_gift: '콩나물을 수확했습니다. 새로운 화분이 옵니다.',
    move_monstera: '몬스테라는 어두운 자리에서 자라지 않습니다. 높은 창가 자리로 옮겨 보세요.',
    complete: '말린 새순이 나왔습니다! 어두운 자리와 밝은 자리를 모두 찾았습니다.'
  };
  $('quest').textContent = quest[fp.phase] || '첫 플레이를 진행하세요.';
  $('slot').disabled = !plant.arrived;
  /* 30일 자동은 개발용 장기 관찰이다. 첫 학습 루프를 끝내기 전에는 우회 진입시키지 않는다. */
  $('run30').disabled = !fp.completed;
  $('stage').classList.toggle('no-plant', !plant.arrived);
  fillCropSlots();
}

function draw() {
  renderHUD($('hud'), S, lastTurn, io);
  renderLog($('log'), S);
  drawJourney();
}

/* ---- 배선 ---- */
$('room').onchange = e => buildRoom(e.target.value);
$('slot').onchange = e => {
  if (pot0(S)) {
    pot0(S).slotId = e.target.value;
    if (S.firstPlay.enabled) moveMonstera(S.firstPlay, e.target.value);
    pushLog(S, `🪴 몬스테라를 ${slotLabel(e.target.value)}(으)로 옮겼습니다`);
    unlockAfterFix();
  }
  draw();
};
$('lamps').onchange = e => { S.lamps.count = +e.target.value; io.light.clearCache(); fillSlots(); draw(); };
$('lit').onchange = e => { S.lamps.litHours = Math.max(0, Math.min(24, +e.target.value || 0)); io.light.clearCache(); draw(); };
$('mode').onchange = e => { S.sim.mode = e.target.value; io.light.clearCache(); draw(); };
$('placeCrop').onclick = guard(() => {
  const target = $('cropSlot').value;
  const r = placeBeansprout(S.firstPlay, target);
  pushLog(S, r.moved
    ? `🥣 열린 시루를 ${slotLabel(target)}(으)로 옮겼습니다 — 지금까지 받은 ${r.keptDays}일치 빛은 그대로입니다`
    : `🥣 열린 시루를 ${slotLabel(target)}에 두었습니다`);
  unlockAfterFix();                    // 자리를 고쳤으니 다시 시도할 수 있다
  draw();
});

/* loop.js 는 UI를 모른다 — S와 turn을 받아 화면을 그리는 건 여기 몫이다(헤드리스 시뮬 대비) */

/* ★ 계약이 끊기면(iframe 새로고침 등) 진행 버튼을 도로 잠그고 이유를 띄운다.
   조용히 넘어가면 '눌렀는데 아무 일도 안 남'이 되고, 그게 제일 늦게 발견된다. */
/* ★ 고칠 수 있는 실수는 잠그지 않는다 (2026-08-02 정정).
   예전엔 어떤 예외든 진행 버튼을 전부 껐고 다시 켜는 곳이 부팅밖에 없었다 —
   "시루를 먼저 놓아 주세요" 한 번이면 새로고침 전까지 게임이 죽었다.
   되돌려진 턴(core_rolled_back)·시작도 안 한 턴(not_started)·입력 실수는 **고쳐서 다시** 하면 된다.
   반대로 growth 가 이미 진행됐거나(growth_advanced) 진행 여부를 모르는(unknown) 경우만 잠근다 —
   그때 계속 누르면 어긋남이 조용히 쌓인다. */
/* ★ not_started 는 **growth 계약 단절**이다 — 고쳐서 다시 누를 수 있는 실수가 아니다.
   복구 가능은 ① 입력 안내(firstPlayInput) ② 되돌려진 턴(core_rolled_back) 둘뿐이다. */
const RECOVERABLE_TURN_STATES = new Set(['core_rolled_back']);
function isRecoverable(e) {
  if (e && e.recoverable === true) return true;
  if (e && e.turnState) return RECOVERABLE_TURN_STATES.has(e.turnState);
  return !!(e && e.firstPlayInput);          // 시루 미배치 같은 입력 안내
}
/* 자리를 고쳤을 때 다시 열어 주는 창구 — 잠긴 채로 방치하지 않는다. */
function unlockAfterFix() {
  if (document.body.dataset.hardLock === '1') return;   // 어긋남 잠금은 안 푼다
  GATED.forEach(id => { $(id).disabled = false; });
  if (S.firstPlay && S.firstPlay.enabled) $('run30').disabled = !S.firstPlay.completed;
}

function guard(fn) {
  return (...a) => {
    try { return fn(...a); }
    catch (e) {
      const recoverable = isRecoverable(e);
      if (!recoverable) { GATED.forEach(id => { $(id).disabled = true; }); document.body.dataset.hardLock = '1'; }
      /* drawn===false 처럼 **하루는 진행된** 예외는 턴을 싣고 온다 — 버리지 않고 그린다.
         화면이 어제 상태로 남으면 플레이어는 무슨 일이 있었는지 알 길이 없다. */
      if (e.turn) { lastTurn = e.turn; }
      pushLog(S, (recoverable ? '⚠ ' : '⛔ ') + e.message);
      renderLog($('log'), S);
      try { draw(); } catch { /* 그리기까지 실패하면 로그만 남긴다 */ }
      const stateText = {
        not_started: '계약 확인에서 멈춰 오늘은 시작되지 않았습니다',
        core_rolled_back: '코어 날짜를 되감았습니다',
        growth_input_recorded: '날짜는 되감았지만 growth에 오늘 빛 입력이 남았을 수 있습니다',
        growth_advanced: 'growth는 하루 진행됐고 이 턴 결과만 받지 못했습니다',
        unknown: 'growth 진행 여부를 확인할 수 없어 상태를 잠갔습니다'
      }[e.turnState] || (recoverable ? '고친 뒤 다시 [다음 날]을 누르면 됩니다'
                                     : '진행 상태를 확인할 수 없어 멈췄습니다');
      side.insertAdjacentHTML('afterbegin',
        `<div class="err">${recoverable ? '⚠ 오늘은 진행되지 않았습니다' : '⛔ 진행을 멈췄습니다'} — ` +
        `${stateText}<br>${e.message}</div>`);
      console.error(e);
    }
  };
}

function showFirstPlayEvents(turn) {
  const ev = turn && turn.firstPlayEvent;
  if (ev && ev.harvested) {
    banner(`🥣 콩나물 ${ev.meals}끼 수확!`,
      `오늘 식비 ${ev.cashFoodWon.toLocaleString()}원 · ${ev.foodSavedWon.toLocaleString()}원 절감`);
  }
  if (turn && turn.plantArrived) {
    fillSlots(false);
    $('slot').value = pot0(S).slotId;
    banner('🪴 몬스테라가 도착했습니다', '“콩나물을 잘 키웠구나. 이건 좀 더 어려울 거야.”');
  }
  if (S.firstPlay.completed) banner('🌱 말린 새순이 나왔어요!', '자리에 따라 필요한 빛이 다릅니다.');
}

$('next').onclick = guard(() => {
  if (!S.firstPlay.beansprout.slotId) {
    const e = new Error('가방의 열린 시루를 먼저 방 안에 놓아 주세요');
    e.firstPlayInput = true;                 // 안내지 고장이 아니다 — 버튼을 잠그지 않는다
    throw e;
  }
  lastTurn = nextDay(S, io).turn;
  showFirstPlayEvents(lastTurn);
  draw();
});

$('run30').onclick = guard(() => {
  arrive();
  const { turns } = runDays(S, io, 30);
  lastTurn = turns[turns.length - 1];
  draw();
  renderReport($('report'), S, io, turns);
});

/* ★ 방 프로파일 내보내기 — 밸런스 자동 시뮬이 THREE 없이 읽는 파일.
   조도 기하는 방마다 고정이라 한 번만 뽑으면 된다(src/game/room_profile.js). */
$('prof').onclick = () => {
  const p = io.light.profile([0, 1, 2]);
  const blob = new Blob([JSON.stringify(p, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `room_profile.${p.room}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  pushLog(S, `방 프로파일 저장 — ${p.room} · 슬롯 ${p.slots.length}`);
  renderLog($('log'), S);
};

$('reset').onclick = () => {
  const keep = { room: S.home.room, mode: S.sim.mode, lamps: { ...S.lamps } };
  S = newState({ room: keep.room, mode: 'novice', firstPlay: true, firstPlayRules: FIRST_RULES });
  S.lamps = keep.lamps;
  lastTurn = null;
  io.growth.reset();
  $('report').innerHTML = '<div class="ph">30일을 돌리면 나옵니다</div>';
  $('spark').innerHTML = '';
  $('firstResult').className = 'simresult';
  $('firstResult').textContent = '';
  delete $('firstResult').dataset.status;
  delete document.body.dataset.hardLock;      // 새 판이므로 잠금도 푼다
  GATED.forEach(id => { $(id).disabled = false; });
  buildRoom(keep.room);
};

/* ============================================================
   ★ 재미 확인 시나리오 — v0의 완료 조건을 눈으로 본다
     "등을 켰더니 잎이 갈라지기 시작했어요"가 실제로 뜨는지.
     판정은 growth의 canFenestrate()(7일평균 기준)를 그대로 쓴다 — 하루 값으로 띄우면 거짓말이 된다.
============================================================ */
const SCENARIOS = [
  { id:'first', kind:'firstPlay', ko:'★ 첫 플레이 · 콩나물→말린 새순 (7일)' },
  { id:'a', ko:'① 등 0개 · 좋은 자리 (90일)', days:90, lamps:0, pick:'brightest',
    hint:'반지하 자연광만. 아무 일도 일어나지 않는 것이 정답이다' },
  { id:'b', ko:'② 등 1개 · 나쁜 자리 (90일)', days:90, lamps:1, pick:'darkest',
    hint:'등값·전기만 나가고 식물은 그대로 — 등을 "샀다"고 되는 게 아니다' },
  { id:'c', ko:'③ 등 1개 · 좋은 자리 (90일)', days:90, lamps:1, pick:'brightest',
    hint:'같은 등, 자리만 다르다' },
  { id:'d', ko:'★④ 20일 뒤 등을 켠다 (좋은 자리)', days:90, lamps:0, pick:'brightest',
    at:21, thenLamps:1, cause:'등을 켰더니',
    hint:'★ 이게 v0의 완료 조건. 켜고 나서 며칠 뒤에 켜지는지 보라' },
  { id:'e', ko:'★⑤ 등 1개 · 20일 뒤 자리를 옮긴다', days:90, lamps:1, pick:'darkest',
    at:21, thenPick:'brightest', cause:'화분을 옮겼더니',
    hint:'★ 등은 그대로. 자리만 바꾼다 — "자리가 등보다 크다"' }
];
$('scen').innerHTML = SCENARIOS.map(s => `<option value="${s.id}">${s.ko}</option>`).join('');

const sleep = ms => new Promise(r => setTimeout(r, ms));
let stopFlag = false;

/* 지금 설정에서 밝은/어두운 자리 — 등을 켜면 순위가 바뀌므로 그때그때 다시 본다 */
function pickSlot(how) {
  const list = [...io.light.daily(S.day + 1, S).report.slots].sort((a, b) => b.dli - a.dli);
  return how === 'darkest' ? list[list.length - 1].slotId : list[0].slotId;
}

function banner(title, sub) {
  const el = $('event');
  el.innerHTML = `<b>${title}${sub ? `<i>${sub}</i>` : ''}</b>`;
  el.classList.add('on');
  setTimeout(() => el.classList.remove('on'), 6000);
}

function fenOn() {
  const f = io.growth.canFenestrate ? io.growth.canFenestrate(pot0(S) && pot0(S).variegated) : null;
  if (f !== null) return f;
  const p = pot0(S); if (!p) return null;
  const a7 = avg(S.dliHist, 7), th = io.light.thresholdsOf(p.plantId, false);
  return a7 != null && th && th.fenestrate != null && a7 >= th.fenestrate;
}

async function playFirstPlayScenario() {
  stopFlag = false;
  document.body.classList.add('scen-run');
  $('play').disabled = true; $('firstRun').disabled = true; $('stop').disabled = false;

  S = newState({ room: 'banjiha', mode: 'novice', firstPlay: true, firstPlayRules: FIRST_RULES });
  S.lamps.count = 0;
  lastTurn = null;
  io.growth.reset();
  $('room').value = 'banjiha'; $('mode').value = 'novice'; $('lamps').value = '0';
  buildRoom('banjiha');

  /* 시루가 들어가는 슬롯 중 가장 어두운 자리를 자동 시나리오의 플레이어 선택으로 삼는다. */
  const darkest = cropCandidates().sort((a, b) => a.dli - b.dli)[0];
  const darkSlot = darkest && darkest.slotId;
  if (!darkSlot) throw new Error('첫 플레이 자동 시뮬: 열린 시루가 들어갈 자리가 없습니다');
  placeBeansprout(S.firstPlay, darkSlot);
  pushLog(S, `🥣 자동 시뮬: 열린 시루를 ${darkSlot}(으)로 옮겼습니다`);

  const speed = +$('speed').value;
  const turns = [];
  for (let day = 1; day <= 4; day++) {
    lastTurn = nextDay(S, io).turn; turns.push(lastTurn); showFirstPlayEvents(lastTurn);
    draw(); if (speed) await sleep(speed);
  }

  const sill = io.light.room.slots.find(s => s.slotId === 'banjiha-sill:0');
  if (!pot0(S) || !sill) throw new Error('첫 플레이 자동 시뮬: 몬스테라 또는 창턱 슬롯이 없습니다');
  pot0(S).slotId = sill.slotId;
  moveMonstera(S.firstPlay, sill.slotId);
  fillSlots(false); $('slot').value = sill.slotId;
  pushLog(S, `🪴 자동 시뮬: 몬스테라를 ${sill.slotId}(으)로 옮겼습니다`);

  for (let day = 5; day <= 7 && !S.firstPlay.completed; day++) {
    lastTurn = nextDay(S, io).turn; turns.push(lastTurn); showFirstPlayEvents(lastTurn);
    draw(); if (speed) await sleep(speed);
  }
  if (!S.firstPlay.completed)
    throw new Error(`첫 플레이 자동 시뮬: Day ${S.day}까지 말린 새순이 나오지 않았습니다`);

  window.__firstPlayResult = {
    ok: true,
    day: S.day,
    cropSlot: S.firstPlay.beansprout.slotId,
    cropAvgDli: S.firstPlay.beansprout.avgDli,
    cropMeals: S.firstPlay.beansprout.meals,
    foodSavedWon: S.firstPlay.food.totalFoodSavedWon,
    monsteraSlot: pot0(S).slotId,
    growthPhase: S.firstPlay.monstera.growthPhase
  };
  const resultEl = $('firstResult');
  resultEl.className = 'simresult on';
  resultEl.dataset.status = 'pass';
  resultEl.dataset.day = String(S.day);
  resultEl.dataset.cropMeals = String(S.firstPlay.beansprout.meals);
  resultEl.dataset.foodSavedWon = String(S.firstPlay.food.totalFoodSavedWon);
  resultEl.dataset.monsteraPhase = S.firstPlay.monstera.growthPhase.phaseId;
  resultEl.textContent = `✅ Day ${S.day} 완료 · 콩나물 ${S.firstPlay.beansprout.meals}끼 · ` +
    `식비 ${S.firstPlay.food.totalFoodSavedWon.toLocaleString()}원 절감 · 말린 새순 등장`;
  renderReport($('report'), S, io, turns);
  pushLog(S, '✅ 첫 플레이 자동 시뮬레이션 완료 — 콩나물 수확부터 말린 새순까지 연결됨');
  draw();
  $('play').disabled = false; $('firstRun').disabled = false; $('stop').disabled = true;
  document.body.classList.remove('scen-run');
  return window.__firstPlayResult;
}

async function playScenario(sc) {
  if (sc.kind === 'firstPlay') return playFirstPlayScenario();
  stopFlag = false;
  document.body.classList.add('scen-run');
  $('play').disabled = true; $('stop').disabled = false;

  /* 초기화 — 같은 조건에서 다시 돌릴 수 있어야 비교가 된다.
     ★ 개체가 새로 '도착'한다. setGrowth 는 그 한 번뿐이고 이후는 advanceTo 다. */
  S = newState({ room: S.home.room, mode: S.sim.mode });
  S.lamps.count = sc.lamps;
  io.growth.reset();
  $('lamps').value = String(sc.lamps);
  const startSlot = pickSlot(sc.pick);
  arrive(startSlot);
  fillSlots(); $('slot').value = pot0(S).slotId;
  pushLog(S, `시나리오 ${sc.ko} — ${sc.hint}`);

  const th = io.light.thresholdsOf(pot0(S).plantId, false);
  const speed = +$('speed').value;
  const turns = [];
  let announced = false, switched = false;

  for (let d = 1; d <= sc.days; d++) {
    if (stopFlag) { pushLog(S, `${sc.ko} 정지 (${d - 1}일)`); break; }

    /* 전환 시점 — 등을 켜거나 자리를 옮긴다 */
    if (sc.at && d === sc.at && !switched) {
      switched = true;
      if (sc.thenLamps != null) {
        S.lamps.count = sc.thenLamps; $('lamps').value = String(sc.thenLamps);
        io.light.clearCache();
        pushLog(S, `☀ 식물등을 켰습니다 (${d}일)`);
        banner('☀ 식물등을 켰습니다', '이제 며칠 지켜보세요 — 판정은 7일 평균입니다');
      }
      if (sc.thenPick) {
        pot0(S).slotId = pickSlot(sc.thenPick); $('slot').value = pot0(S).slotId;
        pushLog(S, `🪴 화분을 밝은 자리로 옮겼습니다 (${d}일)`);
        banner('🪴 화분을 옮겼습니다', '등은 그대로입니다 — 자리만 바꿨습니다');
      }
      if (speed) await sleep(1400);
    }

    lastTurn = nextDay(S, io).turn;
    turns.push(lastTurn);

    /* ★ 갈라짐이 켜지는 순간 */
    if (!announced && fenOn()) {
      announced = true;
      const since = sc.at ? ` · ${sc.cause || '바꾸고'} ${d - sc.at + 1}일 만에` : '';
      pushLog(S, `🌿 잎이 갈라지기 시작했습니다 (${d}일)`);
      banner(`🌿 ${sc.cause ? sc.cause + ' ' : ''}잎이 갈라지기 시작했어요!`,
             `${d}일째 · 7일 평균 ${(turn7()).toFixed(2)} ≥ 문턱 ${th.fenestrate}${since}`);
      if (speed) await sleep(2200);
    }

    if (speed === 0) { if (d % 15 === 0 || d === sc.days) { draw(); await sleep(0); } }
    else { draw(); renderSpark($('spark'), S.dliHist, th && th.fenestrate, null); await sleep(speed); }
  }

  draw();
  renderSpark($('spark'), S.dliHist, th && th.fenestrate, fenDayOf(th));
  renderReport($('report'), S, io, turns);
  $('play').disabled = false; $('stop').disabled = true;
  document.body.classList.remove('scen-run');
  if (!announced) {
    pushLog(S, `${sc.days}일 동안 갈라지지 않았습니다 — 7일평균이 문턱 ${th.fenestrate}에 닿지 않았습니다`);
    renderLog($('log'), S);
  }
}

const turn7 = () => io.growth.dli7() ?? avg(S.dliHist, 7) ?? 0;

/* 이력에서 처음 문턱을 넘은 날 — 그래프에 세로선으로 표시한다 */
function fenDayOf(th) {
  if (!th || th.fenestrate == null) return null;
  /* ★ 같은 창을 쓴다 — loop.rollingAvg(최근 7개 유효 관측). 여기서 다시 짜면 그래프와 어긋난다. */
  const a7 = rollingAvg(S.dliHist, 7);
  for (let i = 0; i < a7.length; i++)
    if (a7[i] != null && a7[i] >= th.fenestrate) return i + 1;
  return null;
}

$('play').onclick = () => playScenario(SCENARIOS.find(s => s.id === $('scen').value))
  .catch(e => {                                  // 시나리오 도중 계약이 끊긴 경우도 같은 처리
    stopFlag = true;
    $('stop').disabled = true;
    document.body.classList.remove('scen-run');
    if (!isRecoverable(e)) { GATED.forEach(id => { $(id).disabled = true; }); document.body.dataset.hardLock = '1'; }
    pushLog(S, '⛔ ' + e.message); renderLog($('log'), S);
    side.insertAdjacentHTML('afterbegin',
      `<div class="err">⛔ 시나리오를 멈췄습니다 — 상태 ${e.turnState || 'unknown'}<br>${e.message}</div>`);
    console.error(e);
  });
$('stop').onclick = () => { stopFlag = true; };
$('firstRun').onclick = () => playFirstPlayScenario().catch(e => {
  window.__firstPlayResult = { ok: false, error: e.message };
  if (!isRecoverable(e)) { $('play').disabled = true; $('firstRun').disabled = true; document.body.dataset.hardLock = '1'; }
  $('stop').disabled = true;
  pushLog(S, '⛔ ' + e.message); renderLog($('log'), S);
  $('firstResult').className = 'simresult on fail';
  $('firstResult').dataset.status = 'fail';
  $('firstResult').textContent = `⛔ ${e.message}`;
  side.insertAdjacentHTML('afterbegin', `<div class="err">⛔ 첫 플레이 시뮬레이션 실패<br>${e.message}</div>`);
  console.error(e);
});

/* ---- 시작 ---- */
/* ★ 생장 계약이 준비되기 전에는 진행 버튼을 열지 않는다 (2026-08-02).
   일곱 함수(setDailyLight·advanceTo·calendarDay·growthDays·growthBlocked·growthPhase·setGrowth)가
   다 있어야 ready() 가 통과한다. 실패하면 버튼은 계속 잠긴 채로 둔다 —
   반쯤 도는 상태로 굴리면 '왜 안 자라지'가 계약 문제인지 빛 문제인지 못 가른다. */
const GATED = ['next', 'run30', 'play', 'firstRun'];
try {
  $('room').value = S.home.room;
  $('mode').value = S.sim.mode;
  buildRoom(S.home.room);
  await io.growth.ready();
  GATED.forEach(id => { $(id).disabled = false; });
  /* 첫 플레이는 고정 지역·novice·식물등 없음. 개발 검수 시나리오에서는 재설정할 수 있다. */
  $('room').disabled = true; $('mode').disabled = true; $('lamps').disabled = true; $('lit').disabled = true;
  pushLog(S, '첫 플레이 준비 완료 — 열린 시루를 놓고 [다음 날]을 눌러 보세요');
  draw();
} catch (err) {
  GATED.forEach(id => { $(id).disabled = true; });       // 실패하면 계속 잠근다
  side.insertAdjacentHTML('afterbegin',
    `<div class="err">⚠ 진행 버튼을 잠갔습니다<br>${err.message.split('\n').join('<br>')}</div>`);
  console.error(err);
}
</script>

<!doctype html><meta charset="utf-8"><title>공간 격자 성능</title>
<body style="background:#111;color:#ddd;font:12px/1.6 monospace;padding:16px">
<pre id="out">재는 중…</pre>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script type="module">
/* 방 등급을 '가구 슬롯'이 아니라 '공간'으로 재려면 격자를 돌려야 한다.
   아파트 12×10×1.7m를 0.25m로 쪼개면 만 단위 점이다 — 되는지부터 잰다.
   ★ 전체를 돌리지 않는다. 표본으로 재고 외삽한다(멈추면 확인이 안 되니까). */
import { buildHouse } from './src/render3d/house.js';
import { winFromHouse } from './src/engine/daylight_lux.js';
import { daylightRatio, daylightDLI } from './src/engine/daily_light.js';

const J = p => fetch(p).then(r=>r.json());
const [HR, WP, DP, FIN, FP, LP, TH, SH] = await Promise.all([
  J('./data/house_rooms.json'), J('./data/window_presets.json'), J('./data/door_presets.json'),
  J('./data/room_finishes.json'), J('./data/furniture_presets.json'), J('./data/lighting_presets.json'),
  J('./data/balance/light_thresholds.json'), J('./data/shading_presets.json')
]);
const wp = WP.presets||WP, dp = DP.presets||DP, fp = FP.presets||FP;
const L = [];

const built = buildHouse(null, HR.rooms.apartment, wp, dp, FIN, fp, LP, SH);
const size = built.size;
const wins = (built.luxWins||[]).map(w=>winFromHouse(w.wall,w.cu,w.cy,w.w,w.h,size,w.tau,w.evScale)).filter(Boolean);

const all  = built.occluders||[];
const noFurn = all.filter(o=>o.src!=='furniture');
L.push('# 공간 격자 성능 — 아파트');
L.push('');
L.push(`방 ${size.w}×${size.d}×${size.h}m · 창 ${wins.length}개`);
L.push(`차폐체 전체 ${all.length}개 → **가구 제외 ${noFurn.length}개**` +
       ` (가구 ${all.filter(o=>o.src==='furniture').length} · 칸막이 ${all.filter(o=>o.src==='partition').length} · 기타 ${all.filter(o=>!o.src).length})`);
L.push('');

/* 격자 점 목록 — 실제로 만들어 개수를 확인한다(외삽 분모) */
function gridPts(step, ys){
  const pts=[], m=0.05;   // 벽에서 살짝 띄운다
  for(let x=-size.w/2+m; x<=size.w/2-m; x+=step)
    for(let z=-size.d/2+m; z<=size.d/2-m; z+=step)
      for(const y of ys) pts.push({x,y,z});
  return pts;
}
const YS_FULL = []; for(let y=0.10; y<=1.80001; y+=0.25) YS_FULL.push(+y.toFixed(2));
const YS_3    = [0.30, 0.80, 1.30];

/* 표본 N개만 재고 전체로 외삽한다 */
function bench(pts, occ, N=150, samples=undefined){
  const step = Math.max(1, Math.floor(pts.length/N));
  const pick = []; for(let i=0;i<pts.length;i+=step) pick.push(pts[i]);
  const o = { occluders: occ, glazed: built.glazedPanes };
  if (samples) o.samples = samples;
  /* ★ 반복해서 최소 200ms 이상 돌린다 — headless 타이머 해상도가 낮아
     한 번만 재면 0ms 로 나온다(실제로 그렇게 나왔다). */
  let acc=0, reps=0, dt=0;
  const t0 = Date.now();
  do {
    for(const p of pick) acc += daylightRatio(p, {x:0,y:1,z:0}, wins, o);
    reps++; dt = Date.now()-t0;
  } while (dt < 250 && reps < 2000);
  const per = dt/(pick.length*reps);
  return { n:pick.length, per, total: per*pts.length, pts: pts.length, acc, reps, dt };
}

const CASES = [
  ['0.25m · 높이 8단(0.1~1.8) · 가구제외', gridPts(0.25, YS_FULL), noFurn, undefined],
  ['0.25m · 높이 3단(0.3/0.8/1.3) · 가구제외', gridPts(0.25, YS_3), noFurn, undefined],
  ['0.50m · 높이 8단 · 가구제외', gridPts(0.50, YS_FULL), noFurn, undefined],
  ['0.50m · 높이 3단 · 가구제외', gridPts(0.50, YS_3), noFurn, undefined],
  ['0.25m · 높이 8단 · 샘플 고정 12×12', gridPts(0.25, YS_FULL), noFurn, [12,12]],
  ['0.25m · 높이 8단 · 가구포함(참고)', gridPts(0.25, YS_FULL), all, undefined],
];

L.push('## 표본 150점으로 재고 전체로 외삽');
L.push('');
L.push('| 조건 | 격자 점 수 | 점당 | **전체 예상** |');
L.push('|---|---|---|---|');
const res=[];
for(const [name, pts, occ, smp] of CASES){
  const r = bench(pts, occ, 150, smp);
  res.push([name,r]);
  const sec = r.total/1000;
  const mark = sec<3 ? '✅' : sec<15 ? '⚠' : '★ 너무 느림';
  L.push(`| ${name} | ${r.pts.toLocaleString()} | ${r.per.toFixed(3)}ms | **${sec<1?(r.total).toFixed(0)+'ms':sec.toFixed(1)+'초'}** ${mark} |`);
}

/* 왜 느린가 — 적응 샘플링이 창 가까이서 폭발한다 */
L.push('');
L.push('## 왜 느린가 — 적응 샘플링');
L.push('');
L.push('| 창에서 거리 | 패치(d/4) | 필요 분할 | 실제(64 clamp) | 창 1개 샘플 수 |');
L.push('|---|---|---|---|---|');
for(const d of [0.3, 0.5, 1.0, 2.0, 4.0]){
  const w = wins[0];
  const patch = d/4;
  const nu = Math.ceil(w.width/patch), nv = Math.ceil(w.height/patch);
  const cu = Math.max(4,Math.min(64,nu)), cv = Math.max(4,Math.min(64,nv));
  L.push(`| ${d}m | ${patch.toFixed(2)}m | ${nu}×${nv} | ${cu}×${cv} | **${(cu*cv).toLocaleString()}** |`);
}
L.push('');
L.push(`발코니 창이 ${wins[0].width.toFixed(1)}m 통창이라 가까이서 64×64 = 4,096 샘플로 clamp된다.`);
L.push('샘플마다 차폐체 OBB를 전부 훑으므로 점당 비용이 여기서 정해진다.');

/* 정확도 대조 — 샘플 고정이 값을 얼마나 바꾸나 */
L.push('');
L.push('## 샘플 고정 12×12 로 줄이면 값이 얼마나 틀리나');
L.push('');
L.push('| 지점 | auto | 12×12 | 오차 |');
L.push('|---|---|---|---|');
const probes = [
  ['발코니 창가 y0.8', {x:-3.0, y:0.8, z:-4.6}],
  ['거실 중앙 y0.8',   {x:0.0,  y:0.8, z:-1.0}],
  ['거실 깊은 곳 y0.8',{x:0.0,  y:0.8, z:2.0}],
  ['안방 y0.8',        {x:-4.0, y:0.8, z:-1.5}],
];
for(const [nm,p] of probes){
  const a = daylightDLI(daylightRatio(p,{x:0,y:1,z:0},wins,{occluders:noFurn,glazed:built.glazedPanes}),{weather:'clear',season:'summer'});
  const b = daylightDLI(daylightRatio(p,{x:0,y:1,z:0},wins,{occluders:noFurn,glazed:built.glazedPanes,samples:[12,12]}),{weather:'clear',season:'summer'});
  L.push(`| ${nm} | ${a.toFixed(3)} | ${b.toFixed(3)} | ${a>0?((b/a-1)*100).toFixed(1)+'%':'—'} |`);
}

document.getElementById('out').textContent = L.join('\n');
document.title = 'DONE';
</script>

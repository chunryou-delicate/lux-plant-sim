<!doctype html><meta charset="utf-8"><title>DLI 실측</title>
<body style="background:#111;color:#ddd;font:12px/1.6 monospace;padding:16px">
<pre id="out">측정 중…</pre>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script type="module">
/* 게임과 똑같은 경로로 방을 조립해 '실제 슬롯 좌표 + 실제 차폐체'로 DLI를 잰다.
   자유공간 탐색이 아니라 진짜 화분 놓을 자리 기준. 결과는 <pre>에 마크다운으로. */
import { buildHouse } from './src/render3d/house.js';
import { winFromHouse, WEATHER, SEASON, skyEvMax } from './src/engine/daylight_lux.js';
import { daylightRatio, daylightDLI, judgeDLI, dayLengthHours } from './src/engine/daily_light.js';
import { weekStats, weatherE, WEATHER_P, setWeatherProbs } from './src/engine/weather.js';

const J = p => fetch(p).then(r=>r.json());
const [houseRooms, winPresets, doorPresets, finishes, furnPresets, lightPresets, TH, SH] = await Promise.all([
  J('./data/house_rooms.json'), J('./data/window_presets.json'), J('./data/door_presets.json'),
  J('./data/room_finishes.json'), J('./data/furniture_presets.json'), J('./data/lighting_presets.json'),
  J('./data/balance/light_thresholds.json'), J('./data/shading_presets.json')
]);
const wp = winPresets.presets||winPresets, dp = doorPresets.presets||doorPresets, fp = furnPresets.presets||furnPresets;

const NAMES = { banjiha:'반지하', oneroom:'원룸', tworoom:'투룸', apartment:'아파트', greenhouse:'온실', classroom:'학원교실' };
const CASES = [['clear','summer'],['cloudy','summer'],['rain','summer'],['clear','winter'],['cloudy','winter']];
const L = [];

// 방마다 최고 슬롯 1개를 고른다(차폐 ON, 자기 가구는 자가차폐 제외)
const rooms = {};
for (const key of Object.keys(NAMES)) {
  const def = houseRooms.rooms[key];
  if (!def) { L.push('· 방 없음: '+key); continue; }
  let built;
  try { built = buildHouse(null, def, wp, dp, finishes, fp, lightPresets, SH); }
  catch(e){ L.push('· 조립 실패 '+key+': '+e.message); continue; }
  const size = built.size;
  /* ★ evScale(향 계수 × 차광 배율)을 반드시 넘긴다.
     이걸 빠뜨리면 게임(main.js)·계약(buildDailyLight)과 다른 값이 나온다 —
     실제로 온실이 12.42(계약) vs 13.01(여기)로 갈렸다. 남향은 1.0이라 티가 안 나고
     동/북향·천창이 있는 방에서만 어긋나서 더 늦게 발견됐다. */
  const wins  = (built.luxWins||[]).map(w=>winFromHouse(w.wall,w.cu,w.cy,w.w,w.h,size,w.tau,w.evScale,w.cz)).filter(Boolean);
  const winsNoEv = (built.luxWins||[]).map(w=>winFromHouse(w.wall,w.cu,w.cy,w.w,w.h,size,w.tau)).filter(Boolean);
  const slots = built.plantSlots||[];
  if (!wins.length || !slots.length) { L.push('· '+NAMES[key]+': 창 '+wins.length+' 슬롯 '+slots.length+' → 건너뜀'); continue; }
  let best=null, worst=null; const ratios=[]; let bestNoEv=0;
  for (const s of slots) {
    const p = s.point || {x:s.x,y:s.y,z:s.z};
    const o = { occluders: built.occluders, glazed: built.glazedPanes, selfIdx: s.occIdx };
    const r = daylightRatio(p, {x:0,y:1,z:0}, wins, o);
    ratios.push(r);
    bestNoEv = Math.max(bestNoEv, daylightRatio(p, {x:0,y:1,z:0}, winsNoEv, o));
    if (!best  || r > best.r)  best  = { r, p, s };
    if (!worst || r < worst.r) worst = { r, p, s };
  }
  // 창까지 수평 거리
  const d = Math.min(...wins.map(w=>Math.hypot(best.p.x-w.cx, best.p.z-w.cz)));
  rooms[key] = { best, worst, ratios, bestNoEv, evNames:[...new Set((built.luxWins||[]).map(w=>w.orient+':'+(w.evScale??1).toFixed(2)))], orients:(built.luxWins||[]).map(w=>w.orient), wins, slots:slots.length, occ:(built.occluders||[]).length, dist:d, size };
}

L.push('## 방 조립 결과');
L.push('| 방 | 크기 | 향 | 창 | 슬롯 | 차폐체 | 최고↔최저 격차 |');
L.push('|---|---|---|---|---|---|---|');
for (const k of Object.keys(rooms)) { const r=rooms[k];
  const gap = r.worst.r>0 ? (r.best.r/r.worst.r).toFixed(0)+'배' : '∞ (최저 0)';
  const ors = [...new Set(r.orients)].join('·');
  L.push(`| ${NAMES[k]} | ${r.size.w}×${r.size.d}m | ${ors} | ${r.wins.length} | ${r.slots} | ${r.occ} | ${gap} |`); }

L.push('');
L.push('## ★ evScale(향×차광) 적용 여부 — 계약 경로와 같은가');
L.push('');
L.push('`winFromHouse(..., w.tau, w.evScale)` 로 넘겨야 게임·계약과 같은 값이 나온다.');
L.push('예전 probe는 evScale을 빠뜨려 향 계수가 빠진 값을 냈다.');
L.push('');
L.push('| 방 | 창 향:evScale | peak(evScale 적용) | peak(빠뜨림) | 차이 |');
L.push('|---|---|---|---|---|');
for (const k of Object.keys(rooms)) { const r=rooms[k];
  const a = daylightDLI(r.best.r,   {weather:'clear',season:'summer'});
  const b = daylightDLI(r.bestNoEv, {weather:'clear',season:'summer'});
  const d = b>0 ? ((b/a-1)*100).toFixed(1)+'%' : '—';
  L.push(`| ${NAMES[k]} | ${r.evNames.join(' · ')} | **${a.toFixed(2)}** | ${b.toFixed(2)} | ${Math.abs(b-a)<0.005?'같음':'★ +'+d} |`);
}

/* ★ 슬롯 분포 — '어두운 칸이 몇 개인지'가 난이도 근거다.
   최고값 하나만 보면 방 안에서 몇 자리를 실제로 쓸 수 있는지 모른다. */
L.push('');
L.push('## 슬롯 DLI 분포 (맑음·여름) — 밴드별 칸 수');
L.push('| 방 | 슬롯 | <0.3 고사권 | 0.3~1.5 정체 | 1.5~3 느림 | 3~6 성장 | ≥6 갈라짐 |');
L.push('|---|---|---|---|---|---|---|');
for (const k of Object.keys(rooms)) { const r=rooms[k];
  const ds=r.ratios.map(x=>daylightDLI(x,{weather:'clear',season:'summer'}));
  const c=[0,0,0,0,0];
  for(const d of ds){ c[ d<0.3?0 : d<1.5?1 : d<3?2 : d<6?3 : 4 ]++; }
  L.push(`| ${NAMES[k]} | ${ds.length} | **${c[0]}** | ${c[1]} | ${c[2]} | ${c[3]} | ${c[4]} |`);
}

/* ★★ 7일 이동평균 — 판정에 실제로 쓰이는 값
   하루 peak는 "1년에 며칠 있는 최고 조건"이라 밸런싱 근거가 못 된다.
   생장 창은 고사·갈라짐을 7일 이동평균으로 판정한다 → 여기 맞춰 재야 한다.

   daylightDLI 는 ratio에 정확히 선형이라(peakPPFD ∝ ratio) 계절 계수 하나만
   구하면 슬롯마다 다시 90일을 굴릴 필요가 없다. K = ratio 1일 때의 7일평균. */
const FEN = TH.plants.monstera_deliciosa.fenestrate;
const K1  = daylightDLI(1, {weather:'clear', season:'summer'});   // ratio 1, 맑음·여름 peak
const WK = {};
for (const s of ['summer','winter']) {
  WK[s] = weekStats((w, ss) => daylightDLI(1, {weather:w, season:ss}), {season:s, win:7, years:20});
}
const avg7 = (ratio, s) => ratio * WK[s].mean;
const wk   = (ratio, s, f) => ratio * WK[s][f];

L.push('');
L.push('## ★ 7일 이동평균 — 판정 기준값');
L.push('');
L.push('peak = 맑음·여름 하루 최고. **갈라짐·고사는 7일 이동평균으로 판정**하므로 이 값이 밸런싱 근거다.');
L.push('');
L.push('**평균과 꼬리를 다르게 낸다.** 평균은 해석적 기댓값 E를 쓴다 — 굴려서 평균 내면 표본 오차가');
L.push('섞인다(한 계절 90일이면 ±5%p, 실제로 그 오차로 결론이 한 번 뒤집혔다).');
L.push('꼬리(최악주·최고주·초과 비율)만 굴리고, 그때도 20년을 돌린다.');
L.push('');
L.push(`날씨 확률 — 맑음 ${WEATHER_P.summer.clear} / 흐림 ${WEATHER_P.summer.cloudy} / 비 ${WEATHER_P.summer.rain}` +
       `  (정본: data/balance/weather.json · plan 소유)`);
L.push(`날씨 계수 — 맑음 1.00 / 흐림 0.25 / 비 0.12  → **E = ${weatherE('summer').toFixed(4)}**  ← 확률과 계수는 다른 것`);
L.push(`굴림 표본 ${WK.summer.weeks}주(20년치 여름)`);
L.push('');
L.push(`| 방 | peak | **7일평균(=peak×${weatherE('summer').toFixed(3)})** | 최악주 | 중앙주 | 최고주 | 갈라짐 주 비율(≥${FEN}) |`);
L.push('|---|---|---|---|---|---|---|');
for (const k of Object.keys(rooms)) { const r=rooms[k];
  const pk = daylightDLI(r.best.r, {weather:'clear', season:'summer'});
  const as = avg7(r.best.r,'summer');
  const pct = pctOver(r.best.r, FEN);
  L.push(`| ${NAMES[k]} | ${pk.toFixed(2)} | **${as.toFixed(2)}** | ${wk(r.best.r,'summer','min').toFixed(2)} | ${wk(r.best.r,'summer','p50').toFixed(2)} | ${wk(r.best.r,'summer','max').toFixed(2)} | ${pct} |`);
}
function pctOver(ratio, th){
  /* 주별 분포는 ratio에 선형이므로 ratio 1 분포의 문턱을 th/ratio 로 환산하면 된다 */
  const s = weekStats((w,ss)=>daylightDLI(1,{weather:w,season:ss}),
                      {season:'summer', win:7, years:20, over: th/ratio});
  return s.overPct === 0 ? '**0%**' : (s.overPct >= 50 ? `**${s.overPct}%**` : `${s.overPct}%`);
}
L.push('');
L.push(`겨울 7일평균 = peak × ${(WK.winter.mean/K1).toFixed(3)} (계절 계수까지 포함).`);
L.push('방마다 비율이 같다 — DLI가 ratio에 정확히 선형이라 날씨 계수만 곱해진다.');

L.push('');
L.push('## 슬롯 밴드 분포 — 7일평균(여름) 기준');
L.push('| 방 | 슬롯 | <0.3 고사권 | 0.3~1.5 정체 | 1.5~3 느림 | 3~6 성장 | ≥6 갈라짐 |');
L.push('|---|---|---|---|---|---|---|');
for (const k of Object.keys(rooms)) { const r=rooms[k];
  const ds=r.ratios.map(x=>avg7(x,'summer'));
  const c=[0,0,0,0,0];
  for(const d of ds){ c[ d<0.3?0 : d<1.5?1 : d<3?2 : d<6?3 : 4 ]++; }
  L.push(`| ${NAMES[k]} | ${ds.length} | **${c[0]}** | ${c[1]} | ${c[2]} | ${c[3]} | **${c[4]}** |`);
}

/* 7일평균이 갈라짐 문턱을 넘으려면 peak가 얼마여야 하나 — plan의 ⑵안 근거 */
L.push('');
L.push(`### 문턱 역산 — 갈라짐 ${FEN} 을 넘으려면 맑음·여름 peak가 얼마여야 하나`);
L.push('');
L.push('| 조건 | 필요 peak |');
L.push('|---|---|');
L.push(`| **늘** 갈라짐 (7일평균 기댓값 > 문턱) | **${(FEN/(WK.summer.mean/K1)).toFixed(2)}** |`);
L.push(`| **절반의 주**에서 (중앙주 > 문턱) | **${(FEN/(WK.summer.p50/K1)).toFixed(2)}** |`);
L.push(`| **가장 좋은 주에만** (최고주 > 문턱) | **${(FEN/(WK.summer.max/K1)).toFixed(2)}** |`);
L.push(`| 참고 — 현재 온실 ${daylightDLI(rooms.greenhouse?rooms.greenhouse.best.r:0,{weather:'clear',season:'summer'}).toFixed(2)} · 아파트 ${daylightDLI(rooms.apartment?rooms.apartment.best.r:0,{weather:'clear',season:'summer'}).toFixed(2)} | |`);

for (const [w,s] of CASES) {
  L.push('');
  L.push(`## ${WEATHER[w].ko} · ${SEASON[s].ko} — 천공 ${Math.round(skyEvMax({weather:w,season:s}))} lx · 낮 ${dayLengthHours(s)}h`);
  L.push('| 방 | 한낮 lx | 최고 DLI | 최저 DLI | DLI≥3 자리 | DLI≥6 자리 | 몬스테라(최고) | 산세(최고) |');
  L.push('|---|---|---|---|---|---|---|---|');
  for (const k of Object.keys(rooms)) { const r=rooms[k];
    const dli = daylightDLI(r.best.r, {weather:w, season:s});
    const lx = Math.round(r.best.r * skyEvMax({weather:w,season:s}));
    const m = judgeDLI(dli, TH.plants.monstera_deliciosa), sa = judgeDLI(dli, TH.plants.sansevieria);
    const wd = daylightDLI(r.worst.r, {weather:w, season:s});
    const ds = r.ratios.map(x=>daylightDLI(x, {weather:w, season:s}));
    const n3 = ds.filter(x=>x>=3).length, n6 = ds.filter(x=>x>=6).length;
    L.push(`| ${NAMES[k]} | ${lx} | **${dli.toFixed(2)}** | ${wd.toFixed(2)} | ${n3}/${r.slots} | ${n6}/${r.slots} | ${m.ko}${m.fenestrating?'·갈라짐':''} | ${sa.ko} |`);
  }
}
document.getElementById('out').textContent = L.join('\n');
document.title = 'DONE';
</script>

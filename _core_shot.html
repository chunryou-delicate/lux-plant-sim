<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>core shot</title>
<!--
  코어 검수 촬영 하네스 (core 소유 · 게임 UI 아님)
  ------------------------------------------------------------
  첫 플레이 화면 검수 조건을 코드로 고정해 두고, 같은 각도·크기로 두 장을 찍기 위한 것.
      novice · 식물등 0 · banjiha-sill:0 · [다음 날] N회
  plant_grow.html 을 화면 전체로 띄우고 **기본 카메라 그대로** 둔다 —
  에셋 크기·카메라·연출은 건드리지 않는다. 상태만 루프로 만들어 놓고 찍는다.

  사용:  _core_shot.html?days=1  → 유효 144
         _core_shot.html?days=3  → 유효 146
  헤드리스: chrome --headless --screenshot=out.png --window-size=1280,860 \
                    --virtual-time-budget=30000 "http://127.0.0.1:8781/_core_shot.html?days=3"
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#14101c}
  #growth{position:fixed;inset:0;width:100%;height:100%;border:0}
  /* 촬영 식별용 한 줄. 3D 위에 얹지 않고 좌하단 구석에만 둔다(카메라·연출 불변) */
  #stamp{position:fixed;left:8px;bottom:8px;z-index:9;font:12px/1.5 ui-monospace,monospace;
    color:#fff;background:rgba(0,0,0,.62);padding:5px 9px;border-radius:7px;white-space:pre}
</style>
</head>
<body>
<iframe id="growth" src="./plant_grow.html"></iframe>
<div id="stamp">준비 중…</div>
<script type="module">
import { newState, givePlant, pot0 } from './src/game/state.js';
import { createLightEngine } from './src/game/light_adapter.js';
import { createGrowthAdapter } from './src/game/growth_adapter.js';
import { nextDay } from './src/game/loop.js';

const DAYS = +(new URLSearchParams(location.search).get('days') ?? 0);
const SLOT = new URLSearchParams(location.search).get('slot') || 'banjiha-sill:0';
const stamp = document.getElementById('stamp');

/* ★ 폴백을 두지 않는다 (2026-08-02).
   검수 촬영은 "이 조건에서 이 화면이 나온다"의 증거다. 파일 하나가 비어도 빈 기본값으로
   조용히 굴러가면 **틀린 조건의 사진**이 증거로 남는다. HTTP·JSON·필수 키 중 하나라도
   어긋나면 촬영을 멈추고 SHOT FAIL 을 낸다. */
const empty = (v) => v == null
  || (typeof v === 'object' && !Array.isArray(v) && Object.keys(v).length === 0)
  || (Array.isArray(v) && v.length === 0);

async function need(path, keys = []) {
  let res;
  try { res = await fetch(path); }
  catch (e) { throw new Error(`${path} 요청 실패 — ${e.message}`); }
  if (!res.ok) throw new Error(`${path} HTTP ${res.status}`);
  let json;
  try { json = await res.json(); }
  catch (e) { throw new Error(`${path} JSON 파싱 실패 — ${e.message}`); }
  if (!json || typeof json !== 'object') throw new Error(`${path} 내용이 객체가 아닙니다`);
  if (empty(json)) throw new Error(`${path} 이(가) 빈 객체입니다`);
  for (const k of keys) {
    const v = k.split('.').reduce((o, kk) => (o == null ? o : o[kk]), json);
    if (empty(v)) throw new Error(`${path} 에 필수 키 "${k}" 가 없습니다(비었습니다)`);
  }
  return json;
}

/* 프리셋류는 `{presets:{…}}` 이거나 그 자체가 표다. 어느 쪽이든 **비어 있으면 실패**시킨다 —
   빈 표로 방을 조립하면 창도 문도 가구도 없는 방이 조용히 만들어지고, 그 사진이 증거로 남는다. */
function presetsOf(path, raw, needIds = []) {
  const table = raw && raw.presets ? raw.presets : raw;
  if (empty(table)) throw new Error(`${path} 의 프리셋 표가 비었습니다`);
  for (const id of needIds)
    if (empty(table[id])) throw new Error(`${path} 에 "${id}" 프리셋이 없습니다`);
  return table;
}

/* 테스트용 실패 주입 — `?empty=window` 처럼 준 데이터셋을 비워 검증이 실제로 잡는지 본다.
   실패만 만들 수 있고 통과를 만들 수는 없다(검증을 우회하지 않는다). */
const EMPTY_INJECT = (new URLSearchParams(location.search).get('empty') || '')
  .split(',').map(s => s.trim()).filter(Boolean);
const inject = (name, v) => EMPTY_INJECT.includes(name) ? {} : v;

function fail(msg) {                       // 촬영 중단 — 사진 대신 실패를 남긴다
  stamp.textContent = 'SHOT FAIL — ' + msg;
  stamp.style.background = 'rgba(190,40,30,.92)';
  document.title = 'SHOT FAIL | ' + msg;
  window.__shotFailed = true;
  throw new Error(msg);
}

try {
/* 인자부터 본다 — 데이터를 다 받고 나서 걸러 봐야 늦다 */
if (!Number.isInteger(DAYS) || DAYS < 0)
  fail(`days 는 0 이상 정수여야 합니다 — 받은 값 "${new URLSearchParams(location.search).get('days')}"`);

const [houseRoomsRaw, winRaw, doorRaw, finishes, furnRaw, lightPresets, shadePresets,
       lightTh, weatherBalance] = await Promise.all([
  need('./data/house_rooms.json', ['rooms', 'rooms.banjiha', 'rooms.banjiha.furniture',
                                   'rooms.banjiha.windows', 'rooms.banjiha.size']),
  need('./data/window_presets.json'),
  need('./data/door_presets.json'),
  need('./data/room_finishes.json'),
  need('./data/furniture_presets.json'),
  need('./data/lighting_presets.json', ['fixtures', 'tariff']),
  need('./data/shading_presets.json'),
  need('./data/balance/light_thresholds.json', ['plants.monstera_deliciosa.min']),
  need('./data/balance/weather.json', ['weather.clear.p', 'season_factor'])
]);

const houseRooms = houseRoomsRaw;
const winPresets   = presetsOf('window_presets',    inject('window', winRaw));
const doorPresets  = presetsOf('door_presets',      inject('door', doorRaw));
const furnPresets  = presetsOf('furniture_presets', inject('furniture', furnRaw));
const shading      = presetsOf('shading_presets',   inject('shading', shadePresets));
const finishesOk   = inject('finishes', finishes);
if (empty(finishesOk) || empty(finishesOk.wall) || empty(finishesOk.floor) || empty(finishesOk.ceil))
  fail('room_finishes.json 에 wall/floor/ceil 표가 비었습니다');
if (empty(lightPresets.fixtures) || empty(lightPresets.spectra))
  fail('lighting_presets.json 에 fixtures/spectra 가 비었습니다');

/* ★ 손으로 적은 목록 대신 **방 정의가 참조하는 ID 를 전부 순회**한다 (2026-08-02 정정).
   목록을 손으로 관리하면 방 데이터가 바뀔 때마다 낡는다 — 가구가 하나 추가되면 검증만 조용히 비껴간다.
   여기서는 banjiha 가 실제로 가리키는 모든 id 를 모아 해당 표에 있는지 본다. 하나라도 없으면 SHOT FAIL. */
function refsOf(roomDef) {
  const refs = [];
  /* 표가 객체({id:값})든 배열([{id,…}])이든 같은 방식으로 찾는다 — room_finishes 는 배열이다 */
  const hasId = (table, id) => Array.isArray(table)
    ? table.some(x => x && x.id === id)
    : !!(table && table[id] != null);
  const add = (kind, table, id, where) => { if (id != null) refs.push({ kind, table, id, where, hasId }); };
  add('마감(벽)',   finishesOk.wall,  roomDef.wall,  'wall');
  add('마감(바닥)', finishesOk.floor, roomDef.floor, 'floor');
  add('마감(천장)', finishesOk.ceil,  roomDef.ceil,  'ceil');
  (roomDef.windows || []).forEach((w, i) => {
    add('창틀', winPresets, w.preset, `windows[${i}]`);
    if (w.shade && w.shade !== 'none') add('차광', shading, w.shade, `windows[${i}].shade`);
  });
  (roomDef.doors || []).forEach((d, i) => add('문', doorPresets, d.preset, `doors[${i}]`));
  (roomDef.sills || []).forEach((s, i) => {
    if (s.preset) add('창턱', furnPresets, s.preset, `sills[${i}]`);
  });
  (roomDef.furniture || []).forEach((f, i) => {
    /* 가구 목록에는 조명 기구도 섞여 있다 — 둘 중 어느 표에든 있으면 통과 */
    const inFurn = furnPresets[f.preset] != null, inFx = (lightPresets.fixtures || {})[f.preset] != null;
    if (!inFurn && !inFx)
      refs.push({ kind: '가구/조명', table: null, id: f.preset, where: `furniture[${i}]`, hasId: () => false });
    if (f.spectrum) add('스펙트럼', lightPresets.spectra, f.spectrum, `furniture[${i}].spectrum`);
    if (f.schedule) add('점등 스케줄', lightPresets.schedules, f.schedule, `furniture[${i}].schedule`);
  });
  if (roomDef.ceilingShade && roomDef.ceilingShade !== 'none')
    add('차광(천창)', shading, roomDef.ceilingShade, 'ceilingShade');
  return refs;
}

const missingRefs = refsOf(houseRooms.rooms.banjiha)
  .filter(r => !r.hasId(r.table, r.id))
  .map(r => `${r.kind} "${r.id}" (${r.where})`);
if (missingRefs.length)
  fail(`banjiha 방 정의가 가리키는 참조 ${missingRefs.length}건을 못 찾았습니다 — ${missingRefs.join(' / ')}`);

const io = {
  light: createLightEngine({ houseRooms, winPresets, doorPresets, furnPresets,
                             lightPresets, shadePresets: shading, finishes: finishesOk,
                             lightTh, weatherBalance }),
  growth: createGrowthAdapter(document.getElementById('growth'))
};

  io.light.build('banjiha');
  if (!io.light.room.slots.some(s => s.slotId === SLOT)) fail(`슬롯 ${SLOT} 이 방에 없습니다`);
  await io.growth.ready();                       // 여섯 함수가 다 있어야 통과

  const S = newState({ room: 'banjiha', mode: 'novice' });   // 계수 1.0 고정
  S.lamps.count = 0;                                         // 식물등 0
  givePlant(S, io, { slotId: SLOT });                        // 도착 143 (setGrowth 1회)

  let turn = null;
  for (let d = 0; d < DAYS; d++) turn = nextDay(S, io).turn;

  /* plant_grow 자체 표시(단계·마디·잎)를 그대로 읽어 온다 — 코어가 다시 세지 않는다 */
  const gdoc = document.getElementById('growth').contentDocument;
  const info = gdoc && gdoc.getElementById('stat');
  const infoTxt = info ? info.textContent.replace(/\s+/g, ' ').trim() : '(plant_grow 표시 없음)';

  const line =
    `novice · 등 0 · ${SLOT} · 다음날 ${DAYS}회\n` +
    `DLI ${turn ? (turn.dli == null ? 'null' : turn.dli.toFixed(2)) : '—'}` +
    ` · 유효 ${io.growth.growthDays()} · 달력 ${io.growth.calendarDay()}` +
    ` · 갈라짐 ${io.growth.canFenestrate(false) ? '○' : '✕'}` +
    ` · 정지 ${JSON.stringify(io.growth.growthBlocked())} · dli7 ${io.growth.dli7()}\n` +
    `plant_grow: ${infoTxt}`;
  stamp.textContent = line;
  document.title = `SHOT days=${DAYS} | ${line.replace(/\n/g, ' | ')}`;
  window.__shotReady = true;
} catch (e) {
  if (!window.__shotFailed) {
    stamp.textContent = 'SHOT FAIL — ' + e.message;
    stamp.style.background = 'rgba(190,40,30,.92)';
    document.title = 'SHOT FAIL | ' + e.message;
  }
  console.error(e);
}
</script>
</body>
</html>

<!doctype html><meta charset="utf-8"><title>계산 ↔ 화면 대조</title>
<body style="background:#111;color:#ddd;font:12px/1.6 monospace;padding:16px">
<pre id="o">재는 중…</pre>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script type="module">
/* ★ 계산(조도 엔진)과 화면(그림자)이 같은 답을 내는지 자동으로 대조한다.

   왜 필요한가 — 이번 라운드 렌더 사고 5건 중 3건이 이 유형이었다.
     천장  계산은 막는다는데 화면은 해가 뚫고 들어옴   (화면 > 계산)
     태양  화면엔 빛 자국이 있는데 계산엔 없음          (화면 > 계산)
     유리  계산은 통과라는데 화면은 불투명 그림자       (계산 > 화면)
   전부 "오류 없이 그럴듯하게" 나타나서 스크린샷을 보고서야 알았다.

   ★ 픽셀을 읽지 않는다.
     그림자맵의 차폐는 결국 castShadow=true 인 메시가 정한다.
     그러면 같은 메시를 대상으로 레이를 쏘면 픽셀 없이 같은 판정을 재현할 수 있다.
     오프스크린 렌더·readPixels 없이 결정적으로 돌아간다(해상도·bias 영향도 없다).

   두 가지를 본다
     A 외피 무결성 — 해가 창이 아닌 곳으로 새어 들어오나  (화면 > 계산)
     B 차폐 일치   — 점→창 광선을 양쪽이 똑같이 막나/통과시키나 (양방향)
*/
import { buildHouse } from './src/render3d/house.js';
import { winFromHouse, isShadowed } from './src/engine/daylight_lux.js';
import { daylightRatio } from './src/engine/daily_light.js';
import { daylight } from './src/engine/daylight.js';

const J=p=>fetch(p).then(r=>r.json());
const [HR,WP,DP,FIN,FP,LP,SH]=await Promise.all([
 './data/house_rooms.json','./data/window_presets.json','./data/door_presets.json',
 './data/room_finishes.json','./data/furniture_presets.json','./data/lighting_presets.json',
 './data/shading_presets.json'].map(J));
const wp=WP.presets||WP, dp=DP.presets||DP, fp=FP.presets||FP;
const NA={banjiha:'반지하',oneroom:'원룸',tworoom:'투룸',classroom:'학원교실',apartment:'아파트',greenhouse:'온실'};

const UP={x:0,y:1,z:0};

/* 계산 쪽에서 무엇이 막았는지 — occluder 를 하나씩 빼 보며 찾는다 */
function whoBlocksCalc(p, wc, occ){
  for(let i=0;i<occ.length;i++){
    if(isShadowed(p, wc, [occ[i]], undefined)) return occ[i].src || '(무표시)';
  }
  return '(복합)';
}
const L=[]; let totalFail=0;

/* 화면 쪽 차폐 — 그림자맵과 같은 기준으로 판정한다.
   castShadow 인 메시만 본다. 밑동 복제본(isStub)은 그림자를 안 던지므로 제외된다. */
function makeRenderOcclusion(room, shells){
  const rc=new THREE.Raycaster();
  const blockers=[];
  room.updateMatrixWorld(true);
  /* 무엇이 막았는지 알려면 꼬리표가 필요하다. 조상까지 훑어 가장 가까운 단서를 쓴다. */
  const tagOf=o=>{
    for(let n=o; n; n=n.parent){
      if(n.userData){
        if(n.userData.type==='sill') return '창턱';
        if(n.userData.isDoor) return '문';
        if(n.userData.uid) return '가구:'+String(n.userData.uid).split('#')[0];
        if(n.userData.type) return '가구:'+n.userData.type;
      }
      if(n.name==='stub') return '밑동';
    }
    /* 셸 단위로 갈라야 무엇이 막았는지 안다 — '벽·창틀' 로 뭉치면 진단이 안 된다 */
    for(const k in shells){
      let n=o; while(n){ if(n===shells[k]) return '셸:'+k; n=n.parent; }
    }
    return '창틀(trim)';
  };
  room.traverse(o=>{ if(o.isMesh && o.castShadow && !o.userData.isStub){ o.userData.tag=tagOf(o); blockers.push(o); } });
  return {
    blockers,
    /** a → b 사이를 화면이 막나 (b 직전까지만 본다) */
    blocked(a, b){
      const d=new THREE.Vector3(b.x-a.x, b.y-a.y, b.z-a.z);
      const len=d.length(); if(len<1e-6) return null;
      d.divideScalar(len);
      rc.set(new THREE.Vector3(a.x,a.y,a.z), d);
      rc.near=0.02; rc.far=len*0.985;      // 창면 자체는 맞히지 않게 살짝 앞에서 끊는다
      const hit=rc.intersectObjects(blockers, false)[0];
      return hit ? (hit.object.userData.tag || '?') : null;   // 무엇이 막았는지까지 돌려준다
    },
    /** a 에서 방향 dir 로 나가는 광선이 아무것도 안 만나고 탈출하나 */
    escapes(a, dir){
      rc.set(new THREE.Vector3(a.x,a.y,a.z), new THREE.Vector3(dir.x,dir.y,dir.z).normalize());
      rc.near=0.02; rc.far=40;
      return rc.intersectObjects(blockers, false).length===0;
    }
  };
}

/* 태양 방향 — scene.js 와 같은 식(방위·고도) */
function sunDir(t){
  const s=daylight(t), el=0.25+s.alt*0.9, ca=Math.cos(el);
  return { x:Math.sin(s.az)*ca, y:Math.sin(el), z:-Math.cos(s.az)*ca };
}
const SUN_T=[25,40,55,70,80];

L.push('# 계산 ↔ 화면 자동 대조');
L.push('');
L.push('그림자맵의 차폐는 `castShadow=true` 인 메시가 정한다 → 같은 메시에 레이를 쏘면');
L.push('픽셀을 읽지 않고 같은 판정을 재현할 수 있다. 오프스크린 렌더가 필요 없다.');
L.push('');

const rows=[];
for(const key in NA){
  const def=HR.rooms[key];
  const b=buildHouse(null, def, wp, dp, FIN, fp, LP, SH);
  const size=b.size;
  const wins=(b.luxWins||[]).map(w=>winFromHouse(w.wall,w.cu,w.cy,w.w,w.h,size,w.tau,w.evScale,w.cz)).filter(Boolean);
  const occ=b.occluders||[];
  const R=makeRenderOcclusion(b.room, b.shells);

  /* 격자 — 1m 간격 3높이. 정밀도보다 '어긋나는 자리가 있나'를 본다. */
  const pts=[];
  for(let x=-size.w/2+0.6; x<size.w/2-0.5; x+=1.0)
    for(let z=-size.d/2+0.6; z<size.d/2-0.5; z+=1.0)
      for(const y of [0.35,0.85,1.35]) pts.push({x,y,z});

  let failA=0, failB=0, skipped=0; const sampleA=[]; const cause={};

  /* ★ 고체 안에서 출발하는 점은 뺀다.
     레이캐스터는 메시 '안'에서 시작하면 앞면을 못 만나 통과로 나오는데,
     계산 쪽 OBB 는 정직하게 막힘으로 답한다 — 검사 결함이지 코드 버그가 아니다.
     (학원 창턱 안, 아파트 칸막이 안의 점들이 여기 걸렸다) */
  /* ★ 도려낸 구역(cutouts)은 '집 밖'이다. 바닥·천장이 없으니 광선이 그냥 탈출하고
     계산도 창빛 0 이라 A 가 전부 걸린다 — 방 안이 아니므로 검사 대상이 아니다. */
  const cuts=(def.cutouts||[]).map(c=>({x0:Math.min(c.x0,c.x1),x1:Math.max(c.x0,c.x1),
                                        z0:Math.min(c.z0,c.z1),z1:Math.max(c.z0,c.z1)}));
  const inCut = p => cuts.some(c=>p.x>c.x0&&p.x<c.x1&&p.z>c.z0&&p.z<c.z1);

  const inside = p => (occ||[]).some(o =>
    p.x>=o.x && p.x<=o.x+o.w && p.z>=o.z && p.z<=o.z+o.d &&
    p.y>=(o.y0||0) && p.y<=(o.y0||0)+o.h);

  for(const p of pts){
    if(inside(p) || inCut(p)){ skipped++; continue; }
    /* ── A. 외피 무결성 ───────────────────────────────
       해 쪽으로 쏜 광선이 아무것도 안 만나고 탈출했는데(=화면엔 볕이 든다)
       계산은 그 지점에 빛이 0이면, 창이 아닌 곳으로 새고 있다는 뜻이다.
       천장이 빛을 안 막던 게 정확히 이 상태였다. */
    const lit = daylightRatio(p, UP, wins, { occluders: occ, glazed: b.glazedPanes }) > 1e-4;
    if(!lit){
      for(const t of SUN_T){
        if(R.escapes(p, sunDir(t))){
          failA++; if(sampleA.length<3) sampleA.push(`(${p.x.toFixed(1)},${p.y},${p.z.toFixed(1)}) t=${t}`);
          break;
        }
      }
    }
    /* ── B. 차폐 일치 ─────────────────────────────────
       점 → 창중심 광선을 양쪽이 똑같이 막나. 어긋나면 어느 쪽이든 실패다.
       유리가 그림자를 던지던 게 '화면만 막음' 이었다. */
    for(const w of wins){
      const wc={x:w.cx,y:w.cy,z:w.cz};
      const cB=isShadowed(p, wc, occ, undefined);
      const cSrc=cB ? whoBlocksCalc(p, wc, occ) : null;
      const rTag=R.blocked(p, wc);
      const rB=!!rTag;
      if(cB!==rB){
        failB++;
        const kind = cB ? ('계산만 막음 ← '+cSrc) : ('화면만 막음 ← '+rTag);
        cause[kind]=(cause[kind]||0)+1;
      }
    }
  }
  totalFail += failA+failB;
  rows.push({ko:NA[key], pts:pts.length, used:pts.length-skipped, skipped, wins:wins.length, blockers:R.blockers.length, failA, failB, sampleA, cause});
}

L.push('## A. 외피 무결성 — 해가 창이 아닌 곳으로 새나 (화면 > 계산)');
L.push('');
L.push('| 방 | 격자점 | 고체 안이라 제외 | 그림자 메시 | ★ 새는 점 | 예 |');
L.push('|---|---|---|---|---|---|');
for(const r of rows)
  L.push(`| ${r.ko} | ${r.used} | ${r.skipped} | ${r.blockers} | ${r.failA?'★ '+r.failA:'0'} | ${r.sampleA.join(' · ')||'—'} |`);

L.push('');
L.push('## B. 차폐 일치 — 점→창 광선을 양쪽이 똑같이 막나 (양방향)');
L.push('');
L.push('| 방 | 대조 수 | ★ 어긋난 수 | 원인별 |');
L.push('|---|---|---|---|');
for(const r of rows){
  const c=Object.entries(r.cause).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k} ${v}`).join(' · ');
  L.push(`| ${r.ko} | ${r.used*r.wins} | ${r.failB?'★ '+r.failB:'0'} | ${c||'—'} |`);
}
L.push('');
L.push('### 원인 합계');
L.push('');
const all={};
for(const r of rows) for(const [k,v] of Object.entries(r.cause)) all[k]=(all[k]||0)+v;
L.push('| 원인 | 건수 |'); L.push('|---|---|');
for(const [k,v] of Object.entries(all).sort((a,b)=>b[1]-a[1])) L.push(`| ${k} | ${v} |`);

/* ★ 기준선 — 지금 남은 어긋남은 '알고 있는 모델 차이'다(아래 문서 참조).
   이 수를 넘으면 새 불일치가 생긴 것이다. 회귀 감시로 쓴다. */
const BASELINE = { 'furniture':120, 'part':40, 'decor':12, 'cutwall':12 };
const bucket = k => k.includes('furniture') ? 'furniture'
               : k.includes('cutwall') ? 'cutwall'
               : k.includes('셸:part') ? 'part'
               : (k.includes('picture')||k.includes('bulletin')) ? 'decor' : 'etc';
const got={};
for(const r of rows) for(const [k,v] of Object.entries(r.cause)) { const b2=bucket(k); got[b2]=(got[b2]||0)+v; }
L.push('');
L.push('### 기준선 대비 — 회귀 감시');
L.push('');
L.push('| 갈래 | 지금 | 기준선 | |');
L.push('|---|---|---|---|');
let over=0;
for(const k of Object.keys(BASELINE)){
  const g=got[k]||0, ok=g<=BASELINE[k]; if(!ok) over++;
  L.push(`| ${k} | ${g} | ${BASELINE[k]} | ${ok?'✅':'★ 초과'} |`);
}
if(got.etc){ over++; L.push(`| **etc (분류 안 됨)** | ${got.etc} | 0 | ★ 새 유형 |`); }
L.push('');
L.push(over ? '★ 기준선 초과 — 새 불일치가 생겼다. 원인별 표를 보라'
            : '✅ 기준선 안 — 알고 있는 모델 차이뿐이다 (`docs/engine/render_light_model.md` §5)');
L.push('');
L.push(`(A 외피 무결성: ${rows.reduce((a,r)=>a+r.failA,0)}건 — 0이어야 한다)`);
L.push('');
L.push('> B 의 "계산=통과 / 화면=막힘" 은 화면에만 있는 차폐다(유리가 그림자를 던지던 경우).');
L.push('> "계산=막힘 / 화면=통과" 는 계산에만 있는 차폐다(occluder 는 있는데 메시가 없거나 castShadow 가 꺼진 경우).');
document.getElementById('o').textContent=L.join('\n');
document.title='DONE';
</script>

<!doctype html><meta charset="utf-8"><body style="background:#111;color:#ddd;font:12px monospace"><pre id=o>…</pre>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script type="module">
/* 집꾸미기 배치 판정(canPlace)이 실제로 맞는지 — decorate를 그대로 띄워 확인한다 */
import { buildHouse } from './src/render3d/house.js';
import { createDecorator } from './src/render3d/decorate.js';

const O = document.getElementById('o'), L = [], NL = String.fromCharCode(10);
const say = m => { L.push(m); O.textContent = L.join(NL); };
window.onerror = (m,f,l) => say('ERR ' + m + ' @' + l);

const J = p => fetch(p + '?v=' + Date.now()).then(r => r.json());
const [HR,WP,DP,FIN,FPf,LP,SH] = await Promise.all([
  './data/house_rooms.json','./data/window_presets.json','./data/door_presets.json',
  './data/room_finishes.json','./data/furniture_presets.json','./data/lighting_presets.json',
  './data/shading_presets.json'].map(J));
const FP = FPf.presets || FPf;

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(40, 2, 0.1, 100);
cam.position.set(-10,10,10); cam.lookAt(0,0,0);
const renderer = { domElement: document.createElement('canvas') };

const def = HR.rooms.apartment;
const built = buildHouse(null, def, WP.presets||WP, DP.presets||DP, FIN, FP, LP, SH);
scene.add(built.room);

const deco = createDecorator({ cam, renderer, scene }, {
  getRoomDef: () => def,
  getFurnitureGroup: () => built.furniture,
  getSize: () => built.size,
  rebuild: async () => {},
  onChange: () => {},
  getWorld: () => ({ colliders: built.colliders, doorways: built.doorways }),
  getPreset: id => FP[id] || {}
});

/* decorate 내부 canPlace를 직접 못 부르므로, 같은 규칙을 여기서 재현하지 않고
   '실제로 옮겨보고 결과가 유지되는지'로 확인한다. */
say('아파트 가구 배치 판정');
say('  가구 ' + def.furniture.length + '점 · 충돌체 ' + built.colliders.length +
    '(벽 ' + built.colliders.filter(c=>c.kind==='wall').length +
    ' / 가구 ' + built.colliders.filter(c=>c.kind==='furn').length + ')' +
    ' · 여닫이 ' + built.doorways.length);
say('');

/* 현재 배치가 전부 '놓을 수 있는' 상태인지 — 자기 자리에서 canPlace가 참이어야 정상 */
deco.setEnabled(true);
let okN = 0, ngN = 0, ngList = [];
for (let i = 0; i < def.furniture.length; i++) {
  const f = def.furniture[i];
  const r = deco.testPlace(i, f.x || 0, f.z || 0);
  if (r) okN++; else { ngN++; ngList.push(f.preset + '(' + (f.x||0) + ',' + (f.z||0) + ')'); }
}
say('제자리 판정: 가능 ' + okN + ' / 불가 ' + ngN + (ngN ? '  ★' : '  OK'));
if (ngList.length) say('   ' + ngList.slice(0,8).join(', '));
say('');

/* 대표 지점 몇 곳을 찍어본다 (소파 index를 찾아서) */
const si = def.furniture.findIndex(f => f.preset === 'sofa_blush');
if (si >= 0) {
  const T = [
    ['거실 좌탁 위(겹침)', 0.0, -1.6, false],
    ['거실 빈 바닥',      1.3, -1.6, true],
    ['벽 속(안방 벽)', -2.30, -1.5, false],
    ['방 밖',           7.0, 0.0,  false],
    ['베란다 통로 위', -1.90, -3.28, false],
    ['다른 가구 위(TV)', -0.10, -3.05, false],
    ['부엌 빈 곳',      -0.5,  3.4,  true],
  ];
  say('소파를 옮겨본다면');
  for (const t of T) {
    const r = deco.testPlace(si, t[1], t[2]);
    say('  ' + t[0].padEnd(18) + ' → ' + (r ? '놓을 수 있음' : '막힘') +
        '  기대=' + (t[3] ? '가능' : '막힘') + '  ' + (r === t[3] ? 'OK' : '★FAIL'));
  }
}
document.title = 'DONE';
</script>

<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>색시프트 검증 — 머리/피부/옷 색 바꾸기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
 *{box-sizing:border-box}
 body{margin:0;font-family:'Pretendard','Malgun Gothic',sans-serif;background:#f3f6f3;color:#2b3830;overflow:hidden}
 .wrap{display:flex;height:100vh}
 /* min-width:0 + width/height 100% 가 없으면 캔버스가 자기 attribute 크기를 키우는
    되먹임이 생겨 패널을 화면 밖으로 밀어낸다 */
 .cvbox{flex:1;min-width:0;position:relative}
 #cv{display:block;width:100%;height:100%;background:#eef3ef}
 .panel{width:280px;flex:none;background:#fff;border-left:1px solid #dde5de;padding:16px;overflow:auto;font-size:13px}
 h1{font-size:14px;margin:0 0 3px}
 .sub{font-size:11.5px;color:#6d7d72;line-height:1.6;margin-bottom:14px}
 h2{font-size:11px;margin:16px 0 7px;color:#6d7d72;letter-spacing:.4px;text-transform:uppercase}
 h2:first-of-type{margin-top:0}
 select,button{width:100%;padding:7px 9px;border:1px solid #cfdbd2;border-radius:7px;background:#fff;font:inherit;font-size:12.5px}
 button{cursor:pointer;margin-top:6px}button:hover{background:#f2f7f3}
 .part{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid #f0f4f1}
 .part label{flex:1;font-size:12.5px}
 .part input[type=color]{width:38px;height:26px;padding:0;border:1px solid #cfdbd2;border-radius:5px;background:none;cursor:pointer}
 .part input[type=checkbox]{cursor:pointer}
 .views{display:grid;grid-template-columns:1fr 1fr;gap:5px}
 .views button{margin:0;padding:6px}
 .views button.on{background:#3a5c47;color:#fff;border-color:#3a5c47}
 .chk{margin-top:12px;font-size:11.5px;line-height:1.7;color:#4a5a50;background:#fbf7ee;
      border:1px solid #ecdfc8;border-radius:7px;padding:9px 11px}
 .chk b{display:block;color:#8a6320;margin-bottom:3px;font-size:11px}
 .chk ul{margin:0;padding-left:15px}
 .presets{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
 .sw{width:26px;height:26px;border-radius:6px;border:1px solid rgba(0,0,0,.18);cursor:pointer}
 .sw:hover{outline:2px solid #4a7a5c;outline-offset:1px}
 .note{margin-top:14px;font-size:11px;line-height:1.65;color:#6d7d72;background:#f6faf7;padding:9px 10px;border-radius:7px}
 .bad{color:#b4483a}
</style></head><body>
<div class="wrap">
  <div class="cvbox"><canvas id="cv"></canvas></div>
  <div class="panel">
    <h1>색시프트 검증</h1>
    <div class="sub">머티리얼이 하나뿐이라 부위별 머티리얼 교체는 불가능합니다.
      대신 같은 UV의 <b>마스크 텍스처</b>로 텍셀을 골라 색을 갈아끼웁니다.
      명도는 원본을 유지해 음영이 살아 있습니다.</div>

    <h2>캐릭터</h2>
    <select id="char"></select>

    <h2>시점</h2>
    <div class="views">
      <button data-v="face">얼굴</button><button data-v="upper">상반신</button>
      <button data-v="hand">손목</button><button data-v="full">전신</button>
    </div>

    <h2>머리색 프리셋</h2>
    <div class="presets" id="hairPre"></div>

    <h2>부위별 색</h2>
    <div id="parts"></div>

    <div id="hit" style="font-size:11px;color:#4a7a5c;margin-top:7px;line-height:1.6"></div>

    <h2>유지 (색 안 바뀜)</h2>
    <div id="locked"></div>

    <button id="reset">원본 색으로</button>
    <div class="chk"><b>마스크 검수 포인트</b>
      <ul>
        <li>머리 ↔ 눈썹 경계</li>
        <li>눈 홍채 ↔ 흰자</li>
        <li>목 · 손목 (피부 ↔ 옷)</li>
        <li>머리카락이 옷에 닿는 부분</li>
      </ul>
      머리색을 형광색으로 바꾸면 잘못 칠해진 곳이 바로 드러납니다.
    </div>
    <div class="note" id="note"></div>
  </div>
</div>
<script>
const CB='?t='+Date.now();
const CHARS=[['char_namja_jachwi','자취남'],['char_namja_gajang','남가장'],
 ['char_namja_jubu','남주부'],['char_namja_researcher','남연구원'],
 ['char_jachwi_f','자취녀'],['char_yeoja_gajang','여가장'],
 ['char_yeoja_jubu','여주부'],['char_yeoja_researcher','여연구원']];

/* 마스크는 R 채널 인덱스 맵 (tools/make_part_mask.py 와 일치)
   32 머리+눈썹 / 64 눈(보호) / 96 상징물(보호) / 128 피부 / 160 상의 / 192 하의 / 224 신발
   알파를 데이터로 쓰면 캔버스 프리멀티플라이드 알파 때문에 A=0 텍셀의 RGB가
   0 으로 뭉개져 A 채널 부위만 살아남는다. 그래서 A 는 항상 255.

   보호 부위는 색을 바꾸지 않는다.
     눈    - 홍채·흰자·하이라이트가 텍셀 몇 개 단위라 경계가 미세하다.
             눈 색은 표정 작업(얼굴 텍스처 교체)에서 통째로 다루는 게 맞다.
     상징물 - 연구가운 로고·명찰·앞치마 무늬. 직업 정체성이라 색이 바뀌면
             캐릭터 구분이 깨진다.
   눈썹은 머리카락에 포함했다. 머리색 바꾸면 같이 바뀌는 게 자연스럽다. */
const PARTS=[
  {key:'hair', name:'머리 + 눈썹', code:32,  on:true,  color:'#d8b46c'},
  {key:'skin', name:'피부',        code:128, on:false, color:'#f0c090'},
  {key:'top',  name:'상의',        code:160, on:false, color:'#e8e8d8'},
  {key:'bot',  name:'하의',        code:192, on:false, color:'#486090'},
  {key:'shoe', name:'신발',        code:224, on:false, color:'#d8d0c4'},
];
const LOCKED=[
  {name:'눈 (홍채·흰자)', code:64,  why:'텍셀 단위가 미세함 · 표정 작업에서 처리'},
  {name:'직업 상징물',    code:96,  why:'가운 로고·명찰·앞치마 무늬 · 직업 정체성'},
];
const HAIR_PRESETS=['#3a2a20','#6b4226','#a9743c','#d8b46c','#e8dcc0',
                    '#8a3b3b','#6a4a7a','#2f4f4f','#9aa0a8','#1c1a1e'];

const cv=document.getElementById('cv');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xeef3ef);
const camera=new THREE.PerspectiveCamera(30,1,0.01,60);
const controls=new THREE.OrbitControls(camera,cv);controls.enableDamping=true;
scene.add(new THREE.AmbientLight(0xffffff,0.75));
scene.add(new THREE.HemisphereLight(0xffffff,0xdfe6df,0.25));
const dl=new THREE.DirectionalLight(0xffffff,0.5);dl.position.set(2,4,3);scene.add(dl);
scene.add(new THREE.GridHelper(4,8,0xbccfc2,0xdae6dd));

const loader=new THREE.GLTFLoader();
let model=null, baseImg=null, maskImg=null, mat=null, texCanvas=null;
let curH=1.70, curView='upper';

/* 발바닥 y=0 기준. 캐릭터는 카메라 쪽(+Z)을 보도록 180도 돌려놨다. */
function setView(v){
  curView=v; const H=curH;
  const VIEWS={
    face : [[H*0.05,H*0.90,H*0.30],[0,H*0.88,0]],
    upper: [[H*0.22,H*0.82,H*0.70],[0,H*0.72,0]],
    hand : [[H*0.36,H*0.50,H*0.42],[H*0.28,H*0.48,0]],
    full : [[H*0.45,H*0.60,H*1.45],[0,H*0.45,0]],
  };
  const P=VIEWS[v]||VIEWS.full;
  camera.position.set(...P[0]); controls.target.set(...P[1]); controls.update();
  document.querySelectorAll('.views button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
}

function loadImage(src){return new Promise((res,rej)=>{const i=new Image();
  i.onload=()=>res(i);i.onerror=rej;i.src=src;});}

/** 마스크로 부위를 골라 색을 갈아끼운다.
    명도(원본 밝기 / 그 부위 평균 밝기)를 곱해 음영·주름을 보존한다. */
function recolor(){
  if(!baseImg||!maskImg) return;
  const w=baseImg.width,h=baseImg.height;
  const c=texCanvas,x=c.getContext('2d',{willReadFrequently:true});
  x.drawImage(baseImg,0,0,w,h);
  const img=x.getImageData(0,0,w,h), d=img.data;

  const mc=document.createElement('canvas');mc.width=w;mc.height=h;
  const mx=mc.getContext('2d',{willReadFrequently:true});
  mx.imageSmoothingEnabled=false;
  mx.drawImage(maskImg,0,0,w,h);            // 마스크 해상도가 달라도 맞춰 늘린다
  const md=mx.getImageData(0,0,w,h).data;

  const hits={};
  for(const p of PARTS){
    if(!p.on) continue;
    const tgt=hexToRgb(p.color);
    // 1차: 해당 부위 평균 밝기
    let sum=0,n=0;
    for(let i=0;i<d.length;i+=4){
      if(Math.abs(md[i]-p.code)<=12){ sum+=(d[i]+d[i+1]+d[i+2])/3; n++; }
    }
    hits[p.key]=n;
    if(!n) continue;
    const avg=Math.max(sum/n,1);
    // 2차: 밝기비를 목표색에 곱한다 (음영·주름 보존)
    for(let i=0;i<d.length;i+=4){
      if(Math.abs(md[i]-p.code)>12) continue;
      const lum=(d[i]+d[i+1]+d[i+2])/3, k=lum/avg;
      d[i]  =Math.min(255,tgt[0]*k);
      d[i+1]=Math.min(255,tgt[1]*k);
      d[i+2]=Math.min(255,tgt[2]*k);
    }
  }
  x.putImageData(img,0,0);
  if(mat&&mat.map){ mat.map.needsUpdate=true; }
  const on=PARTS.filter(p=>p.on);
  if(on.length){
    const bad=on.filter(p=>!hits[p.key]);
    document.getElementById('hit').innerHTML = bad.length
      ? `<span class="bad">마스크에 없는 부위: ${bad.map(p=>p.name).join(', ')}</span>`
      : on.map(p=>`${p.name} ${(hits[p.key]/(d.length/4)*100).toFixed(1)}%`).join(' · ');
  } else document.getElementById('hit').textContent='';
}
function hexToRgb(s){const v=parseInt(s.replace('#',''),16);
  return [(v>>16)&255,(v>>8)&255,v&255];}

async function load(){
  const key=document.getElementById('char').value;
  const note=document.getElementById('note');
  if(model){scene.remove(model);model=null;}
  note.textContent='불러오는 중…';
  const g=await new Promise((res,rej)=>loader.load(`3d/${key}_base.glb`+CB,res,undefined,rej));
  model=g.scene;scene.add(model);
  model.rotation.y=Math.PI;                       // 기본 방향이 뒷모습이라 정면으로 돌린다
  model.traverse(o=>{if(o.isMesh)o.frustumCulled=false;});

  let src=null;
  model.traverse(o=>{ if(o.isMesh&&o.material&&o.material.map&&!src){ mat=o.material; src=o.material.map.image; }});
  if(!src){note.innerHTML='<span class="bad">텍스처를 찾지 못했습니다</span>';return;}
  baseImg=src;
  texCanvas=document.createElement('canvas');
  texCanvas.width=src.width;texCanvas.height=src.height;

  try{ maskImg=await loadImage(`masks/${key}_mask.png`+CB); }
  catch(e){ maskImg=null; note.innerHTML='<span class="bad">마스크 없음 — tools/make_part_mask.py 를 먼저 돌리세요</span>'; return; }

  const t=new THREE.CanvasTexture(texCanvas);
  t.flipY=mat.map.flipY; t.encoding=THREE.sRGBEncoding; t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;
  mat.map=t; mat.needsUpdate=true;
  recolor();

  curH=/(jachwi_f|yeoja)/.test(key)?1.50:1.70;
  setView(curView);
  note.innerHTML=`텍스처 ${src.width}×${src.height} · 마스크 ${maskImg.width}×${maskImg.height}<br>`+
    `색 교체는 로딩 시 한 번만 계산합니다(프레임마다 아님). 게임에선 캐릭터 생성·변경 시점에 실행하면 됩니다.`;
}

// ── 패널 ──
const charSel=document.getElementById('char');
CHARS.forEach(([k,n])=>charSel.add(new Option(n,k)));
charSel.onchange=load;

const partsEl=document.getElementById('parts');
PARTS.forEach(p=>{
  const row=document.createElement('div');row.className='part';
  row.innerHTML=`<input type="checkbox" ${p.on?'checked':''}>
    <label>${p.name}</label><input type="color" value="${p.color}">`;
  const [chk,,col]=row.children;
  chk.onchange=e=>{p.on=e.target.checked;recolor();};
  col.oninput=e=>{p.color=e.target.value;if(p.on)recolor();};
  p._col=col;
  partsEl.appendChild(row);
});
const pre=document.getElementById('hairPre');
HAIR_PRESETS.forEach(c=>{
  const s=document.createElement('div');s.className='sw';s.style.background=c;
  s.title=c; s.onclick=()=>{const p=PARTS[0];p.color=c;p.on=true;p._col.value=c;
    partsEl.querySelector('input[type=checkbox]').checked=true;recolor();};
  pre.appendChild(s);
});
document.getElementById('locked').innerHTML=LOCKED.map(l=>
  `<div style="padding:5px 0;border-bottom:1px solid #f0f4f1">
     <div style="font-size:12.5px;font-weight:600">🔒 ${l.name}</div>
     <div style="font-size:11px;color:#6d7d72;line-height:1.5">${l.why}</div></div>`).join('');
document.querySelectorAll('.views button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
document.getElementById('reset').onclick=()=>{PARTS.forEach(p=>p.on=false);
  partsEl.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=false);recolor();};

load();
function resize(){const w=cv.clientWidth,h=cv.clientHeight;
  if(cv.width!==w||cv.height!==h){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}}
(function loop(){requestAnimationFrame(loop);resize();controls.update();renderer.render(scene,camera);})();
</script></body></html>

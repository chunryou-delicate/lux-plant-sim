<!doctype html><meta charset="utf-8"><title>반지하 후보</title><body style="background:#111;color:#ddd;font:12px/1.6 monospace;padding:12px"><pre id="o">…</pre>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script type="module">
import { buildHouse } from './src/render3d/house.js';
import { winFromHouse } from './src/engine/daylight_lux.js';
import { daylightRatio, daylightDLI } from './src/engine/daily_light.js';
import { weatherE } from './src/engine/weather.js';
const J=p=>fetch(p).then(r=>r.json());
const [HR,WP,DP,FIN,FP,LP,SH]=await Promise.all(['./data/house_rooms.json','./data/window_presets.json','./data/door_presets.json','./data/room_finishes.json','./data/furniture_presets.json','./data/lighting_presets.json','./data/shading_presets.json'].map(J));
const b=buildHouse(null,HR.rooms.banjiha,WP.presets||WP,DP.presets||DP,FIN,FP.presets||FP,LP,SH);
const wins=(b.luxWins||[]).map(w=>winFromHouse(w.wall,w.cu,w.cy,w.w,w.h,b.size,w.tau,w.evScale,w.cz)).filter(Boolean);
const occ=b.occluders||[];
const E=weatherE('summer');
const D=(p)=>daylightDLI(daylightRatio(p,{x:0,y:1,z:0},wins,{occluders:occ,glazed:b.glazedPanes}),{weather:'clear',season:'summer'});
const L=[];
L.push('# 반지하 — 벽걸이 선반 후보 자리 (창: back 벽 cu 0, w 2.2, cy 1.77 → y 1.495~2.045, x -1.1~1.1)');
L.push(`방 ${b.size.w}×${b.size.d}×${b.size.h} · 벽 안쪽면 z=${(-b.size.d/2+0.1).toFixed(2)}`);
L.push('');
L.push('## 높이 × 벽에서의 거리 (x=0.55, 창 아래 중앙 우측)');
L.push('| 상판 높이 | z=-1.79(벽밀착) | z=-1.65 | z=-1.50 | z=-1.30 |');
L.push('|---|---|---|---|---|');
for(const y of [1.40,1.50,1.55,1.60,1.65,1.70,1.80,1.90]){
  const c=[-1.79,-1.65,-1.50,-1.30].map(z=>D({x:0.55,y,z}).toFixed(2));
  L.push(`| ${y.toFixed(2)}m | ${c.join(' | ')} |`);
}
L.push('');
L.push('## ★ 벽 안쪽면(z=-1.90) 부근 — space 격자가 어디를 쟀나 (x=0)');
L.push('| z | 1.55m | 1.60m | 1.65m | 벽 안인가 |');
L.push('|---|---|---|---|---|');
for(const z of [-1.95,-1.92,-1.90,-1.88,-1.85,-1.79,-1.70]){
  const c=[1.55,1.60,1.65].map(y=>D({x:0,y,z}).toFixed(2));
  L.push(`| ${z} | ${c.join(' | ')} | ${z<-1.90?'★ 벽 안':''} |`);
}
L.push('');
L.push('## x 위치별 (상판 1.60m, z=-1.79)');
L.push('| x | DLI |'); L.push('|---|---|');
for(const x of [-1.0,-0.7,-0.35,0,0.35,0.55,0.7,1.0,1.3]) L.push(`| ${x} | ${D({x,y:1.60,z:-1.79}).toFixed(2)} |`);
L.push('');
L.push(`※ avg7 = peak × ${E.toFixed(3)} (real 모드). novice 는 매일 같은 값이라 dli7 → peak 로 수렴`);
document.getElementById('o').textContent=L.join('\n'); document.title='DONE';
</script>

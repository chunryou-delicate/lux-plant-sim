<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>볕 · 모듈 식물 생장 프로토타입 (몬스테라)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap');
  /* UI 본문 = 고딕(가독성). 손글씨체(Gaegu)는 12px 흰글씨에서 획이 뭉개져 교체함.
     설치돼 있으면 Pretendard를 먼저 쓰고, 없으면 Noto Sans KR → 맑은 고딕 순. */
  :root{ --ui:'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕',system-ui,sans-serif; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:var(--ui);background:#14101c;
    user-select:none;color:#eceae3}
  #wrap{position:relative;width:100vw;height:100vh}
  #cv{position:absolute;inset:0;display:block}
  .top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;
    padding:14px 18px;pointer-events:none}
  .brand{font-family:'Jua';font-size:20px;color:#fff;letter-spacing:1px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
  .brand b{color:#7ad06a}
  .tag{font-family:var(--ui);font-weight:500;font-size:12px;color:rgba(255,255,255,.62)}
  .views{position:absolute;left:16px;bottom:16px;z-index:6;display:flex;flex-wrap:wrap;gap:6px;max-width:200px}
  .cbtn{background:rgba(255,255,255,.92);border:none;border-radius:12px;padding:8px 13px;font-family:'Jua';
    font-size:13px;color:#3d3548;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3)}
  .cbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
  .cbtn.on{background:#7ad06a}
  .panel{position:absolute;top:12px;right:12px;z-index:6;width:min(790px,76vw);
    background:rgba(20,16,28,.8);backdrop-filter:blur(10px);border-radius:16px;padding:12px 14px;
    border:1px solid rgba(255,255,255,.1)}
  .phead{display:flex;justify-content:space-between;align-items:center;font-family:'Jua';font-size:15px;color:#7ad06a;margin-bottom:8px}
  .phead button{background:none;border:none;color:#7ad06a;font-family:'Jua';font-size:15px;cursor:pointer}
  .cols{display:flex;gap:12px;align-items:flex-start}
  .col{flex:1 1 0;min-width:0;max-height:calc(100vh - 150px);overflow-y:auto;padding-right:4px}
  .col::-webkit-scrollbar{width:6px} .col::-webkit-scrollbar-thumb{background:rgba(122,208,106,.4);border-radius:4px}
  .colhead{position:sticky;top:0;background:rgba(24,19,32,.97);font-family:var(--ui);font-weight:700;font-size:12.5px;color:#8fe07c;
    padding:3px 0 7px;margin-bottom:4px;z-index:2;border-bottom:1px solid rgba(255,255,255,.12)}
  .sgrp{margin:6px 0;border-top:1px solid rgba(255,255,255,.10)}
  .sgrp>summary{cursor:pointer;list-style:none;font-family:var(--ui);font-weight:700;font-size:12px;color:#f0b44a;
    letter-spacing:-.01em;
    padding:7px 0 5px;user-select:none}
  .sgrp>summary::-webkit-details-marker{display:none}
  .sgrp>summary::before{content:'▸ ';color:rgba(255,255,255,.45)}
  .sgrp[open]>summary::before{content:'▾ '}
  .psec{font-family:var(--ui);font-weight:700;font-size:11.5px;color:#f0b44a;margin:10px 0 6px;padding-bottom:3px;border-bottom:1px solid rgba(255,255,255,.1)}
  .prow{display:flex;gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12)}
  .prow .cbtn{flex:1;font-size:12px;padding:8px}
  .note2{font-family:var(--ui);font-weight:500;font-size:11.5px;color:rgba(255,255,255,.62);padding:14px 4px;line-height:1.55}
  #assetSel{width:100%;margin-bottom:8px;background:#241d30;color:#eceae3;border:1px solid rgba(255,255,255,.18);border-radius:9px;padding:8px 9px;font-family:var(--ui);font-weight:500;font-size:13px}
  #assetSel option{background:#241d30;color:#eceae3}
  #assetPrev{width:100%;height:auto;aspect-ratio:248/150;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.12),rgba(255,255,255,.03));border-radius:10px;margin-bottom:8px;display:block}
  .panel h3{font-family:'Jua';font-size:14px;color:#7ad06a;margin-bottom:10px}
  .field{margin-bottom:10px}
  .field label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:var(--ui);font-weight:500;font-size:12.5px;
    letter-spacing:-.01em;
    color:rgba(255,255,255,.88);margin-bottom:5px}
  .field label b{color:#8fe07c;font-family:var(--ui);font-weight:700;font-size:12.5px;
    font-variant-numeric:tabular-nums;flex:none}
  input[type=range]{-webkit-appearance:none;width:100%;height:7px;border-radius:6px;outline:none;
    background:linear-gradient(90deg,#2a3a2a,#7ad06a);cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
    background:radial-gradient(circle at 35% 32%,#e8ffe0,#7ad06a);
    box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 0 3px rgba(255,255,255,.8)}
  #stat{font-family:var(--ui);font-weight:500;font-size:12px;line-height:1.75;color:#d6ecd7;
    padding-top:8px;border-top:1px solid rgba(255,255,255,.12)}
  #stat .k{color:rgba(255,255,255,.5);font-weight:400}

    /* 설명이 있는 제목: 점선 밑줄 + 물음표 커서 */
    .field label.hashelp{ cursor:help; }
    .field label.hashelp:hover{ color:#d8f5cf; }
    #helpTip{ position:fixed; display:none; z-index:200; max-width:320px;
      padding:10px 13px; border-radius:9px; background:rgba(18,15,28,.97); color:#e8f3e2;
      border:1px solid #4c7a46; font-size:12.5px; line-height:1.6; letter-spacing:.1px;
      white-space:pre-line; pointer-events:none; box-shadow:0 6px 22px rgba(0,0,0,.55); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div class="top">
    <span class="brand">볕<b>.</b></span>
    <span class="tag">모듈 식물 생장 · 몬스테라 프로토 (임시 도형)</span>
  </div>

  <div class="panel" id="panel">
    <div class="phead"><span>🌱 몬스테라 튜닝</span><button id="panelToggle">▾</button></div>
    <div id="panelBody">
      <div class="cols">
        <div class="col">
          <div class="colhead">▶ 플레이 · 성장 탐색</div>
          <div class="field"><label>성장도(일 / 최대 1095=3년) <b id="growthV">120</b></label><input type="range" id="growth" min="0" max="1095" value="120"></div>
          <div class="prow" id="playRow" style="margin-top:2px;padding-top:0;border-top:none">
            <button class="cbtn" id="btnFirst">↺ 처음</button>
            <button class="cbtn" id="btnPlay">▶ 재생</button>
            <button class="cbtn" id="btnLast">⏭ 끝</button>
          </div>
          <div class="field"><label>☀️ 빛 방위 <b id="lightV">90°</b></label><input type="range" id="light" min="0" max="360" value="90"></div>
          <div class="field"><label>굴광성(빛 쫓기) <b id="photoV">50%</b></label><input type="range" id="photo" min="0" max="100" value="50"></div>
          <button class="cbtn" id="btnSeed" style="width:100%">🎲 랜덤 시드</button>
          <div id="stat" style="margin-top:8px"><span class="k">슬라이더를 움직여 자라는 걸 보세요.</span></div>
          <div class="psec">🌿 줄기 모양 미세조정</div>
          <div id="shapeSliders"></div>
        </div>
        <div class="col">
          <div class="colhead">🎯 에셋 개별 조정 <span style="color:rgba(255,255,255,.4);font-size:10px">(name_ko)</span></div>
          <select id="assetSel"></select>
          <canvas id="assetPrev" width="248" height="150"></canvas>
          <div id="assetUse" class="note2" style="padding:0 0 6px;font-size:11px"></div>
          <div id="assetSliders"></div>
          <button class="cbtn" id="btnResetAsset" style="width:100%;margin-top:8px">↺ 이 에셋만 리셋</button>
        </div>
      </div>
      <div class="prow">
        <button class="cbtn" id="btnPersist">⭐ 영구저장</button>
        <button class="cbtn" id="btnLoad">📂 불러오기</button>
        <button class="cbtn" id="btnCopy">📋 복사/내보내기</button>
        <button class="cbtn" id="btnReset">↺ 리셋</button>
      </div>
    </div>
  </div>

  <div class="views">
    <button class="cbtn" data-dir="front">앞</button>
    <button class="cbtn" data-dir="left">좌</button>
    <button class="cbtn" data-dir="right">우</button>
    <button class="cbtn" data-dir="top">위</button>
    <button class="cbtn" id="btnAuto">자동회전</button>
    <button class="cbtn on" id="btnGrid">바닥격자</button>
  </div>
</div>

<script>
let scene, cam, renderer, grid, ground, sunMarker;
let W, H, DPR=Math.min(2, window.devicePixelRatio||1);
const cv=document.getElementById('cv');
let orbit={ az:Math.PI*0.22, el:0.42, r:14, zoom:1, tx:0, ty:1.1, tz:0 };
let autoRotate=false;
let FRUSTUM=2.2;

// ===== 시드 난수(개체성): 같은 시드→같은 그루. mulberry32 =====
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return((t^t>>>14)>>>0)/4294967296; }; }
let SEED=94863, rng=mulberry32(SEED);
const GOLDEN=Math.PI*(3-Math.sqrt(5));   // 137.5° 황금각(자연스러운 잎차례)

// ===== 튜닝 파라미터(A: 전체 규칙) — 슬라이더로 실시간 조절 =====
const GMAX=1095;  // 성장도 최대 = 3년(일). 슬라이더·재생·정규화가 모두 이 값을 따름
const DEF={
  spawnStep:40, maxLeaves:12, matSpan:120,                 // 마디 나는 간격(일, 느릴수록 덜 길어짐) · 축당 최대 마디 · 잎 성숙 기간
  seedEnd:20, sproutEnd:45,                                // 씨앗·새싹(줄기_초기+새순) 시기
  budSpan:0.22, furlFrac:0.5, budSize:0.13,                // 새순: 말림(furled)→펴짐(opening) 비율·크기
  stageYoung:0.38, stageMid:0.66,                          // 잎 형태 전환 시점(어린→중간→성인)
  sizeYoung:0.20, sizeMid:0.34, sizeMature:0.46, sizeFull:0.58,  // 각 시점 크기(마디 간격 대비 자연스럽게)
  internode:0.17, stemFlat:1.25,   // 줄기 마디 길이·잎방향 납작
  petGrow:16, rEarly:0.022, rThin:0.028, rMed:0.025, rThick:0.031, matureProb:0.22, doubleBud:0.15,  // 종류별 굵기(몸통 폭 기준)·성숙잎 확률·쌍혹 확률
  growAmt:0.8, growSpan:300,        // ★전체 성장: 최대 +60% 까지, 730일(2년)에 걸쳐. 비율은 그대로 유지
  timeCurve:0.72,   // ★시간 곡선: 실제 일수 → '생장 나이'. 1=등속, <1이면 초반이 빠르고 뒤로 갈수록 느려진다.
                    //   0.72는 "예전 83일치 모습이 30일에 나오게" 맞춘 값. 끝(1095일) 도달점은 그대로.
  varieProb:0.20, midMix:0.5, alboMidPick:0, matAlboPick:0,   // alboMidPick: 0=랜덤, 1~7=그 종류로 고정(위치 세팅용)
  matRare:0.10, matSub:0.30,   // 성숙 무늬: 희귀 10% / 부 30% / 나머지가 주(60%)
  // varieProb = 잎(생장점)마다 독립 판정. 그루 단위가 아니라 '중간에 발현'하는 방식이 맞음(확정).
  //   난이도별로 달라질 예정. 또 가지를 잘라 수경재배로 번식시킬 때, 모주가 무늬면
  //   그 삽수는 훨씬 높은 확률(80% 수준)을 물려받는 구조로 갈 것.
  tipBlendNodes:2, leafEmbed:0.13, leafTilt:0.30, leafClear:0.7, leafTiltVary:0, leafStemClear:3,   // leafTiltVary=0 → 잎 각도 고정(조절값 그대로), >0 이면 겹침 회피가 각도도 흔듦   // 잎자루를 줄기 속으로 박는 깊이 · 잎이 줄기 끝 방향을 따라가는 정도 · 잎이 차지하는 반경(겹침 회피)
  photoLean:0.10, stemStraight:0.22, stemCurve:0.11, stemDroop:0.03, avoidLean:0.85, avoidRange:0.30,   // 빛 쪽으로 기우는 세기(굴광성 슬라이더와 곱해짐) · 축 기본방향으로 돌아오는 힘(작을수록 더 휨)
  stemTrans:40, bumpGrow:20, bumpAt:0.2, bumpAzOff:0, stemOverlap:0.015,   // bumpAzOff=가지가 나는 방위를 혹 돌기 쪽으로 미세 회전
  tipTaper:0.8, nodeBulge:0.16, nodeWidth:0.045, bumpFit:1.02,
  sheathLen:0.22, sheathFit:1.12, sheathBot:1.309, sheathTop:0.575,   // 엽초: 길이(잎 크기 x 이 값) · 감싸는 굵기 · 아래/위 구멍 지름
  stemTex:1.0, texRepeat:3.0,       // 줄기 표면 결: 세기 · 세로 반복 횟수
  petioleLen:1.0, leafElev:1.0, elevDrop:0, spread:0.10, branchSpread:0.55,   // 배치(spread=줄기 흔들림)
  leafLight:0.62, leafDark:0.13, leafSat:0.5, satRange:0.22, hueBase:0.16, hueRange:0.26,   // 색(밝기/진함/채도/개체범위)
  ageDark:0.10, ageSat:0.18,   // 시간(나이) 따라 짙어짐·선명해짐(전역, 줄기·잎 함께)
};
let P=Object.assign({}, DEF);
// 저장본 버전. 생장 로직/기본값이 바뀌면 올림 → 옛 저장값이 새 기본값을 덮어쓰지 않게.
const CFG_VER='2026-07-26-blend2';

// ===== 튜닝 파라미터(B: 에셋별 개별 조정) =====
const ADJ_KEYS=[
  'pot', 'leaf_young', 'leaf_mid1', 'leaf_mid2', 'leaf_mature', 'bud_furled',
  'bud_opening2', 'stem_thick', 'stem_main', 'leaf_young_albo', 'leaf_mid_albo1', 'leaf_mid_albo2',
  'leaf_mid_albo3', 'leaf_mid_albo4', 'leaf_mid_albo5', 'leaf_mid_albo6', 'leaf_mid_albo7', 'leaf_mid_albo8',
  'leaf_mid_albo9', 'leaf_mid_albo10', 'leaf_mid_albo11', 'leaf_mid_albo12', 'leaf_mid_albo13', 'leaf_mid_albo14',
  'leaf_mid_albo15', 'leaf_mid_albo16', 'leaf_mid_albo17', 'leaf_mid_albo18', 'leaf_mid_albo19', 'leaf_mid_albo20',
  'leaf_mid_albo21', 'leaf_mid_albo22', 'leaf_mid_albo23', 'leaf_mid_albo24', 'leaf_mid_albo25', 'leaf_mid_albo26',
  'leaf_mid_albo27', 'leaf_mid_albo28', 'leaf_mid_albo29', 'leaf_mid_albo30', 'leaf_mid_albo31','leaf_mid_albo32','leaf_mid_albo33','leaf_mid_albo34','leaf_mid_albo35','leaf_mid_albo36','leaf_mid_albo37','leaf_mid_albo38','leaf_mid_albo39','leaf_mid_albo40','leaf_mid_albo41','leaf_mid_albo42',
  'leaf_mid_albo32', 'leaf_mid_albo33', 'leaf_mid_albo34', 'leaf_mid_albo35', 'leaf_mid_albo36', 'leaf_mid_albo37', 'leaf_mid_albo38', 'leaf_mid_albo39', 'leaf_mid_albo40', 'leaf_mid_albo41', 'leaf_mid_albo42', 'leaf_mat1',
  'leaf_mat2', 'leaf_mat3', 'leaf_mat4', 'leaf_mat5', 'leaf_mat6', 'leaf_mat7',
  'leaf_mat8', 'leaf_mat9', 'leaf_mat10', 'leaf_mat11', 'leaf_mat12', 'leaf_mat13',
  'leaf_mat14', 'leaf_mat15', 'leaf_mat16', 'leaf_mat17', 'leaf_mat18', 'leaf_mat19',
  'leaf_mat20', 'leaf_mat21', 'leaf_mat22', 'leaf_mat23', 'leaf_mat24', 'leaf_mat25',

  'leaf_mat38', 'leaf_mat39', 'leaf_mat40', 'leaf_mat41', 'leaf_mat42', 'leaf_mat43',
  'leaf_mat44', 'leaf_mat45', 'leaf_mat46', 'leaf_mat47', 'leaf_mat48', 'leaf_mat49',
  'leaf_mat50', 'leaf_mat51', 'leaf_mat52', 'leaf_mat53', 'leaf_mat54', 'leaf_mat55',
  'leaf_mat56', 'leaf_mat57', 'sheath_furled', 'sheath_open', 'sheath_young', 'sheath_young_albo',

  'sheath_leaf_mid_albo25', 'sheath_leaf_mid_albo26', 'sheath_leaf_mid_albo27', 'sheath_leaf_mid_albo28', 'sheath_leaf_mid_albo29', 'sheath_leaf_mid_albo30',
  'sheath_leaf_mid_albo31', 'sheath_mid1', 'sheath_mid2', 'sheath_mature', 'stem_med', 'stem_thin',
  'petiole', 'knob'
];

// 잎 프로토(임시 도형). 밑면(자루)=원점, +Y 방향. GLB 나오면 여기만 교체.
//  type0 통잎  type1 살짝갈라진(각진)  type2 많이갈라진(손가락 팬=몬스테라 천공잎)
function makeLeaf(type){
  if(type===2){
    const g=new THREE.Group(), n=5;
    for(let k=0;k<n;k++){
      const fg=new THREE.ConeGeometry(0.075,0.52,6); fg.translate(0,0.26,0); fg.scale(1,1,0.4);
      const f=new THREE.Mesh(fg, MAT.leaf[2]); f.castShadow=true;
      const s=(k/(n-1))-0.5;                 // -0.5~0.5 손가락 벌림
      f.position.x=s*0.30; f.rotation.z=s*0.95; f.rotation.x=-0.05;
      g.add(f);
    }
    return g;
  }
  const geo = type===1 ? new THREE.ConeGeometry(0.30,0.56,6) : new THREE.ConeGeometry(0.25,0.48,12);
  geo.translate(0,type===1?0.28:0.24,0);
  geo.scale(1,1,0.30);
  const m=new THREE.Mesh(geo, MAT.leaf[type]); m.castShadow=true; return m;
}

function anchorXZ(root, minY, band){
  const v=new THREE.Vector3(); let sx=0,sz=0,n=0;
  root.traverse(o=>{ if(o.isMesh&&o.geometry&&o.geometry.attributes.position){
    const p=o.geometry.attributes.position;
    for(let i=0;i<p.count;i++){ v.fromBufferAttribute(p,i).applyMatrix4(o.matrixWorld);
      if(v.y<=minY+band){ sx+=v.x; sz+=v.z; n++; } }
  }});
  return n?{x:sx/n, z:sz/n}:null;
}
function normalizeAsset(root, forceLongY, anchorBottom){
  root.updateMatrixWorld(true);
  let box=new THREE.Box3().setFromObject(root), size=new THREE.Vector3(); box.getSize(size);
  if(forceLongY){
    const mx=Math.max(size.x,size.y,size.z);
    if(mx===size.x) root.rotation.z=-Math.PI/2;
    else if(mx===size.z) root.rotation.x=Math.PI/2;
    root.updateMatrixWorld(true);
    box=new THREE.Box3().setFromObject(root); box.getSize(size);
  }
  const c=new THREE.Vector3(); box.getCenter(c);
  let ax=c.x, az=c.z;
  if(anchorBottom){ const a=anchorXZ(root, box.min.y, size.y*0.08); if(a){ ax=a.x; az=a.z; } }  // 잎: 자루끝 XZ에 정렬
  const inner=new THREE.Group(); inner.add(root); inner.position.set(-ax,-box.min.y,-az);
  const g=new THREE.Group(); g.add(inner); g.scale.setScalar(1/(size.y||1));
  const outer=new THREE.Group(); outer.add(g);
  outer.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
  const nb=new THREE.Box3().setFromObject(outer), ns=new THREE.Vector3(); nb.getSize(ns);
  const nc=new THREE.Vector3(); nb.getCenter(nc);
  outer.userData={sx:ns.x, sy:ns.y, sz:ns.z, cx:nc.x, cy:nc.y, cz:nc.z};   // 단위 크기(sy≈1) + 무게중심
  return outer;
}

// 비율은 원본 실측과 동일(하단 지름 1.309 / 상단 0.575 / 높이 1) → 기존 조정값이 그대로 유효.
function makeSheathAsset(botDia, topDia){
  const RB=botDia/2, RT=topDia/2, SEG=28, RINGS=8;
  const pos=[], nor=[], uv=[], idx=[];
  for(let i=0;i<=RINGS;i++){
    const t=i/RINGS;
    const r=RB+(RT-RB)*Math.pow(t,0.72);              // 아래가 넓고 위로 좁아짐(살짝 나팔)
    const dr=(RT-RB)*0.72*Math.pow(Math.max(t,1e-3),-0.28);   // 옆면 기울기 → 법선 보정
    const nl=Math.hypot(1,-dr);
    for(let j=0;j<=SEG;j++){
      const a=j/SEG*Math.PI*2, cx=Math.cos(a), cz=Math.sin(a);
      pos.push(r*cx, t, r*cz);
      nor.push(cx/nl, -dr/nl, cz/nl);
      uv.push(j/SEG, t);
    }
  }
  for(let i=1;i<=RINGS;i++) for(let j=1;j<=SEG;j++){
    const a=(SEG+1)*(i-1)+(j-1), b=(SEG+1)*i+(j-1), c=(SEG+1)*i+j, d=(SEG+1)*(i-1)+j;
    idx.push(a,b,d, b,c,d);
  }
  const geo=new THREE.BufferGeometry();
  geo.setIndex(idx);
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('normal',   new THREE.Float32BufferAttribute(nor,3));
  geo.setAttribute('uv',       new THREE.Float32BufferAttribute(uv,2));
  const mesh=new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.68, side:THREE.DoubleSide}));
  mesh.castShadow=true; mesh.receiveShadow=true;
  const outer=new THREE.Group(); outer.add(mesh);
  outer.userData={sx:2*RB, sy:1, sz:2*RB};            // 이미 정규화 상태(높이 1, 밑면 y=0, XZ 중심)
  outer.userData.botDia=2*RB;
  return outer;
}

function assetInst(key){

  const sc=N(a.scale,1), sxz=N(a.sxz,1), sy=N(a.sy,1);

function stretchGLB(key, p0, p1, radius, color, flatAz){

  //   특히 Z회전 시 형상이 어그러진다. 그래서 계층을 [방향] > [ADJ회전] > [비균등스케일] 순으로 둔다.

  rot.rotation.set(N(a.rx,0), N(a.ry,0), N(a.rz,0));       // 강체 회전 = 스케일 바깥 → 안 찌그러짐
  rot.position.set(N(a.ox,0)*fx, N(a.oy,0)*len, N(a.oz,0)*fz);   // 오프셋은 이전과 같은 체감 크기 유지
  g.position.copy(p0); if(color) tintObj(g,color); plantGroup.add(g);

}

function pickCandidate(list, ld){
  let tot=0; const w=[];
  for(const n of list){ const proj=n.pos.x*ld.x+n.pos.z*ld.z; const al=Math.max(0,Math.min(1.5,proj));

}

//     (알보 전체흰중기가 높이 대비 28%로 기본잎 3.8%의 7.4배라 베개처럼 두꺼웠다)

//     (흰연두·크림민트가 잎자루 20% 지름으로 기본잎 6.5%의 3배)
function meshThickness(g){
  const pa=g.attributes.position, idx=g.index;
  const N=idx? idx.count : pa.count;
  const gi=i=>idx? idx.getX(i) : i;
  let V=0, A=0;
  const ax=[0,0,0], bx=[0,0,0], cx=[0,0,0];
  for(let i=0;i+2<N;i+=3){
    const a=gi(i), b=gi(i+1), c=gi(i+2);
    ax[0]=pa.getX(a); ax[1]=pa.getY(a); ax[2]=pa.getZ(a);
    bx[0]=pa.getX(b); bx[1]=pa.getY(b); bx[2]=pa.getZ(b);
    cx[0]=pa.getX(c); cx[1]=pa.getY(c); cx[2]=pa.getZ(c);
    V += (ax[0]*(bx[1]*cx[2]-bx[2]*cx[1]) - ax[1]*(bx[0]*cx[2]-bx[2]*cx[0]) + ax[2]*(bx[0]*cx[1]-bx[1]*cx[0]))/6;
    const u0=bx[0]-ax[0],u1=bx[1]-ax[1],u2=bx[2]-ax[2];
    const v0=cx[0]-ax[0],v1=cx[1]-ax[1],v2=cx[2]-ax[2];
    A += Math.hypot(u1*v2-u2*v1, u2*v0-u0*v2, u0*v1-u1*v0)/2;

let PET_CACHE={};
function ensureLeafShape(){                                // 값이 바뀐 잎만 다시 계산

    if(!/^leaf_/.test(k) || !ASSETS[k]) continue;
    const a=adjOf(k);
    const br=(a.bladeR==null?1:a.bladeR), pr=(a.petR==null?1:a.petR), tf=(a.petTop==null?0.45:a.petTop);
    const tr=(a.trimR==null?1:a.trimR), tt=(a.trimTop==null?0.5:a.trimTop);
    const pc=(a.petCut==null?0:a.petCut), ph=(a.petHide?1:0);
    const sig=br+'/'+pr+'/'+tf+'/'+tr+'/'+tt+'/'+pc+'/'+ph;

}

// ===== 줄기를 "이음새 없는 한 줄기 튜브"로 생성 =====
// 마디 점들을 CatmullRom 곡선으로 잇고, 굵기를 t에 따라 변화(위로 갈수록 가늘게 + 마디마다 살짝 부풀림).
// GLB를 마디마다 이어 붙이던 방식은 경계 링이 필연적이라 이렇게 바꿈. 혹은 이 위에 얹는다.
function makeStemTube(pts, radAt, tubSeg, radSeg, colAt){
  if(pts.length<2) return null;
  const curve=new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.4);
  const frames=curve.computeFrenetFrames(tubSeg, false);
  const pos=[], nor=[], uv=[], idx=[], P0=new THREE.Vector3();
  for(let i=0;i<=tubSeg;i++){
    const t=i/tubSeg; curve.getPointAt(t, P0);
    const N=frames.normals[i]||frames.normals[tubSeg-1], B=frames.binormals[i]||frames.binormals[tubSeg-1];
    const r=radAt(t);
    for(let j=0;j<=radSeg;j++){
      const v=j/radSeg*Math.PI*2, si=Math.sin(v), co=-Math.cos(v);
      const nx=co*N.x+si*B.x, ny=co*N.y+si*B.y, nz=co*N.z+si*B.z;
      nor.push(nx,ny,nz); pos.push(P0.x+r*nx, P0.y+r*ny, P0.z+r*nz); uv.push(j/radSeg, t);
    }
  }
  for(let i=1;i<=tubSeg;i++) for(let j=1;j<=radSeg;j++){
    const a=(radSeg+1)*(i-1)+(j-1), b=(radSeg+1)*i+(j-1), c=(radSeg+1)*i+j, d=(radSeg+1)*(i-1)+j;
    idx.push(a,b,d, b,c,d);
  }
  // ★양 끝 뚜껑 — 열린 원기둥이면 속이 들여다보여 이상함
  const T0=curve.getTangentAt(0), T1=curve.getTangentAt(1);
  const capAt=(ringStart, P0, nrm, flip)=>{
    const ci=pos.length/3;
    pos.push(P0.x,P0.y,P0.z); nor.push(nrm.x,nrm.y,nrm.z); uv.push(0.5,0.5);
    for(let j=0;j<radSeg;j++){
      const a=ringStart+j, b=ringStart+j+1;
      if(flip) idx.push(ci,b,a); else idx.push(ci,a,b);
    }
  };
  const pStart=curve.getPointAt(0), pEnd=curve.getPointAt(1);
  capAt(0, pStart, T0.clone().negate(), false);
  capAt((radSeg+1)*tubSeg, pEnd, T1.clone(), true);
  const geo=new THREE.BufferGeometry();
  geo.setIndex(idx);
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('normal',   new THREE.Float32BufferAttribute(nor,3));
  geo.setAttribute('uv',       new THREE.Float32BufferAttribute(uv,2));
  if(colAt){                                          // 끝으로 갈수록 색이 번지게(정점색)
    const col=new Float32Array(pos.length), cnt=pos.length/3;
    const ringN=(radSeg+1)*(tubSeg+1), c=new THREE.Color();
    for(let k=0;k<cnt;k++){
      const t = (k<ringN) ? Math.floor(k/(radSeg+1))/tubSeg      // 옆면: 링 번호가 곧 t
                          : ((k===ringN) ? 0 : 1);               // 뚜껑 두 개(아래/위)
      colAt(t, c);
      col[k*3]=c.r; col[k*3+1]=c.g; col[k*3+2]=c.b;
    }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  }
  return geo;
}
// 한 축(생장점)의 줄기 전체를 튜브 하나로 그림. nodeTs=마디 경계의 t값(부풀림 위치)
function addStemTube(pts, rBase, rTip, nodeTs, color, tipColor){
  const geo=makeStemTube(pts, t=>{
    let r=rBase+(rTip-rBase)*t;                                  // 위로 갈수록 가늘게(테이퍼)
    for(const nt of nodeTs){                                     // 마디마다 살짝 볼록 → 마디감
      const d=Math.abs(t-nt);
      if(d<P.nodeWidth) r*= 1 + P.nodeBulge*(1-d/P.nodeWidth);
    }
    return r;
  }, Math.max(12, pts.length*10), 10, tipColor? (t,out)=>{
    // 끝 몇 마디가 잎자루 색으로 물든다 — 잎 → 엽초 → 줄기가 이어져 보이게.
    // 끝에서 이만큼의 마디가 물든다. 엽초가 첫 마디를 가려서 기본 2마디.
    const nb=Math.max(1, Math.round(P.tipBlendNodes||2));
    const from=(nodeTs&&nodeTs.length)? nodeTs[Math.max(0, nodeTs.length-nb)] : Math.max(0, 1-0.2*nb);
    const w=Math.max(0, Math.min(1, (t-from)/Math.max(1e-3, 1-from)));
    out.copy(color).lerp(tipColor, w*w*(3-2*w));
  } : null);
  if(!geo) return;
  const mat=new THREE.MeshStandardMaterial({color: tipColor? 0xffffff : color, roughness:0.62});
  if(tipColor) mat.vertexColors=true;   // 정점색을 쓸 땐 재질색을 흰색으로 둬야 색이 안 곱해진다
  if(STEM_TEX && P.stemTex>0.01){                       // 세로 결·은은한 디테일(회색조라 색은 유지)
    const t=STEM_TEX.clone(); t.needsUpdate=true;
    t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(1, Math.max(0.2,P.texRepeat));
    mat.map=t;
  }
  mat.userData={cloned:true};

  plantGroup.add(m);
}

  let len=L*size*N(a.sy,1);
  const radius=stemRad*F*N(a.scale,1)*N(a.sxz,1);
  if(len<1e-5||radius<1e-6) return;
  const cw=SHEATH_SET[key]||P.sheathBot, sxw=radius/(cw/2);
  const UP=new THREE.Vector3(0,1,0);
  const mesh=proto.clone(true); mesh.scale.set(sxw, len, sxw);   // 비균등 스케일은 가장 안쪽
  const rot=new THREE.Group(); rot.add(mesh);
  rot.rotation.set(N(a.rx,0), N(a.ry,0), N(a.rz,0));             // 강체 회전(전단 없음)
  rot.position.set(N(a.ox,0)*sxw, N(a.oy,0)*len, N(a.oz,0)*sxw);
  const g=new THREE.Group(); g.add(rot);
  g.quaternion.setFromUnitVectors(UP, ld);                       // 로컬 프레임 안에서만 회전 → roll 결정적
  g.position.copy(ld).multiplyScalar(-len*0.35);                 // 줄기 속으로 물려 시작
  // 엽초는 그 잎의 잎자루와 같은 색으로 — 이어진 하나처럼 보이게. 못 뽑으면 줄기색.
  tintObj(g, petColorOf(leafKey) || stemTint(0.03)); parent.add(g);
  USE_COUNT[key]=(USE_COUNT[key]||0)+1;
}
// (제거됨) addSheath — 월드 기준 배치라 줄기 방향마다 roll이 달라졌다. addSheathLocal로 대체
// 줄기 방향 기준 직교 기저 → az 방향의 "옆으로" 벡터
function stemFrame(stemDir, az){
  const up=(stemDir?stemDir.clone():new THREE.Vector3(0,1,0)).normalize();
  const ref=Math.abs(up.y)>0.9? new THREE.Vector3(1,0,0) : new THREE.Vector3(0,1,0);
  const x=new THREE.Vector3().crossVectors(ref, up).normalize();
  const z=new THREE.Vector3().crossVectors(up, x).normalize();
  const side=x.multiplyScalar(Math.cos(az)).addScaledVector(z, Math.sin(az)).normalize();
  return {up, side};
}
// ★잎자루 방향 = 줄기 방향에서 tilt만큼만 벌림. tilt=0이면 줄기와 완전히 같은 축 = "딱 꽂힘".
//   바깥으로 휘는 모양은 잎 GLB 자체의 곡선이 만들어 준다.
function leafDir(stemDir, az, tilt){
  const f=stemFrame(stemDir, az);
  return f.up.clone().multiplyScalar(Math.cos(tilt)).addScaledVector(f.side, Math.sin(tilt)).normalize();
}
// 줄기축 둘레 방위(az) + 벌어짐(tilt)을 훑어 기존 잎과 안 겹치는 쪽을 고름.
const AIM_AZ=[0,15,-15,30,-30,45,-45,60,-60,75,-75,90,-90,105,-105,120,-120,135,-135,150,-150,165,-165,180].map(a=>a*Math.PI/180);
// 겹침 회피가 방위(az)뿐 아니라 '벌어짐 각(tilt)'까지 바꾸면, 조절기로 맞춘 잎 각도가
// 줄기마다 달라 보인다. leafTiltVary=0 이면 각도를 완전히 고정하고 방위만으로 피한다.
const AIM_TILT_BASE=[0,0.16,-0.12,0.32,-0.22];
// 점 ↔ 선분 최단거리(줄기를 캡슐로 보고 검사)
function segDist(p, a, b){
  const ab=b.clone().sub(a), L2=ab.lengthSq();
  const t=L2<1e-12?0:Math.max(0,Math.min(1, p.clone().sub(a).dot(ab)/L2));
  return p.distanceTo(a.clone().addScaledVector(ab,t));
}
// 잎몸의 실제 반폭(높이1 정규화 폭 x 크기 x 에셋별 조정) — 선이 아니라 '판'으로 보기 위함
function leafHalfW(key, size){
  const u=(ASSETS[key]&&ASSETS[key].userData)||{}, a=adjOf(key), N=(v,d)=>v==null?d:v;
  const w=Math.max(u.sx||0.9, u.sz||0.9)/2;
  return size*w*N(a.scale,1)*N(a.sxz,1);
}
// ★잎몸이 실제로 놓이는 자리. addLeaf의 변환(ADJ 스케일→회전→오프셋 → size → ld정렬 → holder)을
//   그대로 재현한다. 예전엔 d/side로 어림잡아, 조절기로 준 큰 회전(최대 22도)만큼 어긋난 자리를 검사했다.
const _UP=new THREE.Vector3(0,1,0);
function leafBladeCenter(nodePos, stemDir, az, tilt, size, key){
  const a=adjOf(key), N=(v,d)=>v==null?d:v;
  const u=(ASSETS[key]&&ASSETS[key].userData)||{};
  const sc=N(a.scale,1), sxz=N(a.sxz,1), sy=N(a.sy,1);
  const c=new THREE.Vector3((u.cx||0)*sc*sxz, (u.cy==null?0.5:u.cy)*sc*sy, (u.cz||0)*sc*sxz);
  c.applyEuler(new THREE.Euler(N(a.rx,0), N(a.ry,0), N(a.rz,0)));        // ADJ 회전
  // ★ADJ 오프셋은 일부러 빼둔다. 오프셋을 조금만 움직여도 잎몸 예상 위치가 바뀌어
  //   freeAim의 방위 순위가 뒤집히고, 결과적으로 잎이 통째로 회전해 버린다.
  //   (오프셋 기여는 잎 크기의 몇 %라 충돌 정확도 손실은 작다. 회전에 큰 영향을 주는
  //    ADJ 회전은 위에서 그대로 반영한다.)
  c.multiplyScalar(size);
  const ld=new THREE.Vector3(Math.sin(tilt), Math.cos(tilt), 0);
  c.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(_UP, ld)); // 잎자루 방향 정렬
  c.addScaledVector(ld, -P.leafEmbed*(0.4+size)*P.petioleLen);           // 줄기에 박히는 만큼
  const qh=new THREE.Quaternion().setFromUnitVectors(_UP,(stemDir||_UP).clone().normalize());
  qh.multiply(new THREE.Quaternion().setFromAxisAngle(_UP, az));         // holder: 줄기축 + az 회전
  return c.applyQuaternion(qh).add(nodePos);
}
function freeAim(nodePos, stemDir, az0, tilt0, size, leafKey, ownAx){
  const R=size*P.leafClear;                                      // 잎끼리 비켜서는 반경
  // ★A1: 잎몸을 '구'(반지름=실제 반폭)로, 잎자루를 '캡슐'로 보고 줄기와 판정.
  //   기존엔 잎을 축 위 3점으로만 봐서 실제 폭의 1/4~1/5만 검사했다(잎몸이 줄기를 덮어버림).
  const bladeR=leafKey? leafHalfW(leafKey,size) : size*0.45;
  const reach=size*1.3+bladeR, near=[];
  if(P.leafStemClear>0.001){
    for(const st of STEMS){
      const mid=st.a.clone().add(st.b).multiplyScalar(0.5);
      // ★자기가 매달린 줄기의 끝 두 마디는 제외 — 안 그러면 어느 방향으로 돌려도
      //   자기 줄기와 겹침으로 계산돼 모든 후보 점수가 똑같이 나빠지고 회피가 무력해진다.
      if(ownAx && st.ax===ownAx && st.i>=st.n-2) continue;
      if(mid.distanceTo(nodePos) < reach+st.r+0.2) near.push(st);
    }
  }
  const selfR=size*0.28;                                         // 자기가 붙은 자리는 무시
  const clearOf=(d,c)=>{
    if(!near.length) return 1e9;
    let mn=1e9;
    for(const st of near){
      const dBlade=segDist(c, st.a, st.b) - st.r - bladeR;        // 잎몸(구) ↔ 줄기(캡슐)
      if(dBlade<mn) mn=dBlade;
      for(const f of [0.5,0.8]){                                  // 잎자루(캡슐) 몇 점
        const q=nodePos.clone().addScaledVector(d, size*f);
        if(q.distanceTo(nodePos)<selfR) continue;
        const dp=segDist(q, st.a, st.b) - st.r - size*0.05;
        if(dp<mn) mn=dp;
      }
    }
    return mn;
  };
  let best=null, bestScore=-1e9;
  const AIM_TILT=(P.leafTiltVary>0.001)? AIM_TILT_BASE.map(v=>v*P.leafTiltVary) : [0];
  for(const dt of AIM_TILT) for(const da of AIM_AZ){
    const az=az0+da, tilt=Math.max(0, Math.min(1.2, tilt0+dt));
    const d=leafDir(stemDir, az, tilt);
    const c=leafKey? leafBladeCenter(nodePos, stemDir, az, tilt, size, leafKey)
                    : nodePos.clone().addScaledVector(d, size*0.55);   // ★실제 잎몸 자리
    let gap=1e9;
    for(const pl of PLACED) gap=Math.min(gap, c.distanceTo(pl.c)-(pl.r+R));
    const sg=clearOf(d,c);
    if(gap>1e8 && sg>1e8) return {d, c, r:R, az, tilt};
    const score=Math.min(gap,0.25) + P.leafStemClear*Math.min(sg,0.12)
                - 0.10*Math.abs(da)/Math.PI - 0.10*Math.abs(dt);
    if(score>bestScore){ bestScore=score; best={d, c, r:R, az, tilt}; }
  }
  return best;
}
// 잎: 마디에서 방위 az + 성숙도별 처짐 방향으로. key=쓸 GLB. 잎자루 끝이 마디에 살짝 파고들게.
function addLeaf(nodePos, az, maturity, key, sizeOverride, stemDir, stemRad, ownAx){
  const size=((sizeOverride!=null)?sizeOverride:leafSize(maturity))*PLANT_GROW;   // 단계별 곡선 x 전체 성장 배율
  const tilt=P.leafTilt + maturity*P.elevDrop*0.5;              // 줄기축에서 벌어지는 각(성숙할수록 조금 더)
  const aim=freeAim(nodePos, stemDir, az, tilt, size, key, ownAx);
  const d=aim.d;
  PLACED.push({c:aim.c, r:aim.r});                              // 자리 점유 등록(다음 잎이 피해감)
  // ★음수 = 잎자루 끝을 줄기 속으로 박아 붙임(잎 GLB에 잎자루가 포함돼 있으므로 틈이 생기면 안 됨)
  const reach=-P.leafEmbed*(0.4+size)*P.petioleLen;
  const base=nodePos.clone().addScaledVector(d, reach);
  // ★잎 + 엽초를 하나의 holder에 담아 "세트"로 취급 → 같이 회전·이동하며 절대 어긋나지 않음
  const UP=new THREE.Vector3(0,1,0);
  const holder=new THREE.Group();
  holder.position.copy(nodePos);
  holder.quaternion.setFromUnitVectors(UP, (stemDir||UP).clone().normalize());   // 로컬 +Y = 줄기축(관통선)
  holder.rotateY(aim.az);                                      // ← 관통선 기준 회전
  holder.userData.assetKey=key;                               // 클릭해서 이름을 알아보려고 남긴다
  const ld=new THREE.Vector3(Math.sin(aim.tilt), Math.cos(aim.tilt), 0);   // 로컬 잎자루 방향
  if(stemRad) addSheathLocal(holder, ld, stemRad, size, key);  // 엽초도 같은 프레임 안에
  addPetiole(nodePos, d, size, maturity, base);                // (기본 off)
  const proto=assetInst(key);
  if(proto){
    proto.scale.multiplyScalar(size);
    proto.quaternion.setFromUnitVectors(UP, ld);
    proto.position.copy(ld).multiplyScalar(reach);
    if(!KEEP_TEX.has(key)) tintObj(proto, leafTint(maturity));           // 잎만 잎색(엽초는 줄기색 유지)
    // ★무늬종(알보 등)은 텍스처가 무늬 그 자체 → 아예 틴트하지 않고 원본 그대로 쓴다
    holder.add(proto); plantGroup.add(holder); return; }
  plantGroup.add(holder);
  // 폴백: 임시 원뿔
  const type=/mature/.test(key)?2:/mid/.test(key)?1:0;
  const m=makeLeaf(type), pivot=new THREE.Group(); pivot.position.copy(base); pivot.rotation.y=az;
  m.rotation.x=0.5+maturity*0.7; m.scale.setScalar(size); pivot.add(m); plantGroup.add(pivot);
}
// 새순: 갓 난 성장점(줄기 끝을 이어 거의 곧게 위). furled → opening → (young 잎)
function addBud(nodePos, az, kind, size, stemDir, stemRad){
  const UP=new THREE.Vector3(0,1,0), key=leafKindKey(kind);
  const tilt=P.leafTilt*0.4;                                   // 새순은 잎보다 더 곧게
  // ★잎과 동일한 구조: holder(줄기축 관통선) 안에 엽초+새순을 함께 → 세트로 회전·이동
  const holder=new THREE.Group();
  holder.position.copy(nodePos);
  holder.quaternion.setFromUnitVectors(UP, (stemDir||UP).clone().normalize());
  holder.rotateY(az);
  const ld=new THREE.Vector3(Math.sin(tilt), Math.cos(tilt), 0);
  if(stemRad) addSheathLocal(holder, ld, stemRad, size, key);   // 새순/반잎 각각의 엽초
  const embed = kind==='furled'? 0.24*size : 0.12*size;         // 말린 새순은 줄기에 깊이 박히게
  const wd=ld.clone().applyQuaternion(holder.quaternion);
  PLACED.push({c:nodePos.clone().addScaledVector(wd, size*0.5), r:size*0.4});
  const proto=assetInst(key);
  holder.userData.assetKey=key;
  if(proto){
    proto.scale.multiplyScalar(size);
    proto.quaternion.setFromUnitVectors(UP, ld);
    proto.position.copy(ld).multiplyScalar(-embed);
    tintObj(proto, budTint()); holder.add(proto);
  } else {
    const m=new THREE.Mesh(new THREE.ConeGeometry(0.05,0.14,8), MAT.stem);
    m.position.y+=size*0.5; holder.add(m);
  }
  plantGroup.add(holder);
}
// ===== 잎자루 색 =====
// 엽초를 그 잎과 같은 색으로 칠하려고, 잎 텍스처에서 잎자루 부분의 평균색을 뽑는다.
// 무늬종은 텍스처가 곧 무늬라 건드리면 안 되므로 '읽기만' 한다. 결과는 캐시.
const PET_COLOR={};
function leafPetColor(key){
  if(key in PET_COLOR) return PET_COLOR[key];
  PET_COLOR[key]=null;                                  // 실패해도 매 프레임 다시 시도하지 않게 먼저 박아둔다
  const proto=ASSETS[key]; if(!proto) return null;
  try{
    proto.updateMatrixWorld(true);
    const inv=new THREE.Matrix4().copy(proto.matrixWorld).invert();
    const v=new THREE.Vector3(), parts=[];
    let mnY=Infinity, mxY=-Infinity;
    proto.traverse(o=>{
      if(!(o.isMesh && o.geometry && o.geometry.attributes.position && o.geometry.attributes.uv)) return;
      const m=new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld);
      const pa=o.geometry.attributes.position, ua=o.geometry.attributes.uv;
      const ys=new Float32Array(pa.count);
      for(let i=0;i<pa.count;i++){
        v.set(pa.getX(i),pa.getY(i),pa.getZ(i)).applyMatrix4(m); ys[i]=v.y;
        if(v.y<mnY)mnY=v.y; if(v.y>mxY)mxY=v.y;
      }
      const tex=(o.material&&o.material.map)||null;
      if(tex&&tex.image) parts.push({ys,ua,img:tex.image});
    });
    if(!parts.length) return null;
    const hgt=(mxY-mnY)||1, yCut=mnY+hgt*0.25;            // 아래 25% = 잎자루 구간
    const cv=document.createElement('canvas'), ctx=cv.getContext('2d');
    let r=0,g=0,b=0,n=0,drawn=null;
    for(const pt of parts){
      const im=pt.img, W=im.width||0, H=im.height||0;
      if(!W||!H) continue;
      if(drawn!==im){ cv.width=W; cv.height=H; ctx.drawImage(im,0,0); drawn=im; }
      const step=Math.max(1, Math.floor(pt.ys.length/240));   // 표본 240점이면 충분
      for(let i=0;i<pt.ys.length;i+=step){
        if(pt.ys[i]>yCut) continue;
        let u=pt.ua.getX(i), w=pt.ua.getY(i);
        u-=Math.floor(u); w-=Math.floor(w);
        const px=Math.min(W-1, Math.max(0, Math.round(u*(W-1))));
        const py=Math.min(H-1, Math.max(0, Math.round((1-w)*(H-1))));
        const d=ctx.getImageData(px,py,1,1).data;
        if(d[3]<128) continue;
        r+=d[0]; g+=d[1]; b+=d[2]; n++;
      }
    }
    if(!n) return null;
    // 캔버스 값은 sRGB, 재질 색은 선형이라 변환해 준다
    PET_COLOR[key]=new THREE.Color(r/n/255, g/n/255, b/n/255).convertSRGBToLinear();
    return PET_COLOR[key];
  }catch(e){ console.warn('잎자루 색 추출 실패', key, e); return null; }
}
// 무늬종만 텍스처 색을 쓴다. 기본잎은 코드가 그루 색으로 덧칠하므로,
// 텍스처에서 뽑은 색을 쓰면 화면에 보이는 잎 색과 어긋난다.
function petColorOf(key){ return KEEP_TEX.has(key)? leafPetColor(key) : null; }
// 잎 단계별로 어떤 에셋을 쓸지 — 줄기 끝 색을 맞추려면 잎을 그리기 전에 알아야 한다.
function pickLeafKey(m, midType, canMature, varie, alboMid, matRoll){
  if(m<0.22) return null;                                          // 새순 단계는 잎 에셋이 아니다
  if(m<P.stageYoung) return (varie&&ASSETS.leaf_young_albo)?'leaf_young_albo':'leaf_young';
  if(m<P.stageMid || !canMature){
    if(varie){ const n=P.alboMidPick>0? Math.round(P.alboMidPick) : (alboMid||1);
      const k='leaf_mid_albo'+Math.max(1,Math.min(ALBO_MID_MAX,n));
      if(ASSETS[k]) return k; }
    return (midType||'leaf_mid1');
  }
  if(varie){ const n=P.matAlboPick>0? Math.round(P.matAlboPick) : matFromMid(alboMid, matRoll);
    if(n>0){ const k='leaf_mat'+Math.max(1,Math.min(MAT_ALBO_MAX,n)); if(ASSETS[k]) return k; } }
  return 'leaf_mature';
}
// 잎 병렬 성숙: furled → opening2 → young → mid(1|2) → mature (m=0..1)
function drawLeafStage(pos, az, m, midType, canMature, stemDir, stemRad, varie, ownAx, alboMid, matRoll){
  if(m<0.10){ addBud(pos, az, 'furled',  P.budSize*(0.6+m*3), stemDir, stemRad); return; }
  if(m<0.22){ addBud(pos, az, 'opening', P.budSize*(1.0+m), stemDir, stemRad); return; }
  let key;
  if(m<P.stageYoung) key=(varie&&ASSETS.leaf_young_albo)?'leaf_young_albo':'leaf_young';   // 어린 통잎(변이면 알보)
  else if(m<P.stageMid || !canMature){
    // 변이 잎은 중간 단계도 알보로(캐논: 한번 정해지면 변이 루트 유지)
    if(varie){ const n=P.alboMidPick>0? Math.round(P.alboMidPick) : (alboMid||1);
      key='leaf_mid_albo'+Math.max(1,Math.min(ALBO_MID_MAX,n));
      if(!ASSETS[key]) key=(midType||'leaf_mid1'); }
    else key=(midType||'leaf_mid1');                               // 보통은 중간잎에서 정착
  }
  else {
    // ★캐논: 변이로 정해진 잎은 성숙까지 변이 루트를 유지한다(중기와 같은 규칙).
    //   어느 무늬가 나올지는 축마다 미리 뽑아둔 matAlbo. 중기 무늬와의 대응 규칙은 아직 미정.
    key='leaf_mature';
    if(varie){ const n=P.matAlboPick>0? Math.round(P.matAlboPick) : matFromMid(alboMid, matRoll);
      if(n>0){ const k2='leaf_mat'+Math.max(1,Math.min(MAT_ALBO_MAX,n)); if(ASSETS[k2]) key=k2; } }
  }
  addLeaf(pos, az, m, key, null, stemDir, stemRad, ownAx);
}

// 실제 일수 → 생장 나이. 끝점(GMAX)은 고정이므로 3년 뒤 최종 모습은 곡선과 무관하게 같다.
function ageOf(d){ const k=P.timeCurve||1; if(k===1||d<=0) return d;
  return GMAX*Math.pow(Math.min(1,d/GMAX), k); }
function clearGroup(g){ while(g.children.length){ const c=g.children[0]; g.remove(c); c.traverse&&c.traverse(o=>{ if(o.isMesh){ if(o.geometry) o.geometry.dispose();
  const ms=Array.isArray(o.material)?o.material:[o.material]; ms.forEach(m=>{ if(m&&m.userData&&m.userData.cloned) m.dispose(); }); } }); } }

function buildPlant(){
  rng=mulberry32(SEED);            // 매 빌드 동일 시드 → 안정적(슬라이더 드래그해도 안 흔들림)
  seedColor();                     // 개체 통일 색(시드 고정: 색조+채도)
  ensureSheath();                             // 엽초 구멍 크기 변경 반영
  ensureLeafShape();                          // 잎자루 지름 변경 반영
  clearGroup(plantGroup); clearPlaced();      // 겹침 회피용 자리 기록 초기화
  addPot();
  // ★실제 경과일(gReal)을 '생장 나이'(g)로 변환한다. 어린 개체가 빨리 자리잡고
  //   덩치가 커질수록 더디게 자라는 실제 생장 곡선. timeCurve=1이면 예전과 동일(등속).
  const gReal=GROWTH, g=ageOf(gReal), gf=Math.min(1, g/GMAX);
  PLANT_AGE=gf;                             // 개체 나이(색 짙어짐·선명해짐 기준)
  // ★한 게이지로 줄기·엽초·잎이 '지금 비율 그대로' 함께 커진다. growAmt가 한계치(최대 배율-1).
  PLANT_GROW=1 + P.growAmt*Math.min(1, g/Math.max(1,P.growSpan));
  let stage='', nodes=0, leaves=0;

  if(g<P.seedEnd){
    const t=g/Math.max(1,P.seedEnd);
    const seed=new THREE.Mesh(new THREE.SphereGeometry(0.05+0.04*t,10,8), MAT.seed);
    seed.position.set(0,SOIL_Y+0.03,0); seed.scale.y=0.7; seed.castShadow=true; plantGroup.add(seed);
    stage='씨앗 🌰';
  } else {
    // ===== 정밀 생장 (순서도 #0~#16 데이터 그대로) =====
    //  ① 생장점(TIP)은 고정된 하나. ★잎도 그 자리에 하나뿐이고, "그 잎이" 새순→반잎→어린→중간→(랜덤)성숙 으로 자란다.
    //  ② 새 마디는 TIP "아래"에 삽입된다(growUp). 그래서 줄기가 밑에서 길어지고 생장점(잎)은 위로 밀려 올라간다.
    //  ③ 마디는 삽입 후 시간이 지나면 아래(오래된 것)부터 줄기_초기 → 줄기_중기(=분홍 예비혹, 중기_1/2 50:50).
    //  ④ ★혹은 무조건 1개씩. "어떤 생장점의 잎이 중간잎이 되는 순간" 예비혹 후보 중 랜덤 딱 1개만 혹이 된다.
    //     그 혹에서 난 가지의 새순이 다시 중간잎이 되어야 그 다음 혹이 랜덤 발생. (다발성 X)
    const L=LIGHT_AZ, ld=new THREE.Vector3(Math.sin(L),0,Math.cos(L));   // 빛 방향(수평)
    const t0=P.seedEnd, STEP=Math.max(1,P.spawnStep);
    const M_MID=P.stageYoung;                                            // 중간잎 시작(drawLeafStage 기준과 동일)
    const axes=[];
    // 축 = 생장점 하나. 잎 1개(leafBirth부터 성숙) + 그 아래로 쌓이는 마디들(segs)
    const mkAxis=(from,dir,birth)=>{
      const d0=dir.clone().normalize();
      // ★축마다 "일정한 방향으로 휘는 아치"를 하나 정해 둔다. 매 마디 랜덤(백색잡음)은 서로 상쇄돼
      //   곡선이 안 생기고 떨리기만 하므로, 방향을 고정해야 자연스러운 곡선이 누적된다.
      const ref=Math.abs(d0.y)>0.9? new THREE.Vector3(1,0,0) : new THREE.Vector3(0,1,0);
      const cx=new THREE.Vector3().crossVectors(ref,d0).normalize();
      const cz=new THREE.Vector3().crossVectors(d0,cx).normalize();
      const ca=rng()*Math.PI*2;
      const curveDir=cx.multiplyScalar(Math.cos(ca)).addScaledVector(cz, Math.sin(ca)).normalize();
      const ax={from, dir:d0, birth, leafBirth:birth+P.petGrow, segs:[], simTip:null, midType:null,
                az:rng()*Math.PI*2, canMature:rng()<P.matureProb,
                triggered:false, grew:false,
                varie:rng()<P.varieProb,                   // ★캐논: 변이는 어린잎 단계에서 확률로 결정
                alboMid:ALBO_MID_POOL[Math.floor(rng()*ALBO_MID_POOL.length)],   // 이 잎이 쓸 알보 중기 종류
                matRoll:rng(),                             // 성숙 무늬 추첨값(트리에서 주/부/희귀를 가른다)
                matAlbo:MAT_ALBO_POOL.length? MAT_ALBO_POOL[Math.floor(rng()*MAT_ALBO_POOL.length)] : 0,   // 성숙까지 갔을 때 쓸 변이 종류
                midPick:(rng()<0.5?'leaf_mid1':'leaf_mid2'),  // 잎마다 랜덤(midMix로 개체고정과 섞음)
                curveDir, curveAmt:0.55+rng()*0.9};        // 개체마다 휘는 정도가 조금씩 다르게
      ax.midType=(rng()<P.midMix)? ax.midPick : PLANT_MID;   // midMix=0 개체 1종 고정 / 1 잎마다 랜덤
      ax.simTip=from? null : new THREE.Vector3(0,SOIL_Y,0);   // 곁가지는 첫 마디 때 부모 위치에서 계산
      axes.push(ax); return ax; };
    const SIM_SEGS=[];                                          // 시뮬 중 생긴 줄기(조향 판단용)
    const addSeg=(ax,T)=>{
      // ★앞 마디 방향을 이어받아 조금씩만 틀기 → 마디 경계가 꺾여 어긋나 보이지 않음
      const prev=ax.segs.length? ax.segs[ax.segs.length-1].dir : ax.dir;
      const k=ax.segs.length;
      if(!ax.simTip) ax.simTip=axBase(ax, 1e9).clone();          // 곁가지: 부모의 혹 위치(다 자란 기준)
      const len0=P.internode*(0.92+rng()*0.16);   // 길이 배율은 렌더 시 PLANT_GROW로 적용
      const droop=P.stemDroop*Math.min(1, k/Math.max(1,P.maxLeaves*0.7));   // 길어질수록 무게로 아래로
      // ★①생장 시 조향: 앞으로 갈 자리에 다른 줄기가 있으면 그 반대쪽으로 조금 튼다(접촉굴성)
      const away=new THREE.Vector3();
      if(P.avoidLean>0.001 && SIM_SEGS.length){
        const probe=ax.simTip.clone().addScaledVector(prev, len0*1.6*PLANT_GROW);
        const RAD=P.avoidRange;
        for(const sg of SIM_SEGS){
          if(sg.ax===ax || sg.ax===(ax.from&&ax.from.ax)) continue;   // 자기 축·부모 축은 제외
          const v=probe.clone().sub(sg.p); const dd=v.length();
          if(dd<1e-4 || dd>RAD) continue;
          away.addScaledVector(v.multiplyScalar(1/dd), (RAD-dd)/RAD);
        }
        if(away.lengthSq()>1e-9){ away.y*=0.35; away.normalize(); }      // 옆으로 피하되 위로는 덜
      }
      const dir=prev.clone().lerp(ax.dir, P.stemStraight)                   // 곧게 서려는 힘
        .addScaledVector(ld, PHOTO*P.photoLean)                             // 빛 쪽
        .addScaledVector(ax.curveDir, P.stemCurve*ax.curveAmt)              // 일정 방향 아치(누적)
        .addScaledVector(away, P.avoidLean)                                 // ★다른 줄기 피하기
        .addScaledVector(new THREE.Vector3(0,-1,0), droop)                  // 무게 처짐
        .add(new THREE.Vector3((rng()-0.5)*P.spread,0,(rng()-0.5)*P.spread)).normalize();
      ax.segs.push({dir, len:len0, birth:T, activated:false,
                    az:ax.az+k*GOLDEN});
      ax.simTip=ax.simTip.clone().addScaledVector(dir, len0*PLANT_GROW);
      SIM_SEGS.push({ax, p:ax.simTip.clone()}); };                 // 마디마다 방위(황금각) → 혹·가지가 각기 다른 쪽
    const leafM=(ax,T)=>Math.max(0, Math.min(1,(T-ax.leafBirth)/P.matSpan));   // 그 축의 잎 성숙도
    // 축 시작점 — ★가지는 부모 "혹 마디의 돌기 위치"(마디 끝이 아니라 중간)에서 남
    const axBase=(ax,T)=>{
      if(!ax.from) return new THREE.Vector3(0,SOIL_Y,0);
      const p=axBase(ax.from.ax,T), pa=ax.from.ax;
      // ★PLANT_GROW를 반드시 함께 곱할 것. 줄기는 배율만큼 길어지는데 여기서 빠뜨리면
      //   가지가 부모 줄기의 '혹'이 아니라 훨씬 아래에서 나와 잎이 줄기 중간에 박힌 것처럼 보인다.
      for(let i=0;i<ax.from.idx && i<pa.segs.length;i++){ const s=pa.segs[i]; if(s.birth>T) break;
        p.addScaledVector(s.dir, s.len*Math.min(1,(T-s.birth)/Math.max(1,P.petGrow))*PLANT_GROW); }
      const b=pa.segs[ax.from.idx];                                      // 혹 마디: 돌기(bumpAt) 지점까지만
      if(b && b.birth<=T) p.addScaledVector(b.dir, b.len*Math.min(1,(T-b.birth)/Math.max(1,P.petGrow))*PLANT_GROW*P.bumpAt);
      return p; };
    mkAxis(null, new THREE.Vector3((rng()-0.5)*0.10,1,(rng()-0.5)*0.10).normalize(), t0);
    for(let T=t0; T<=g+1e-6; T+=STEP){
      // ④ ★잎이 중간잎이 된 생장점이 있으면 → 그때 딱 하나의 마디만 혹으로
      //    (마디 추가보다 먼저 판정해야 "줄기 2개일 때 중간잎" 상태에서 혹이 생김)
      const trig=axes.find(ax=>!ax.triggered && leafM(ax,T)>=M_MID);
      if(trig){
        trig.triggered=true;                                             // 이 잎의 트리거는 1회만
        axes.forEach(a=>a.grew=false);                                   // 새 사이클 시작 → 각 줄기가 1마디씩 더
        const cand=[];                                                   // 후보 = 모든 줄기_중기(분홍 예비혹) 마디
        for(const ax of axes) ax.segs.forEach((s,i)=>{
          if(!s.activated && T-s.birth>=P.stemTrans) cand.push({ax,s,i}); });
        if(cand.length){
          const c=cand[Math.floor(rng()*cand.length)];                   // 순서도: 어디서 날지는 순수 랜덤
          c.s.activated=true; c.s.actT=T;
          const dbl=rng()<P.doubleBud; c.s.actType=dbl?'main':'thick';   // 쌍혹(가지2) / 단혹(가지1)
          // ★혹이 붙는 방위는 줄기 둘레 360° 어디든. 굴광성이 높을수록 해 쪽으로 몰림(0=완전 랜덤, 1=정확히 해 쪽)
          c.s.az = LIGHT_AZ + (rng()-0.5)*Math.PI*2*(1-PHOTO*0.85);
          const a0=c.s.az+P.bumpAzOff, nb=dbl?2:1;                       // 가지 방향 = 혹의 방위(+오프셋으로 돌기에 맞춤)
          for(let i=0;i<nb;i++){                                         // 혹에서 줄기_초기가 나와 자람
            const s2=a0+(nb===2? i*Math.PI : 0);
            const bd=new THREE.Vector3(Math.sin(s2)*P.branchSpread, 1, Math.cos(s2)*P.branchSpread).normalize();
            mkAxis({ax:c.ax, idx:c.i}, bd, T+P.bumpGrow);                // 혹이 다 돋은 뒤에 가지가 남(순서도 #12→#14)
          }
        }
      }
      // ★첫 중간잎까지는 마디가 쭉 자라고, 그 뒤부터는 "중간잎 → 다음 중간잎" 사이에 딱 1마디씩만
      for(const ax of axes){
        if(ax.birth>T || ax.segs.length>=P.maxLeaves) continue;
        if(ax.triggered && ax.grew) continue;                            // 중간잎 지난 축은 사이클당 1마디
        addSeg(ax,T); ax.grew=true;
      }
    }
    // ===== 렌더 =====
    // ★2단계로 나눈다: 잎이 "다른 줄기"를 피하려면 잎을 놓기 전에 모든 줄기를 알아야 하기 때문.
    //   1단계에서 전 축의 마디 점·굵기를 계산해 장애물(STEMS)로 등록하고, 2단계에서 그린다.
    let nLeaf=0, acts=0, nSeg=0;
    const built=[];
    for(const ax of axes){
      if(ax.birth>g) continue;
      let cur=axBase(ax,g);
      const pts=[cur.clone()], bumps=[];
      for(const sg of ax.segs){
        if(sg.birth>g) continue;
        const gr=Math.min(1,(g-sg.birth)/Math.max(1,P.petGrow));        // ★줄기_초기만 길이가 자람
        cur=cur.clone().addScaledVector(sg.dir, sg.len*gr*PLANT_GROW);
        pts.push(cur.clone());
        if(sg.activated && g>=sg.actT+P.bumpGrow){ bumps.push({s:sg, i:pts.length-2, gr}); acts++; }
        nSeg++;
      }
      const matured=Math.min(1,(g-ax.birth)/Math.max(1,P.stemTrans*2));
      const rBase=(P.rEarly+(P.rThin-P.rEarly)*matured)*PLANT_GROW, rTip=P.rEarly*P.tipTaper*PLANT_GROW;
      built.push({ax, pts, bumps, rBase, rTip, tip:cur.clone()});
      for(let i=0;i<pts.length-1;i++){                                   // 줄기 마디를 장애물로 등록
        const t=(i+0.5)/Math.max(1,pts.length-1);
        STEMS.push({a:pts[i], b:pts[i+1], r:rBase+(rTip-rBase)*t, ax, i, n:pts.length-1});
      }
    }
    for(const e of built){
      if(e.pts.length>=2){
        const L=[0]; for(let i=1;i<e.pts.length;i++) L.push(L[i-1]+e.pts[i].distanceTo(e.pts[i-1]));
        const tot=L[L.length-1]||1, nodeTs=L.slice(1,-1).map(l=>l/tot);
        // 이 축 끝에 달릴 잎을 미리 알아내 줄기 끝 색을 맞춘다(잎 → 엽초 → 줄기가 이어져 보이게)
        let tipCol=null;
        // ※ 이 블록 아래에서 const ax=e.ax 를 선언하므로 여기서 ax를 쓰면 TDZ 오류가 난다. e.ax로 쓴다.
        if(g>=e.ax.leafBirth){
          const A=e.ax;
          const lk=pickLeafKey(leafM(A,g), A.midType, A.canMature, A.varie, A.alboMid, A.matRoll);
          if(lk) tipCol=petColorOf(lk);
        }
        addStemTube(e.pts, e.rBase, e.rTip, nodeTs, stemTint(0), tipCol);
        for(const b of e.bumps){                                         // 혹/쌍혹 GLB를 마디 구간에 얹음
          const key=b.s.actType==='main'?'stem_main':'stem_thick';
          const rad=(b.s.actType==='main'?P.rThick*1.05:P.rThick)*P.bumpFit*PLANT_GROW;
          stretchGLB(key, e.pts[b.i], e.pts[b.i+1], rad, stemTint(0.04), b.s.az);
        }
      }
      const ax=e.ax, last=ax.segs.length?ax.segs[ax.segs.length-1]:null;
      const tipAz=last?last.az:ax.az, tipDir=last?last.dir:ax.dir;
      if(g>=ax.leafBirth){ drawLeafStage(e.tip, tipAz, leafM(ax,g), ax.midType, ax.canMature, tipDir, P.rEarly*P.tipTaper*PLANT_GROW, ax.varie, ax, ax.alboMid, ax.matRoll); nLeaf++; }
    }
    nodes=nSeg; leaves=nLeaf;
    stage = nSeg<=1 ? '새싹 🌱' : ((axes.length>1?'가지 '+(axes.length-1)+' · ':'')+(acts?'혹 '+acts+' · ':'')+'마디 '+nSeg);
  }
  updateAssetUse();   // 선택한 에셋이 지금 화면에 몇 개 있는지
  fitCam();     // 자라는 만큼 카메라가 따라 담기(항상 화면 안에)
  const el=document.getElementById('stat');
  el.innerHTML=`<span class="k">단계</span> ${stage}<br><span class="k">마디</span> ${nodes} · <span class="k">잎</span> ${leaves} · <span class="k">시드</span> ${SEED}<br><span class="k">생장나이</span> ${Math.round(ageOf(GROWTH))}일`;
}
// 식물 전체가 화면에 담기도록 직교 프러스텀·시선높이 자동 조절
function fitCam(){
  if(!plantGroup||!cam) return;
  const b=new THREE.Box3().setFromObject(plantGroup);
  if(!isFinite(b.max.y)||b.isEmpty()) return;
  const topY=b.max.y, halfW=Math.max(Math.abs(b.min.x),Math.abs(b.max.x),Math.abs(b.min.z),Math.abs(b.max.z));
  FRUSTUM=Math.max(1.5, Math.min(4.2, Math.max(topY*0.62+0.32, halfW*1.15+0.5)));
  orbit.ty=topY*0.5+0.15;                       // 밑동~꼭대기 중간을 봄
  const a=(W||innerWidth)/(H||innerHeight);     // 투영만 갱신(렌더러 크기는 resize가 담당)
  cam.left=-FRUSTUM*a; cam.right=FRUSTUM*a; cam.top=FRUSTUM; cam.bottom=-FRUSTUM;
  updateCam();
}

// ===== 씬/카메라 (loader_glb.html 직교 4방위 방식) =====
function init(){
  renderer=new THREE.WebGLRenderer({canvas:cv, antialias:true});
  renderer.setPixelRatio(DPR);
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;

  scene=new THREE.Scene(); scene.background=new THREE.Color(0x1a1526);
  cam=new THREE.OrthographicCamera(-1,1,1,-1,0.01,1000);

  scene.add(new THREE.HemisphereLight(0xbcd0ff,0x30281f,0.75));
  const dir=new THREE.DirectionalLight(0xfff2dc,1.4);
  dir.position.set(5,11,6); dir.castShadow=true;
  dir.shadow.mapSize.set(2048,2048); dir.shadow.bias=-0.0004; dir.shadow.radius=5;
  const ds=8; dir.shadow.camera.near=0.5; dir.shadow.camera.far=40;
  dir.shadow.camera.left=-ds; dir.shadow.camera.right=ds; dir.shadow.camera.top=ds; dir.shadow.camera.bottom=-ds;
  scene.add(dir, dir.target);
  scene.add(new THREE.DirectionalLight(0x88aaff,0.3).translateX(-6));

  ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40), new THREE.ShadowMaterial({opacity:0.28}));
  ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
  grid=new THREE.GridHelper(12,12,0x555070,0x33304a);
  grid.material.transparent=true; grid.material.opacity=0.5; scene.add(grid);

  plantGroup=new THREE.Group(); scene.add(plantGroup);

  // 빛 방향 마커(작은 해)
  sunMarker=new THREE.Mesh(new THREE.SphereGeometry(0.14,14,12),
    new THREE.MeshBasicMaterial({color:0xffd24a}));
  scene.add(sunMarker); updateSun();

function resize(){
  W=innerWidth; H=innerHeight; renderer.setSize(W,H);
  const a=W/H; cam.left=-FRUSTUM*a; cam.right=FRUSTUM*a; cam.top=FRUSTUM; cam.bottom=-FRUSTUM; cam.updateProjectionMatrix();
}
function updateCam(){
  const {az,el,r,tx,ty,tz}=orbit, ce=Math.cos(el);
  cam.position.set(tx+r*ce*Math.sin(az), ty+r*Math.sin(el), tz+r*ce*Math.cos(az));
  cam.up.set(0,1,0); cam.lookAt(tx,ty,tz); cam.zoom=orbit.zoom; cam.updateProjectionMatrix();
}
function snapView(dir){
  const flat=0.32;
  if(dir==='front'){ orbit.az=0; orbit.el=flat; }
  else if(dir==='left'){ orbit.az=-Math.PI/2; orbit.el=flat; }
  else if(dir==='right'){ orbit.az=Math.PI/2; orbit.el=flat; }
  else if(dir==='top'){ orbit.az=Math.PI*0.22; orbit.el=1.45; }
  updateCam();
}
function bindControls(){
  addEventListener('resize',()=>{ resize(); updateCam(); });
  let drag=false,px=0,py=0,pan=false;
  cv.addEventListener('pointerdown',e=>{ drag=true; pan=(e.button===2||e.shiftKey); px=e.clientX; py=e.clientY;
    downX=e.clientX; downY=e.clientY; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove',e=>{ if(!drag)return; const dx=e.clientX-px,dy=e.clientY-py; px=e.clientX; py=e.clientY;
    if(pan){ const sx=(cam.right-cam.left)/W/orbit.zoom, sy=(cam.top-cam.bottom)/H/orbit.zoom;
      const fwd=new THREE.Vector3(); cam.getWorldDirection(fwd);
      const right=new THREE.Vector3().crossVectors(fwd,cam.up).normalize();
      const up=new THREE.Vector3().crossVectors(right,fwd).normalize();
      const mx=-dx*sx,my=dy*sy;
      orbit.tx+=mx*right.x+my*up.x; orbit.ty+=mx*right.y+my*up.y; orbit.tz+=mx*right.z+my*up.z;
    } else { orbit.az+=dx*0.008; orbit.el=Math.max(0.05,Math.min(1.52,orbit.el+dy*0.006)); }
    updateCam(); });
  cv.addEventListener('pointerup',e=>{ drag=false;
    if(Math.hypot(e.clientX-downX, e.clientY-downY)<5) pickAt(e);   // 거의 안 움직였으면 클릭

function pickAt(e){
  const r=cv.getBoundingClientRect();
  RAY.setFromCamera(new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,
                                      -((e.clientY-r.top)/r.height)*2+1), cam);
  const hit=RAY.intersectObjects(plantGroup.children, true);
  for(const h of hit){
    let o=h.object, key=null;
    while(o && !key){ if(o.userData && o.userData.assetKey) key=o.userData.assetKey; o=o.parent; }
    if(!key) continue;
    const rep=ADJ_ALIAS[key]||key;            // 파생본은 대표로 (조정은 대표에만 걸린다)
    const sel=document.getElementById('assetSel');
    if(sel && [...sel.options].some(op=>op.value===rep)){
      sel.value=rep; buildAssetSliders(rep); showPreview(rep);
    }
    const nm=ADJ_KO[key]||key;
    showPick(nm + (rep!==key? '  (조정은 '+(ADJ_KO[rep]||rep)+')' : ''));
    return;
  }
  showPick('');
}

      +'padding:9px 16px;border-radius:9px;background:rgba(20,16,32,.93);color:#eafbe4;'
      +'border:1px solid #4c7a46;font-size:13.5px;font-weight:600;letter-spacing:.2px;'
      +'pointer-events:none;transition:opacity .25s;box-shadow:0 4px 18px rgba(0,0,0,.5)';

let prevR, prevScene, prevCam, prevObj;
function initPreview(){
  const c=document.getElementById('assetPrev'); if(!c||typeof THREE==='undefined') return;
  prevR=new THREE.WebGLRenderer({canvas:c, antialias:true, alpha:true});
  prevR.setPixelRatio(Math.min(2,devicePixelRatio||1)); prevR.setSize(c.width,c.height,false);
  prevR.outputEncoding=THREE.sRGBEncoding;
  prevScene=new THREE.Scene();
  prevScene.add(new THREE.HemisphereLight(0xffffff,0x888888,1.25));
  const d=new THREE.DirectionalLight(0xffffff,1.15); d.position.set(3,5,4); prevScene.add(d);
  const d2=new THREE.DirectionalLight(0xffffff,0.5); d2.position.set(-3,2,-2); prevScene.add(d2);
  const asp=c.width/c.height, F=0.62;
  prevCam=new THREE.OrthographicCamera(-F*asp,F*asp,F,-F,0.01,100);
  prevCam.position.set(1.3,0.85,1.9); prevCam.lookAt(0,0,0);   // 오브젝트를 원점 중심으로 맞추므로 원점 응시
}
function showPreview(key){                                 // 라이브: 현재 조정값(ADJ) 반영해 미리보기
  if(!prevScene) return;
  if(prevObj){ prevScene.remove(prevObj); prevObj=null; }
  const p=ASSETS[key];
  if(!p){ console.warn('[preview] 에셋 로드 안됨:', key, ASSET_FILES[key]); return; }   // GLB 404 등
  try{
    const a=adjOf(key), N=(v,d)=>v==null?d:v, sc=N(a.scale,1), sxz=N(a.sxz,1), sy=N(a.sy,1);
    const inner=p.clone(true);
    inner.scale.set(sc*sxz, sc*sy, sc*sxz);
    inner.rotation.set(a.rx||0, a.ry||0, a.rz||0);
    inner.position.set(a.ox||0, a.oy||0, a.oz||0);
    const wrap=new THREE.Group(); wrap.add(inner);
    // 실제 바운딩박스로 원점 중심 + 최대치수 1로 자동 맞춤(얇은 줄기도 항상 화면에)
    const box=new THREE.Box3().setFromObject(wrap), size=new THREE.Vector3(), ctr=new THREE.Vector3();
    box.getSize(size); box.getCenter(ctr);
    const md=Math.max(size.x,size.y,size.z)||1;
    wrap.position.sub(ctr);                                // 중심을 원점으로
    const holder=new THREE.Group(); holder.add(wrap); holder.scale.setScalar(0.9/md);
    prevObj=holder; prevScene.add(prevObj);
  }catch(e){ console.warn('[preview] 렌더 실패:', key, e); }
}

// 설명 말풍선 — 제목에 마우스를 올리면 커서 옆에 뜬다.
function attachHelp(el, key){
  const txt=HELP[key]; if(!txt) return;
  el.classList.add('hashelp');
  el.addEventListener('mouseenter', e=>showHelp(txt, e));
  el.addEventListener('mousemove', e=>moveHelp(e));
  el.addEventListener('mouseleave', hideHelp);
}
let helpEl=null;
function showHelp(txt, e){
  if(!helpEl){ helpEl=document.createElement('div'); helpEl.id='helpTip'; document.body.appendChild(helpEl); }
  helpEl.textContent=txt; helpEl.style.display='block'; moveHelp(e);
}
function moveHelp(e){
  if(!helpEl) return;
  const w=helpEl.offsetWidth, hh=helpEl.offsetHeight;
  let x=e.clientX-w-16, y=e.clientY+14;              // 패널이 오른쪽이라 왼쪽에 띄운다
  if(x<8) x=e.clientX+16;
  if(y+hh>window.innerHeight-8) y=e.clientY-hh-12;
  helpEl.style.left=x+'px'; helpEl.style.top=y+'px';
}
function hideHelp(){ if(helpEl) helpEl.style.display='none'; }

function buildShapePanel(){
  const box=document.getElementById('shapeSliders'); if(!box) return; box.innerHTML='';
  SHAPE_GROUPS.forEach(gr=>{
    const d=document.createElement('details'); d.open=!!gr.open; d.className='sgrp';
    const sum=document.createElement('summary'); sum.textContent=gr.t; d.appendChild(sum);
    gr.items.forEach(it=>{
      const f=document.createElement('div'); f.className='field';
      const lab=document.createElement('label'); lab.innerHTML=`${it.t} <b>${fmtVal(P[it.k])}</b>`;
      attachHelp(lab, it.k);
      const inp=document.createElement('input'); inp.type='range'; inp.min=it.min; inp.max=it.max; inp.step=it.step; inp.value=P[it.k];
      inp.addEventListener('input',()=>{ P[it.k]=+inp.value; lab.querySelector('b').textContent=fmtVal(P[it.k]); buildPlant(); });
      f.appendChild(lab); f.appendChild(inp); d.appendChild(f);
    });
    box.appendChild(d);
  });
}
function fmtVal(v){ return Math.round(v*1000)/1000; }
function buildGlobalPanel(){
  const box=document.getElementById('tab-global'); if(!box) return; box.innerHTML='';
  PARAM_DEFS.forEach(sec=>{
    const h=document.createElement('div'); h.className='psec'; h.textContent=sec.sec; box.appendChild(h);
    sec.items.forEach(it=>{
      const f=document.createElement('div'); f.className='field';
      const lab=document.createElement('label'); lab.innerHTML=`${it.t} <b>${fmtVal(P[it.k])}</b>`;
      const inp=document.createElement('input'); inp.type='range'; inp.min=it.min; inp.max=it.max; inp.step=it.step; inp.value=P[it.k];
      inp.addEventListener('input',()=>{ P[it.k]=+inp.value; lab.querySelector('b').textContent=fmtVal(P[it.k]); buildPlant(); });
      f.appendChild(lab); f.appendChild(inp); box.appendChild(f);
    });
  });
}
function updateSun(){ if(!sunMarker) return; const R=2.3; sunMarker.position.set(Math.sin(LIGHT_AZ)*R, 1.5, Math.cos(LIGHT_AZ)*R); }
function animate(){ requestAnimationFrame(animate); if(autoRotate){ orbit.az+=0.004; updateCam(); } renderer.render(scene,cam);
  if(prevObj&&prevR){ prevObj.rotation.y+=0.012; prevR.render(prevScene,prevCam); } }

init(); updateCam();
</script>

// 줄기 방향 기준 직교 기저 → az 방향의 "옆으로" 벡터
function stemFrame(stemDir, az){
  const up=(stemDir?stemDir.clone():new THREE.Vector3(0,1,0)).normalize();
  const ref=Math.abs(up.y)>0.9? new THREE.Vector3(1,0,0) : new THREE.Vector3(0,1,0);
  const x=new THREE.Vector3().crossVectors(ref, up).normalize();
  const z=new THREE.Vector3().crossVectors(up, x).normalize();
  const side=x.multiplyScalar(Math.cos(az)).addScaledVector(z, Math.sin(az)).normalize();
  return {up, side};
}
// ★잎자루 방향 = 줄기 방향에서 tilt만큼만 벌림. tilt=0이면 줄기와 완전히 같은 축 = "딱 꽂힘".
//   바깥으로 휘는 모양은 잎 GLB 자체의 곡선이 만들어 준다.
function leafDir(stemDir, az, tilt){
  const f=stemFrame(stemDir, az);
  return f.up.clone().multiplyScalar(Math.cos(tilt)).addScaledVector(f.side, Math.sin(tilt)).normalize();
}
// 줄기축 둘레 방위(az) + 벌어짐(tilt)을 훑어 기존 잎과 안 겹치는 쪽을 고름.
const AIM_AZ=[0,15,-15,30,-30,45,-45,60,-60,75,-75,90,-90,105,-105,120,-120,135,-135,150,-150,165,-165,180].map(a=>a*Math.PI/180);
// 겹침 회피가 방위(az)뿐 아니라 '벌어짐 각(tilt)'까지 바꾸면, 조절기로 맞춘 잎 각도가
// 줄기마다 달라 보인다. leafTiltVary=0 이면 각도를 완전히 고정하고 방위만으로 피한다.
const AIM_TILT_BASE=[0,0.16,-0.12,0.32,-0.22];
// 점 ↔ 선분 최단거리(줄기를 캡슐로 보고 검사)
function segDist(p, a, b){
  const ab=b.clone().sub(a), L2=ab.lengthSq();
  const t=L2<1e-12?0:Math.max(0,Math.min(1, p.clone().sub(a).dot(ab)/L2));
  return p.distanceTo(a.clone().addScaledVector(ab,t));
}
// 잎몸의 실제 반폭(높이1 정규화 폭 x 크기 x 에셋별 조정) — 선이 아니라 '판'으로 보기 위함
function leafHalfW(key, size){
  const u=(ASSETS[key]&&ASSETS[key].userData)||{}, a=adjOf(key), N=(v,d)=>v==null?d:v;
  const w=Math.max(u.sx||0.9, u.sz||0.9)/2;
  return size*w*N(a.scale,1)*N(a.sxz,1);
}
// ★잎몸이 실제로 놓이는 자리. addLeaf의 변환(ADJ 스케일→회전→오프셋 → size → ld정렬 → holder)을
//   그대로 재현한다. 예전엔 d/side로 어림잡아, 조절기로 준 큰 회전(최대 22도)만큼 어긋난 자리를 검사했다.
const _UP=new THREE.Vector3(0,1,0);
function leafBladeCenter(nodePos, stemDir, az, tilt, size, key){
  const a=adjOf(key), N=(v,d)=>v==null?d:v;
  const u=(ASSETS[key]&&ASSETS[key].userData)||{};
  const sc=N(a.scale,1), sxz=N(a.sxz,1), sy=N(a.sy,1);
  const c=new THREE.Vector3((u.cx||0)*sc*sxz, (u.cy==null?0.5:u.cy)*sc*sy, (u.cz||0)*sc*sxz);
  c.applyEuler(new THREE.Euler(N(a.rx,0), N(a.ry,0), N(a.rz,0)));        // ADJ 회전
  // ★ADJ 오프셋은 일부러 빼둔다. 오프셋을 조금만 움직여도 잎몸 예상 위치가 바뀌어
  //   freeAim의 방위 순위가 뒤집히고, 결과적으로 잎이 통째로 회전해 버린다.
  //   (오프셋 기여는 잎 크기의 몇 %라 충돌 정확도 손실은 작다. 회전에 큰 영향을 주는
  //    ADJ 회전은 위에서 그대로 반영한다.)
  c.multiplyScalar(size);
  const ld=new THREE.Vector3(Math.sin(tilt), Math.cos(tilt), 0);
  c.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(_UP, ld)); // 잎자루 방향 정렬
  c.addScaledVector(ld, -P.leafEmbed*(0.4+size)*P.petioleLen);           // 줄기에 박히는 만큼
  const qh=new THREE.Quaternion().setFromUnitVectors(_UP,(stemDir||_UP).clone().normalize());
  qh.multiply(new THREE.Quaternion().setFromAxisAngle(_UP, az));         // holder: 줄기축 + az 회전
  return c.applyQuaternion(qh).add(nodePos);
}
function freeAim(nodePos, stemDir, az0, tilt0, size, leafKey, ownAx){
  const R=size*P.leafClear;                                      // 잎끼리 비켜서는 반경
  // ★A1: 잎몸을 '구'(반지름=실제 반폭)로, 잎자루를 '캡슐'로 보고 줄기와 판정.
  //   기존엔 잎을 축 위 3점으로만 봐서 실제 폭의 1/4~1/5만 검사했다(잎몸이 줄기를 덮어버림).
  const bladeR=leafKey? leafHalfW(leafKey,size) : size*0.45;
  const reach=size*1.3+bladeR, near=[];
  if(P.leafStemClear>0.001){
    for(const st of STEMS){
      const mid=st.a.clone().add(st.b).multiplyScalar(0.5);
      // ★자기가 매달린 줄기의 끝 두 마디는 제외 — 안 그러면 어느 방향으로 돌려도
      //   자기 줄기와 겹침으로 계산돼 모든 후보 점수가 똑같이 나빠지고 회피가 무력해진다.
      if(ownAx && st.ax===ownAx && st.i>=st.n-2) continue;
      if(mid.distanceTo(nodePos) < reach+st.r+0.2) near.push(st);
    }
  }
  const selfR=size*0.28;                                         // 자기가 붙은 자리는 무시
  const clearOf=(d,c)=>{
    if(!near.length) return 1e9;
    let mn=1e9;
    for(const st of near){
      const dBlade=segDist(c, st.a, st.b) - st.r - bladeR;        // 잎몸(구) ↔ 줄기(캡슐)
      if(dBlade<mn) mn=dBlade;
      for(const f of [0.5,0.8]){                                  // 잎자루(캡슐) 몇 점
        const q=nodePos.clone().addScaledVector(d, size*f);
        if(q.distanceTo(nodePos)<selfR) continue;
        const dp=segDist(q, st.a, st.b) - st.r - size*0.05;
        if(dp<mn) mn=dp;
      }
    }
    return mn;
  };
  let best=null, bestScore=-1e9;
  const AIM_TILT=(P.leafTiltVary>0.001)? AIM_TILT_BASE.map(v=>v*P.leafTiltVary) : [0];
  for(const dt of AIM_TILT) for(const da of AIM_AZ){
    const az=az0+da, tilt=Math.max(0, Math.min(1.2, tilt0+dt));
    const d=leafDir(stemDir, az, tilt);
    const c=leafKey? leafBladeCenter(nodePos, stemDir, az, tilt, size, leafKey)
                    : nodePos.clone().addScaledVector(d, size*0.55);   // ★실제 잎몸 자리
    let gap=1e9;
    for(const pl of PLACED) gap=Math.min(gap, c.distanceTo(pl.c)-(pl.r+R));
    const sg=clearOf(d,c);
    if(gap>1e8 && sg>1e8) return {d, c, r:R, az, tilt};
    const score=Math.min(gap,0.25) + P.leafStemClear*Math.min(sg,0.12)
                - 0.10*Math.abs(da)/Math.PI - 0.10*Math.abs(dt);
    if(score>bestScore){ bestScore=score; best={d, c, r:R, az, tilt}; }
  }
  return best;
}
// 잎: 마디에서 방위 az + 성숙도별 처짐 방향으로. key=쓸 GLB. 잎자루 끝이 마디에 살짝 파고들게.
function addLeaf(nodePos, az, maturity, key, sizeOverride, stemDir, stemRad, ownAx){
  const size=((sizeOverride!=null)?sizeOverride:leafSize(maturity))*PLANT_GROW;   // 단계별 곡선 x 전체 성장 배율
  const tilt=P.leafTilt + maturity*P.elevDrop*0.5;              // 줄기축에서 벌어지는 각(성숙할수록 조금 더)
  const aim=freeAim(nodePos, stemDir, az, tilt, size, key, ownAx);
  const d=aim.d;
  PLACED.push({c:aim.c, r:aim.r});                              // 자리 점유 등록(다음 잎이 피해감)
  // ★음수 = 잎자루 끝을 줄기 속으로 박아 붙임(잎 GLB에 잎자루가 포함돼 있으므로 틈이 생기면 안 됨)
  const reach=-P.leafEmbed*(0.4+size)*P.petioleLen;
  const base=nodePos.clone().addScaledVector(d, reach);
  // ★잎 + 엽초를 하나의 holder에 담아 "세트"로 취급 → 같이 회전·이동하며 절대 어긋나지 않음
  const UP=new THREE.Vector3(0,1,0);
  const holder=new THREE.Group();
  holder.position.copy(nodePos);
  holder.quaternion.setFromUnitVectors(UP, (stemDir||UP).clone().normalize());   // 로컬 +Y = 줄기축(관통선)
  holder.rotateY(aim.az);                                      // ← 관통선 기준 회전
  holder.userData.assetKey=key;                               // 클릭해서 이름을 알아보려고 남긴다
  const ld=new THREE.Vector3(Math.sin(aim.tilt), Math.cos(aim.tilt), 0);   // 로컬 잎자루 방향
  if(stemRad) addSheathLocal(holder, ld, stemRad, size, key);  // 엽초도 같은 프레임 안에
  addPetiole(nodePos, d, size, maturity, base);                // (기본 off)
  const proto=assetInst(key);
  if(proto){
    proto.scale.multiplyScalar(size);
    proto.quaternion.setFromUnitVectors(UP, ld);
    proto.position.copy(ld).multiplyScalar(reach);
    const fade=ownAx? leafFadeOf(ownAx.leafBirth) : 0;                   // 생존선 아래에서 바랜 정도
    if(!KEEP_TEX.has(key)) tintObj(proto, leafTint(maturity, fade));     // 잎만 잎색(엽초는 줄기색 유지)
    else if(fade>0)        fadeObj(proto, fade);                        // 무늬는 덮지 않고 곱해서 바래게
    // ★무늬종(알보 등)은 텍스처가 무늬 그 자체 → 아예 틴트하지 않고 원본 그대로 쓴다
    holder.add(proto); plantGroup.add(holder); return; }
  plantGroup.add(holder);
  // 폴백: 임시 원뿔
  const type=/mature/.test(key)?2:/mid/.test(key)?1:0;
  const m=makeLeaf(type), pivot=new THREE.Group(); pivot.position.copy(base); pivot.rotation.y=az;
  m.rotation.x=0.5+maturity*0.7; m.scale.setScalar(size); pivot.add(m); plantGroup.add(pivot);
}
// 새순: 갓 난 성장점(줄기 끝을 이어 거의 곧게 위). furled → opening → (young 잎)
function addBud(nodePos, az, kind, size, stemDir, stemRad){
  const UP=new THREE.Vector3(0,1,0), key=leafKindKey(kind);
  const tilt=P.leafTilt*0.4;                                   // 새순은 잎보다 더 곧게
  // ★잎과 동일한 구조: holder(줄기축 관통선) 안에 엽초+새순을 함께 → 세트로 회전·이동
  const holder=new THREE.Group();
  holder.position.copy(nodePos);
  holder.quaternion.setFromUnitVectors(UP, (stemDir||UP).clone().normalize());
  holder.rotateY(az);
  const ld=new THREE.Vector3(Math.sin(tilt), Math.cos(tilt), 0);
  if(stemRad) addSheathLocal(holder, ld, stemRad, size, key);   // 새순/반잎 각각의 엽초
  const embed = kind==='furled'? 0.24*size : 0.12*size;         // 말린 새순은 줄기에 깊이 박히게
  const wd=ld.clone().applyQuaternion(holder.quaternion);
  PLACED.push({c:nodePos.clone().addScaledVector(wd, size*0.5), r:size*0.4});
  const proto=assetInst(key);
  holder.userData.assetKey=key;
  if(proto){
    proto.scale.multiplyScalar(size);
    proto.quaternion.setFromUnitVectors(UP, ld);
    proto.position.copy(ld).multiplyScalar(-embed);
    tintObj(proto, budTint()); holder.add(proto);
  } else {
    const m=new THREE.Mesh(new THREE.ConeGeometry(0.05,0.14,8), MAT.stem);
    m.position.y+=size*0.5; holder.add(m);
  }
  plantGroup.add(holder);
}
// ===== 잎자루 색 =====
// 엽초를 그 잎과 같은 색으로 칠하려고, 잎 텍스처에서 잎자루 부분의 평균색을 뽑는다.
// 무늬종은 텍스처가 곧 무늬라 건드리면 안 되므로 '읽기만' 한다. 결과는 캐시.
const PET_COLOR={};
function leafPetColor(key){
  if(key in PET_COLOR) return PET_COLOR[key];
  PET_COLOR[key]=null;                                  // 실패해도 매 프레임 다시 시도하지 않게 먼저 박아둔다
  const proto=ASSETS[key]; if(!proto) return null;
  try{
    proto.updateMatrixWorld(true);
    const inv=new THREE.Matrix4().copy(proto.matrixWorld).invert();
    const v=new THREE.Vector3(), parts=[];
    let mnY=Infinity, mxY=-Infinity;
    proto.traverse(o=>{
      if(!(o.isMesh && o.geometry && o.geometry.attributes.position && o.geometry.attributes.uv)) return;
      const m=new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld);
      const pa=o.geometry.attributes.position, ua=o.geometry.attributes.uv;
      const ys=new Float32Array(pa.count);
      for(let i=0;i<pa.count;i++){
        v.set(pa.getX(i),pa.getY(i),pa.getZ(i)).applyMatrix4(m); ys[i]=v.y;
        if(v.y<mnY)mnY=v.y; if(v.y>mxY)mxY=v.y;
      }
      const tex=(o.material&&o.material.map)||null;
      if(tex&&tex.image) parts.push({ys,ua,img:tex.image});
    });
    if(!parts.length) return null;
    const hgt=(mxY-mnY)||1, yCut=mnY+hgt*0.25;            // 아래 25% = 잎자루 구간
    const cv=document.createElement('canvas'), ctx=cv.getContext('2d');
    let r=0,g=0,b=0,n=0,drawn=null;
    for(const pt of parts){
      const im=pt.img, W=im.width||0, H=im.height||0;
      if(!W||!H) continue;
      if(drawn!==im){ cv.width=W; cv.height=H; ctx.drawImage(im,0,0); drawn=im; }
      const step=Math.max(1, Math.floor(pt.ys.length/240));   // 표본 240점이면 충분
      for(let i=0;i<pt.ys.length;i+=step){
        if(pt.ys[i]>yCut) continue;
        let u=pt.ua.getX(i), w=pt.ua.getY(i);
        u-=Math.floor(u); w-=Math.floor(w);
        const px=Math.min(W-1, Math.max(0, Math.round(u*(W-1))));
        const py=Math.min(H-1, Math.max(0, Math.round((1-w)*(H-1))));
        const d=ctx.getImageData(px,py,1,1).data;
        if(d[3]<128) continue;
        r+=d[0]; g+=d[1]; b+=d[2]; n++;
      }
    }
    if(!n) return null;
    // 캔버스 값은 sRGB, 재질 색은 선형이라 변환해 준다
    PET_COLOR[key]=new THREE.Color(r/n/255, g/n/255, b/n/255).convertSRGBToLinear();
    return PET_COLOR[key];
  }catch(e){ console.warn('잎자루 색 추출 실패', key, e); return null; }
}
// 무늬종만 텍스처 색을 쓴다. 기본잎은 코드가 그루 색으로 덧칠하므로,
// 텍스처에서 뽑은 색을 쓰면 화면에 보이는 잎 색과 어긋난다.
function petColorOf(key){ return KEEP_TEX.has(key)? leafPetColor(key) : null; }
// 잎 단계별로 어떤 에셋을 쓸지 — 줄기 끝 색을 맞추려면 잎을 그리기 전에 알아야 한다.
/* ★ 무늬 키를 **고르기만** 하는 것이 아니라, 없으면 그 자리에서 받아 오라고 시킨다
     (§ensureSkin · 2026-08-17). 받는 동안은 기본잎으로 그려지고, 도착하면 다시 그린다.
   ⚠ 「없으면 기본잎」이라는 예전 규칙은 한 글자도 안 바뀌었다 — 그 아래에 한 줄을 더했을 뿐이다. */
function wantSkin(k){ if(!ASSETS[k]) ensureSkin(k); return !!ASSETS[k]; }
function pickLeafKey(m, midType, canMature, varie, alboMid, matRoll){
  if(m<0.22) return null;                                          // 새순 단계는 잎 에셋이 아니다
  if(m<P.stageYoung) return (varie&&wantSkin('leaf_young_albo'))?'leaf_young_albo':'leaf_young';
  if(m<P.stageMid || !canMature){
    if(varie){ const n=P.alboMidPick>0? Math.round(P.alboMidPick) : (alboMid||1);
      const k='leaf_mid_albo'+Math.max(1,Math.min(ALBO_MID_MAX,n));
      if(wantSkin(k)) return k; }
    return (midType||'leaf_mid1');
  }
  if(varie){ const n=P.matAlboPick>0? Math.round(P.matAlboPick) : matFromMid(alboMid, matRoll);
    if(n>0){ const k='leaf_mat'+Math.max(1,Math.min(MAT_ALBO_MAX,n)); if(wantSkin(k)) return k; } }
  return 'leaf_mature';
}
// 잎 병렬 성숙: furled → opening2 → young → mid(1|2) → mature (m=0..1)
function drawLeafStage(pos, az, m, midType, canMature, stemDir, stemRad, varie, ownAx, alboMid, matRoll){
  if(m<0.10){ addBud(pos, az, 'furled',  P.budSize*(0.6+m*3), stemDir, stemRad); return; }
  if(m<0.22){ addBud(pos, az, 'opening', P.budSize*(1.0+m), stemDir, stemRad); return; }
  let key;
  if(m<P.stageYoung) key=(varie&&wantSkin('leaf_young_albo'))?'leaf_young_albo':'leaf_young';   // 어린 통잎(변이면 알보)
  else if(m<P.stageMid || !canMature){
    // 변이 잎은 중간 단계도 알보로(캐논: 한번 정해지면 변이 루트 유지)
    if(varie){ const n=P.alboMidPick>0? Math.round(P.alboMidPick) : (alboMid||1);
      key='leaf_mid_albo'+Math.max(1,Math.min(ALBO_MID_MAX,n));
      if(!wantSkin(key)) key=(midType||'leaf_mid1'); }
    else key=(midType||'leaf_mid1');                               // 보통은 중간잎에서 정착
  }
  else {
    // ★캐논: 변이로 정해진 잎은 성숙까지 변이 루트를 유지한다(중기와 같은 규칙).
    //   어느 무늬가 나올지는 축마다 미리 뽑아둔 matAlbo. 중기 무늬와의 대응 규칙은 아직 미정.
    key='leaf_mature';
    if(varie){ const n=P.matAlboPick>0? Math.round(P.matAlboPick) : matFromMid(alboMid, matRoll);
      if(n>0){ const k2='leaf_mat'+Math.max(1,Math.min(MAT_ALBO_MAX,n)); if(wantSkin(k2)) key=k2; } }
  }
  addLeaf(pos, az, m, key, null, stemDir, stemRad, ownAx);
}

/* ===== 실제 일수 ↔ 생장 나이 ==================================================
   ★★ 2026-08-09 박사님 확정 — **잎 간격표가 이 변환을 정한다.**
   원문: "1장 자랄 때랑 2장째 자랄 때랑 … 기본 필요 일수를 점점 늘리는 방향으로.
          처음 30 그다음 40 그다음 50 그다음 70 그다음 100 150 200 300"

   ⚠⚠ 여기가 「전역 생장 곡선은 한 글자도 안 건드린다」(아래 1295줄 · growth_tuning.json
      growth_speed._doc)의 **명시된 예외**다. 박사님이 이번에 바꾸라고 하신 자리라서 바뀐 것이고,
      되돌리려면 growth_tuning.json 의 leaf_interval 을 지우면 옛 timeCurve 곡선으로 돌아간다.
      ⇒ 사고로 알고 되돌리지 말 것.

   ★ 마디 격자(seedEnd·spawnStep·matSpan·stageYoung·petGrow·bumpGrow)는 **한 글자도 안 고쳤다.**
     바뀐 것은 「생장나이 축을 며칠에 걸쳐 걷는가」뿐이다.

   ══ 어떻게 맞추나 ══
   잎 한 장 = 생장점(축) 하나다. 그 축들이 나는 **생장나이**는 axisTimeline 이 이미 알고 있다
   (지금 값으로 36 · 136 · 256 · 376 … = 첫 잎 뒤로 120 씩). 그러니 새 숫자를 만들 필요가 없다 —
   **그 나이들이 표가 말하는 날에 오도록 시간 축만 잡아당긴다.**
     (0, 0) · (30, 36) · (70, 136) · (120, 256) · (190, 376) · … 를 지나는 꺾은선이 그것이다.
   표를 다 쓴 뒤(9번째 잎부터)는 마지막 간격 × tail_mult 로 같은 기울기를 이어 간다.

   ⚠ 표가 없거나 모양이 틀리면 **옛 거듭제곱 곡선(timeCurve)** 으로 돈다 — 조용히 멈추지 않는다. */
let LEAF_DAYS=[30,40,50,70,100,150,200,300];   // 정본은 data/growth_tuning.json · leaf_interval.days
let LEAF_TAIL_MULT=1.5;
let _leafMapKey=null, _leafMap=null;
/* 꺾은선의 꼭짓점 [실제일, 생장나이] 목록. 격자(P)나 표가 바뀌면 다시 세운다. */
function leafDayMap(){
  const days=LEAF_DAYS;
  if(!Array.isArray(days) || days.length<1) return null;
  const key=days.join(',')+'|'+LEAF_TAIL_MULT+'|'+P.seedEnd+'|'+P.spawnStep+'|'+P.matSpan+'|'
           +P.stageYoung+'|'+P.petGrow+'|'+P.bumpGrow+'|'+P.stemTrans+'|'+P.maxLeaves;
  if(_leafMapKey===key) return _leafMap;
  // 표 검사 — 양수 · 유한. 하나라도 어긋나면 옛 곡선으로 물러난다(조용히 틀린 값으로 안 돈다).
  for(const v of days) if(!(typeof v==='number' && isFinite(v) && v>0)){ _leafMapKey=key; return (_leafMap=null); }
  // 잎이 나는 생장나이 — axisTimeline 이 정본이다. 여기서 120 같은 숫자를 새로 만들지 않는다.
  const need=days.length;
  const span=P.seedEnd+P.petGrow+(P.matSpan+3*Math.max(1,P.spawnStep))*(need+2);
  const ages=axisTimeline(span).map(a=>a.leafBirth).filter(v=>isFinite(v)&&v>0).sort((a,b)=>a-b);
  if(ages.length<need){ _leafMapKey=key; return (_leafMap=null); }
  const pts=[[0,0]];
  let day=0;
  for(let i=0;i<need;i++){
    day+=days[i];
    const age=ages[i];
    if(!(age>pts[pts.length-1][1]) || !(day>pts[pts.length-1][0])){ _leafMapKey=key; return (_leafMap=null); }
    pts.push([day, age]);
  }
  const last=pts[pts.length-1], prev=pts[pts.length-2];
  const tailDays=Math.max(1e-6, days[need-1]*(LEAF_TAIL_MULT>0?LEAF_TAIL_MULT:1));
  // 표 밖의 기울기 — 「다음 잎 한 장」이 tailDays 걸린다고 보고 그 기울기를 그대로 편다.
  const tail=(last[1]-prev[1])/tailDays;
  _leafMapKey=key;
  return (_leafMap={pts, tail:tail>0?tail:1e-6});
}
function ageOf(d){
  if(d<=0) return 0;
  const dd=Math.min(d, GMAX);
  const m=leafDayMap();
  if(!m){ const k=P.timeCurve||1; if(k===1) return dd;
    return GMAX*Math.pow(Math.min(1,dd/GMAX), k); }
  const p=m.pts;
  for(let i=1;i<p.length;i++)
    if(dd<=p[i][0]) return p[i-1][1]+(p[i][1]-p[i-1][1])*(dd-p[i-1][0])/(p[i][0]-p[i-1][0]);
  const last=p[p.length-1];
  return last[1]+(dd-last[0])*m.tail;
}
function clearGroup(g){ while(g.children.length){ const c=g.children[0]; g.remove(c); c.traverse&&c.traverse(o=>{ if(o.isMesh){ if(o.geometry) o.geometry.dispose();
  const ms=Array.isArray(o.material)?o.material:[o.material]; ms.forEach(m=>{ if(m&&m.userData&&m.userData.cloned) m.dispose(); }); } }); } }

// ===== 마디 트리 시뮬 — 형태의 정본 =====
// buildPlant 이 그리기 전에 돌리던 그 루프를 **한 글자도 안 고치고** 여기로 옮겼다.
// 옮긴 이유 하나뿐이다 — 삽수(cuttableNodes)가 "실제 자란 것"을 읽으려면 3D 없이도
// 같은 트리가 나와야 하는데, buildPlant 는 그리기와 한 몸이라 3D 없이 못 돈다.
// ⚠ 난수를 여기서 쓴다. 부르는 쪽이 rng=mulberry32(SEED) 로 스트림을 먼저 맞춰야 한다.
//   그래야 같은 시드·같은 날이면 같은 트리가 나온다(buildPlant 이 하던 그대로다).
function growTopology(g){
    // ===== 정밀 생장 (순서도 #0~#16 데이터 그대로) =====
    //  ① 생장점(TIP)은 고정된 하나. ★잎도 그 자리에 하나뿐이고, "그 잎이" 새순→반잎→어린→중간→(랜덤)성숙 으로 자란다.
    //  ② 새 마디는 TIP "아래"에 삽입된다(growUp). 그래서 줄기가 밑에서 길어지고 생장점(잎)은 위로 밀려 올라간다.
    //  ③ 마디는 삽입 후 시간이 지나면 아래(오래된 것)부터 줄기_초기 → 줄기_중기(=분홍 예비혹, 중기_1/2 50:50).
    //  ④ ★혹은 무조건 1개씩. "어떤 생장점의 잎이 중간잎이 되는 순간" 예비혹 후보 중 랜덤 딱 1개만 혹이 된다.
    //     그 혹에서 난 가지의 새순이 다시 중간잎이 되어야 그 다음 혹이 랜덤 발생. (다발성 X)
    const L=LIGHT_AZ, ld=new THREE.Vector3(Math.sin(L),0,Math.cos(L));   // 빛 방향(수평)
    const t0=P.seedEnd, STEP=Math.max(1,P.spawnStep);
    const M_MID=P.stageYoung;                                            // 중간잎 시작(drawLeafStage 기준과 동일)
    const axes=[];
    // 축 = 생장점 하나. 잎 1개(leafBirth부터 성숙) + 그 아래로 쌓이는 마디들(segs)
    const mkAxis=(from,dir,birth)=>{
      const d0=dir.clone().normalize();
      // ★축마다 "일정한 방향으로 휘는 아치"를 하나 정해 둔다. 매 마디 랜덤(백색잡음)은 서로 상쇄돼
      //   곡선이 안 생기고 떨리기만 하므로, 방향을 고정해야 자연스러운 곡선이 누적된다.
      const ref=Math.abs(d0.y)>0.9? new THREE.Vector3(1,0,0) : new THREE.Vector3(0,1,0);
      const cx=new THREE.Vector3().crossVectors(ref,d0).normalize();
      const cz=new THREE.Vector3().crossVectors(d0,cx).normalize();
      const ca=rng()*Math.PI*2;
      const curveDir=cx.multiplyScalar(Math.cos(ca)).addScaledVector(cz, Math.sin(ca)).normalize();
      const ax={from, dir:d0, birth, leafBirth:birth+P.petGrow, segs:[], simTip:null, midType:null,
                // ★성숙 여부는 여기서 굴리지 않는다. 다시 그릴 때마다 빛으로 재판정하면
                //   과거의 잎이 소급해서 갈라지거나 도로 돌아간다 — MAT_STATE 가 기억한다.
                az:rng()*Math.PI*2, canMature:matureOf(birth+P.petGrow),
                triggered:false, grew:false,
                // ★캐논: 변이는 어린잎 단계에서 확률로 결정 — **그 잎이 처음 생길 때 한 번만** 굴린다.
                //   rng() 은 예전과 똑같이 여기서 한 번 뽑는다(스트림 불변). 판정만 VARIE_STATE 가 기억한다.
                varie:varieRoll(birth+P.petGrow, rng()),
                alboMid:ALBO_MID_POOL[Math.floor(rng()*ALBO_MID_POOL.length)],   // 이 잎이 쓸 알보 중기 종류
                matRoll:rng(),                             // 성숙 무늬 추첨값(트리에서 주/부/희귀를 가른다)
                matAlbo:MAT_ALBO_POOL.length? MAT_ALBO_POOL[Math.floor(rng()*MAT_ALBO_POOL.length)] : 0,   // 성숙까지 갔을 때 쓸 변이 종류
                midPick:(rng()<0.5?'leaf_mid1':'leaf_mid2'),  // 잎마다 랜덤(midMix로 개체고정과 섞음)
                curveDir, curveAmt:0.55+rng()*0.9};        // 개체마다 휘는 정도가 조금씩 다르게
      ax.midType=(rng()<P.midMix)? ax.midPick : PLANT_MID;   // midMix=0 개체 1종 고정 / 1 잎마다 랜덤
      ax.simTip=from? null : new THREE.Vector3(0,SOIL_Y,0);   // 곁가지는 첫 마디 때 부모 위치에서 계산
      axes.push(ax); return ax; };
    const SIM_SEGS=[];                                          // 시뮬 중 생긴 줄기(조향 판단용)
    const addSeg=(ax,T)=>{
      // ★앞 마디 방향을 이어받아 조금씩만 틀기 → 마디 경계가 꺾여 어긋나 보이지 않음
      const prev=ax.segs.length? ax.segs[ax.segs.length-1].dir : ax.dir;
      const k=ax.segs.length;
      if(!ax.simTip) ax.simTip=axBase(ax, 1e9).clone();          // 곁가지: 부모의 혹 위치(다 자란 기준)
      const len0=P.internode*(0.92+rng()*0.16);   // 길이 배율은 렌더 시 PLANT_GROW로 적용
      const droop=P.stemDroop*Math.min(1, k/Math.max(1,P.maxLeaves*0.7));   // 길어질수록 무게로 아래로
      // ★①생장 시 조향: 앞으로 갈 자리에 다른 줄기가 있으면 그 반대쪽으로 조금 튼다(접촉굴성)
      const away=new THREE.Vector3();
      if(P.avoidLean>0.001 && SIM_SEGS.length){
        const probe=ax.simTip.clone().addScaledVector(prev, len0*1.6*PLANT_GROW);
        const RAD=P.avoidRange;
        for(const sg of SIM_SEGS){
          if(sg.ax===ax || sg.ax===(ax.from&&ax.from.ax)) continue;   // 자기 축·부모 축은 제외
          const v=probe.clone().sub(sg.p); const dd=v.length();
          if(dd<1e-4 || dd>RAD) continue;
          away.addScaledVector(v.multiplyScalar(1/dd), (RAD-dd)/RAD);
        }
        if(away.lengthSq()>1e-9){ away.y*=0.35; away.normalize(); }      // 옆으로 피하되 위로는 덜
      }
      const dir=prev.clone().lerp(ax.dir, P.stemStraight)                   // 곧게 서려는 힘
        .addScaledVector(ld, PHOTO*P.photoLean)                             // 빛 쪽
        .addScaledVector(ax.curveDir, P.stemCurve*ax.curveAmt)              // 일정 방향 아치(누적)
        .addScaledVector(away, P.avoidLean)                                 // ★다른 줄기 피하기
        .addScaledVector(new THREE.Vector3(0,-1,0), droop)                  // 무게 처짐
        .add(new THREE.Vector3((rng()-0.5)*P.spread,0,(rng()-0.5)*P.spread)).normalize();
      ax.segs.push({dir, len:len0, birth:T, activated:false,
                    az:ax.az+k*GOLDEN});
      ax.simTip=ax.simTip.clone().addScaledVector(dir, len0*PLANT_GROW);
      SIM_SEGS.push({ax, p:ax.simTip.clone()}); };                 // 마디마다 방위(황금각) → 혹·가지가 각기 다른 쪽
    const leafM=(ax,T)=>Math.max(0, Math.min(1,(T-ax.leafBirth)/P.matSpan));   // 그 축의 잎 성숙도
    // 축 시작점 — ★가지는 부모 "혹 마디의 돌기 위치"(마디 끝이 아니라 중간)에서 남
    const axBase=(ax,T)=>{
      if(!ax.from) return new THREE.Vector3(0,SOIL_Y,0);
      const p=axBase(ax.from.ax,T), pa=ax.from.ax;
      // ★PLANT_GROW를 반드시 함께 곱할 것. 줄기는 배율만큼 길어지는데 여기서 빠뜨리면
      //   가지가 부모 줄기의 '혹'이 아니라 훨씬 아래에서 나와 잎이 줄기 중간에 박힌 것처럼 보인다.
      for(let i=0;i<ax.from.idx && i<pa.segs.length;i++){ const s=pa.segs[i]; if(s.birth>T) break;
        p.addScaledVector(s.dir, s.len*Math.min(1,(T-s.birth)/Math.max(1,P.petGrow))*PLANT_GROW); }
      const b=pa.segs[ax.from.idx];                                      // 혹 마디: 돌기(bumpAt) 지점까지만
      if(b && b.birth<=T) p.addScaledVector(b.dir, b.len*Math.min(1,(T-b.birth)/Math.max(1,P.petGrow))*PLANT_GROW*P.bumpAt);
      return p; };
    mkAxis(null, new THREE.Vector3((rng()-0.5)*0.10,1,(rng()-0.5)*0.10).normalize(), t0);
    for(let T=t0; T<=g+1e-6; T+=STEP){
      // ④ ★잎이 중간잎이 된 생장점이 있으면 → 그때 딱 하나의 마디만 혹으로
      //    (마디 추가보다 먼저 판정해야 "줄기 2개일 때 중간잎" 상태에서 혹이 생김)
      const trig=axes.find(ax=>!ax.triggered && leafM(ax,T)>=M_MID);
      if(trig){
        trig.triggered=true;                                             // 이 잎의 트리거는 1회만
        axes.forEach(a=>a.grew=false);                                   // 새 사이클 시작 → 각 줄기가 1마디씩 더
        const cand=[];                                                   // 후보 = 모든 줄기_중기(분홍 예비혹) 마디
        for(const ax of axes) ax.segs.forEach((s,i)=>{
          if(!s.activated && T-s.birth>=P.stemTrans) cand.push({ax,s,i}); });
        if(cand.length){
          const c=cand[Math.floor(rng()*cand.length)];                   // 순서도: 어디서 날지는 순수 랜덤
          c.s.activated=true; c.s.actT=T;
          const dbl=rng()<P.doubleBud; c.s.actType=dbl?'main':'thick';   // 쌍혹(가지2) / 단혹(가지1)
          // ★혹이 붙는 방위는 줄기 둘레 360° 어디든. 굴광성이 높을수록 해 쪽으로 몰림(0=완전 랜덤, 1=정확히 해 쪽)
          c.s.az = LIGHT_AZ + (rng()-0.5)*Math.PI*2*(1-PHOTO*0.85);
          const a0=c.s.az+P.bumpAzOff, nb=dbl?2:1;                       // 가지 방향 = 혹의 방위(+오프셋으로 돌기에 맞춤)
          for(let i=0;i<nb;i++){                                         // 혹에서 줄기_초기가 나와 자람
            const s2=a0+(nb===2? i*Math.PI : 0);
            const bd=new THREE.Vector3(Math.sin(s2)*P.branchSpread, 1, Math.cos(s2)*P.branchSpread).normalize();
            const nax=mkAxis({ax:c.ax, idx:c.i}, bd, T+P.bumpGrow);      // 혹이 다 돋은 뒤에 가지가 남(순서도 #12→#14)
            // ★★캐논(2026-08-17 고침): 눈에서도 **가는 잎자루가 먼저**(새순 없이) 나고
            //   그 끝에서 새순이 난다 — 씨앗 발아와 **같은 순서**다(byeot_growth_chart_인계.md §3).
            //   전에는 마디가 전역 격자(T=20,60,100,140…)에서만 났는데 가지 축은 격자+bumpGrow 에
            //   태어나므로, 잎(축+petGrow=136)이 첫 마디(140)보다 **먼저** 나서 새순이 혹 위에
            //   그대로 떠 있었다. ⇒ 축이 나는 그 날 첫 마디를 같이 심는다. 밑동 축이
            //   t0 에 나면서 t0 에 첫 마디를 얻는 것과 정확히 같은 규칙이다.
            addSeg(nax, nax.birth);
          }
        }
      }
      // ★첫 중간잎까지는 마디가 쭉 자라고, 그 뒤부터는 "중간잎 → 다음 중간잎" 사이에 딱 1마디씩만
      for(const ax of axes){
        if(ax.birth>T || ax.segs.length>=P.maxLeaves) continue;
        if(ax.triggered && ax.grew) continue;                            // 중간잎 지난 축은 사이클당 1마디
        // ★마디는 STEP 보다 촘촘히 나지 않는다. 갓 난 가지는 첫 마디를 제 생일(격자+bumpGrow)에
        //   이미 심었으므로, 바로 다음 격자점(20일 뒤)에 또 심으면 그 축만 마디가 하나 더 는다.
        //   밑동 축은 마디 간격이 언제나 정확히 STEP 이라 이 줄에 걸리지 않는다.
        if(ax.segs.length && T-ax.segs[ax.segs.length-1].birth < STEP) continue;
        addSeg(ax,T); ax.grew=true;
      }
    }
  return {axes, axBase, leafM};   // 렌더가 쓰는 셋. 기하 계산도 여기서 이미 끝났다
}

function buildPlant(){
  requestRender();                 // 형태를 다시 세운다 = 다시 그릴 것이 있다(그리기 플래그만 건드린다)
  rng=mulberry32(SEED);            // 매 빌드 동일 시드 → 안정적(슬라이더 드래그해도 안 흔들림)
  seedColor();                     // 개체 통일 색(시드 고정: 색조+채도)
  ensureSheath();                             // 엽초 구멍 크기 변경 반영
  ensureLeafShape();                          // 잎자루 지름 변경 반영
  clearGroup(plantGroup); clearPlaced();      // 겹침 회피용 자리 기록 초기화
  addPot();
  // ★실제 경과일(gReal)을 '생장 나이'(g)로 변환한다. 어린 개체가 빨리 자리잡고
  //   덩치가 커질수록 더디게 자라는 실제 생장 곡선. timeCurve=1이면 예전과 동일(등속).
  const gReal=GROWTH, g=ageOf(gReal), gf=Math.min(1, g/GMAX);
  PLANT_AGE=gf;                             // 개체 나이(색 짙어짐·선명해짐 기준)
  // ★한 게이지로 줄기·엽초·잎이 '지금 비율 그대로' 함께 커진다. growAmt가 한계치(최대 배율-1).
  PLANT_GROW=1 + P.growAmt*Math.min(1, g/Math.max(1,P.growSpan));
  let stage='', nodes=0, leaves=0;

  if(g<P.seedEnd){
    const t=g/Math.max(1,P.seedEnd);
    const seed=new THREE.Mesh(new THREE.SphereGeometry(0.05+0.04*t,10,8), MAT.seed);
    seed.position.set(0,SOIL_Y+0.03,0); seed.scale.y=0.7; seed.castShadow=true; plantGroup.add(seed);
    stage='씨앗 🌰';
  } else {
    // ===== 정밀 생장 — 마디 트리는 growTopology 가 낸다(순서도 #0~#16) =====
    const {axes, axBase, leafM}=growTopology(g);
    // ===== 렌더 =====
    // ★2단계로 나눈다: 잎이 "다른 줄기"를 피하려면 잎을 놓기 전에 모든 줄기를 알아야 하기 때문.
    //   1단계에서 전 축의 마디 점·굵기를 계산해 장애물(STEMS)로 등록하고, 2단계에서 그린다.
    let nLeaf=0, acts=0, nSeg=0;
    const built=[];
    for(const ax of axes){
      if(ax.birth>g) continue;
      let cur=axBase(ax,g);
      const pts=[cur.clone()], bumps=[];
      for(const sg of ax.segs){
        if(sg.birth>g) continue;
        const gr=Math.min(1,(g-sg.birth)/Math.max(1,P.petGrow));        // ★줄기_초기만 길이가 자람
        cur=cur.clone().addScaledVector(sg.dir, sg.len*gr*PLANT_GROW);
        pts.push(cur.clone());
        if(sg.activated && g>=sg.actT+P.bumpGrow){ bumps.push({s:sg, i:pts.length-2, gr}); acts++; }
        nSeg++;
      }
      const matured=Math.min(1,(g-ax.birth)/Math.max(1,P.stemTrans*2));
      const rBase=(P.rEarly+(P.rThin-P.rEarly)*matured)*PLANT_GROW, rTip=P.rEarly*P.tipTaper*PLANT_GROW;
      built.push({ax, pts, bumps, rBase, rTip, tip:cur.clone()});
      for(let i=0;i<pts.length-1;i++){                                   // 줄기 마디를 장애물로 등록
        const t=(i+0.5)/Math.max(1,pts.length-1);
        STEMS.push({a:pts[i], b:pts[i+1], r:rBase+(rTip-rBase)*t, ax, i, n:pts.length-1});
      }
    }
    for(const e of built){
      if(e.pts.length>=2){
        const L=[0]; for(let i=1;i<e.pts.length;i++) L.push(L[i-1]+e.pts[i].distanceTo(e.pts[i-1]));
        const tot=L[L.length-1]||1, nodeTs=L.slice(1,-1).map(l=>l/tot);
        // 이 축 끝에 달릴 잎을 미리 알아내 줄기 끝 색을 맞춘다(잎 → 엽초 → 줄기가 이어져 보이게)
        let tipCol=null;
        // ※ 이 블록 아래에서 const ax=e.ax 를 선언하므로 여기서 ax를 쓰면 TDZ 오류가 난다. e.ax로 쓴다.
        if(g>=e.ax.leafBirth){
          const A=e.ax;
          const lk=pickLeafKey(leafM(A,g), A.midType, A.canMature, A.varie, A.alboMid, A.matRoll);
          if(lk) tipCol=petColorOf(lk);
        }
        addStemTube(e.pts, e.rBase, e.rTip, nodeTs, stemTint(0), tipCol);
        for(const b of e.bumps){                                         // 혹/쌍혹 GLB를 마디 구간에 얹음
          const key=b.s.actType==='main'?'stem_main':'stem_thick';
          const rad=(b.s.actType==='main'?P.rThick*1.05:P.rThick)*P.bumpFit*PLANT_GROW;
          stretchGLB(key, e.pts[b.i], e.pts[b.i+1], rad, stemTint(0.04), b.s.az);
        }
      }
      const ax=e.ax, last=ax.segs.length?ax.segs[ax.segs.length-1]:null;
      const tipAz=last?last.az:ax.az, tipDir=last?last.dir:ax.dir;
      // ★떨어진 잎은 안 그린다. 그 잎과 잎자루까지만 사라지고 줄기·다른 잎은 그대로다.
      if(g>=ax.leafBirth && !leafDroppedOf(ax.leafBirth)){ drawLeafStage(e.tip, tipAz, leafM(ax,g), ax.midType, ax.canMature, tipDir, P.rEarly*P.tipTaper*PLANT_GROW, ax.varie, ax, ax.alboMid, ax.matRoll); nLeaf++; }
    }
    nodes=nSeg; leaves=nLeaf;
    stage = nSeg<=1 ? '새싹 🌱' : ((axes.length>1?'가지 '+(axes.length-1)+' · ':'')+(acts?'혹 '+acts+' · ':'')+'마디 '+nSeg);
  }
  updateAssetUse();   // 선택한 에셋이 지금 화면에 몇 개 있는지
  fitCam();     // 자라는 만큼 카메라가 따라 담기(항상 화면 안에)
  const el=document.getElementById('stat');
  el.innerHTML=`<span class="k">단계</span> ${stage}<br><span class="k">마디</span> ${nodes} · <span class="k">잎</span> ${leaves} · <span class="k">시드</span> ${SEED}<br><span class="k">생장나이</span> ${Math.round(ageOf(GROWTH))}일`;
}
// 식물 전체가 화면에 담기도록 직교 프러스텀·시선높이 자동 조절
function fitCam(){
  if(!plantGroup||!cam) return;
  const b=new THREE.Box3().setFromObject(plantGroup);
  if(!isFinite(b.max.y)||b.isEmpty()) return;
  const topY=b.max.y, halfW=Math.max(Math.abs(b.min.x),Math.abs(b.max.x),Math.abs(b.min.z),Math.abs(b.max.z));
  FRUSTUM=Math.max(1.5, Math.min(4.2, Math.max(topY*0.62+0.32, halfW*1.15+0.5)));
  orbit.ty=topY*0.5+0.15;                       // 밑동~꼭대기 중간을 봄
  const a=(W||innerWidth)/(H||innerHeight);     // 투영만 갱신(렌더러 크기는 resize가 담당)
  cam.left=-FRUSTUM*a; cam.right=FRUSTUM*a; cam.top=FRUSTUM; cam.bottom=-FRUSTUM;
  updateCam();
}

// ===== 씬/카메라 (loader_glb.html 직교 4방위 방식) =====

function resize(){
  W=innerWidth; H=innerHeight; renderer.setSize(W,H);
  const a=W/H; cam.left=-FRUSTUM*a; cam.right=FRUSTUM*a; cam.top=FRUSTUM; cam.bottom=-FRUSTUM; cam.updateProjectionMatrix();
  requestRender();
}
function updateCam(){
  const {az,el,r,tx,ty,tz}=orbit, ce=Math.cos(el);
  cam.position.set(tx+r*ce*Math.sin(az), ty+r*Math.sin(el), tz+r*ce*Math.cos(az));
  cam.up.set(0,1,0); cam.lookAt(tx,ty,tz); cam.zoom=orbit.zoom; cam.updateProjectionMatrix();
  requestRender();                          // 카메라가 움직였다 = 다시 그릴 것이 있다
}
function snapView(dir){
  const flat=0.32;
  if(dir==='front'){ orbit.az=0; orbit.el=flat; }
  else if(dir==='left'){ orbit.az=-Math.PI/2; orbit.el=flat; }
  else if(dir==='right'){ orbit.az=Math.PI/2; orbit.el=flat; }
  else if(dir==='top'){ orbit.az=Math.PI*0.22; orbit.el=1.45; }
  updateCam();
}
function bindControls(){
  addEventListener('resize',()=>{ resize(); updateCam(); });
  let drag=false,px=0,py=0,pan=false;
  cv.addEventListener('pointerdown',e=>{ drag=true; pan=(e.button===2||e.shiftKey); px=e.clientX; py=e.clientY;
    downX=e.clientX; downY=e.clientY; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove',e=>{ if(!drag)return; const dx=e.clientX-px,dy=e.clientY-py; px=e.clientX; py=e.clientY;
    if(pan){ const sx=(cam.right-cam.left)/W/orbit.zoom, sy=(cam.top-cam.bottom)/H/orbit.zoom;
      const fwd=new THREE.Vector3(); cam.getWorldDirection(fwd);
      const right=new THREE.Vector3().crossVectors(fwd,cam.up).normalize();
      const up=new THREE.Vector3().crossVectors(right,fwd).normalize();
      const mx=-dx*sx,my=dy*sy;
      orbit.tx+=mx*right.x+my*up.x; orbit.ty+=mx*right.y+my*up.y; orbit.tz+=mx*right.z+my*up.z;
    } else { orbit.az+=dx*0.008; orbit.el=Math.max(0.05,Math.min(1.52,orbit.el+dy*0.006)); }
    updateCam(); });
  cv.addEventListener('pointerup',e=>{ drag=false;
    if(Math.hypot(e.clientX-downX, e.clientY-downY)<5) pickAt(e);   // 거의 안 움직였으면 클릭
  });
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  cv.addEventListener('wheel',e=>{ e.preventDefault(); orbit.zoom=Math.max(0.2,Math.min(8,orbit.zoom*(e.deltaY<0?1.1:0.9))); updateCam(); },{passive:false});

  document.querySelectorAll('.views [data-dir]').forEach(b=>b.onclick=()=>snapView(b.dataset.dir));
  document.getElementById('btnAuto').onclick=e=>{ autoRotate=!autoRotate; e.target.classList.toggle('on',autoRotate); };
  document.getElementById('btnGrid').onclick=e=>{ grid.visible=!grid.visible; e.target.classList.toggle('on',grid.visible); requestRender(); };

  const gs=document.getElementById('growth');
  gs.addEventListener('input',()=>{ stopPlay(); GROWTH=+gs.value; document.getElementById('growthV').textContent=GROWTH; buildPlant(); });
  // ▶ 재생 · 처음 · 끝 (성장 애니메이션)
  document.getElementById('btnFirst').onclick=()=>{ stopPlay(); setGrowth(0); };
  document.getElementById('btnLast').onclick=()=>{ stopPlay(); setGrowth(GMAX); };
  document.getElementById('btnPlay').onclick=()=>{ playing?stopPlay():startPlay(); };
  document.getElementById('btnSeed').onclick=()=>{ SEED=Math.floor(Math.random()*99999); matResetAll(); buildPlant(); };
  const ls=document.getElementById('light');
  ls.addEventListener('input',()=>{ LIGHT_AZ=(+ls.value)*Math.PI/180; document.getElementById('lightV').textContent=ls.value+'°'; updateSun(); buildPlant(); });
  const ps=document.getElementById('photo');
  ps.addEventListener('input',()=>{ PHOTO=(+ps.value)/100; document.getElementById('photoV').textContent=ps.value+'%'; buildPlant(); });
  // 🔆 DLI 테스트 — 조도 엔진 없이 "이 자리에 계속 뒀다면"을 확인한다.
  //    −1 = 끔(상수 그대로) → 아래 슬라이더 튜닝이 평소대로 먹는다.
  const dls=document.getElementById('dliTest');
  dls.addEventListener('input',()=>{
    const v=+dls.value, out=document.getElementById('dliV');
    // '끔'은 빛을 끊는 것일 뿐 튜닝 모드가 아니다 — 게임 경로에서는 그대로 정지한다.
    if(v<0){ setDailyLight(null); out.textContent='끔 (빛 없음)'; }
    else {
      setDailyLightSteady(v);
      const T=TH_MONSTERA, f=fLight(v);
      const fen = v<T.fenestrate ? '갈라짐✕' : '갈라짐○';
      const vk  = f===0 ? '무늬✕(정체)' : ('무늬 ×'+(f*fStable()).toFixed(2));
      out.textContent=v.toFixed(1)+' · '+fen+' · '+vk;
    }
    buildPlant();
    if(typeof refreshDayHUD==='function') refreshDayHUD();
  });
  {  // 최소 루프 v0
    const tm=document.getElementById('tuneMode');
    if(tm) tm.addEventListener('change',()=>{ setTuningMode(tm.checked); buildPlant(); });
    const nb=document.getElementById('btnNextDay');
    if(nb) nb.onclick=()=>{ stopPlay(); nextDay(); };
    refreshDayHUD();
  }
  document.getElementById('btnResetAsset').onclick=()=>{ const sel=document.getElementById('assetSel'); const k=sel.value; ADJ[k]=defAdj(k); buildAssetSliders(k); showPreview(k); buildPlant(); };
  buildAssetSelect(); buildShapePanel();
  // 패널 접기
  document.getElementById('panelToggle').onclick=e=>{ const bd=document.getElementById('panelBody'); const hid=bd.style.display==='none'; bd.style.display=hid?'block':'none'; e.target.textContent=hid?'▾':'▸'; };
  // 설정 복사 / 리셋 (전체 A + 에셋별 B)
  document.getElementById('btnCopy').onclick=()=>{ const j=JSON.stringify({v:CFG_VER, P, ADJ, SEED},null,1);
    if(navigator.clipboard) navigator.clipboard.writeText(j);
    try{ const blob=new Blob([j],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='monstera_config.json'; a.click(); URL.revokeObjectURL(url); }catch(e){}
    flashBtn('btnCopy','✅ 복사+파일'); };
  document.getElementById('btnReset').onclick=()=>{ P=Object.assign({},DEF); ADJ=JSON.parse(JSON.stringify(DEF_ADJ)); try{localStorage.removeItem('mcfg_default');}catch(e){} const sel=document.getElementById('assetSel'); buildAssetSliders(sel.value); showPreview(sel.value); buildShapePanel(); buildPlant(); };
  document.getElementById('btnPersist').onclick=()=>{ try{ localStorage.setItem('mcfg_default', JSON.stringify({v:CFG_VER,P,ADJ,SEED})); flashBtn('btnPersist','✅ 저장됨'); }catch(e){ flashBtn('btnPersist','실패'); } };
  document.getElementById('btnLoad').onclick=()=>applyCfg(true);
  applyCfg(false);   // 시작 시 영구저장 있으면 자동 적용(새로고침해도 유지)

let playing=false, playTimer=null;
// ===== 잎 클릭 = 이름 확인 + 그 에셋으로 조정 전환 =====
// 화면에서 "이게 뭐지?" 싶을 때 바로 짚을 수 있어야 튜닝이 굴러간다.
let downX=0, downY=0;
const RAY=new THREE.Raycaster();
function pickAt(e){
  const r=cv.getBoundingClientRect();
  RAY.setFromCamera(new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,
                                      -((e.clientY-r.top)/r.height)*2+1), cam);
  const hit=RAY.intersectObjects(plantGroup.children, true);
  for(const h of hit){
    let o=h.object, key=null;
    while(o && !key){ if(o.userData && o.userData.assetKey) key=o.userData.assetKey; o=o.parent; }
    if(!key) continue;
    const rep=ADJ_ALIAS[key]||key;            // 파생본은 대표로 (조정은 대표에만 걸린다)
    const sel=document.getElementById('assetSel');
    if(sel && [...sel.options].some(op=>op.value===rep)){
      sel.value=rep; buildAssetSliders(rep); showPreview(rep);
    }
    const nm=(key==='__stem')? '줄기(절차생성 튜브)' : (ADJ_KO[key]||key);
    showPick(nm + (rep!==key? '  (조정은 '+(ADJ_KO[rep]||rep)+')' : ''));
    return;
  }
  showPick('');
}
function showPick(txt){
  let el=document.getElementById('pickTag');
  if(!el){ el=document.createElement('div'); el.id='pickTag';
    el.style.cssText='position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:50;'
      +'padding:9px 16px;border-radius:9px;background:rgba(20,16,32,.93);color:#eafbe4;'
      +'border:1px solid #4c7a46;font-size:13.5px;font-weight:600;letter-spacing:.2px;'
      +'pointer-events:none;transition:opacity .25s;box-shadow:0 4px 18px rgba(0,0,0,.5)';
    document.body.appendChild(el); }
  if(!txt){ el.style.opacity='0'; return; }
  el.textContent='🍃 '+txt; el.style.opacity='1';
  clearTimeout(showPick._t); showPick._t=setTimeout(()=>{ el.style.opacity='0'; }, 4000);
}

// ===== 빛 게이트 =====
// GROWTH = 유효 생장 진행도(형태를 결정). CAL_DAY = 달력 경과일(날짜는 계속 간다).
// 둘을 가르지 않으면 어두운 방에서도 날짜만 지나면 잎이 나온다.
let CAL_DAY=0;
// 최소 광량은 임계값 정본(TH_MONSTERA.min) 하나만 쓴다. 여기에 3.0을 다시 적지 않는다 —
// 두 벌이 되면 한쪽만 고쳐져 어긋난다.
// 최소 광량은 임계값 정본 하나만 쓴다. 못 읽으면 조용히 넘어가지 않고 실패시킨다 —
// 폴백 상수를 두면 정본이 안 실린 상태로 게임이 돌아가고, 그게 제일 늦게 발견된다.
function growthMin(){
  const v = TH_MONSTERA && TH_MONSTERA.min;
  if(typeof v!=='number' || !isFinite(v) || v<0)
    throw new Error('[생장] 최소 광량(TH_MONSTERA.min)을 못 읽었습니다 — 임계값 정본이 안 실렸습니다');
  return v;
}
// 오늘 자랄 수 있나. 이력이 7일 미만이면 dliAvg 가 있는 만큼으로 평균을 낸다.
// 빛이 아예 안 연결된 상태(이력 없음)는 게이트를 걸지 않는다 — 이 파일 단독 튜닝 모드가 계속 되어야 한다.
// 단독 튜닝 모드. 조도 없이 형태만 보려는 용도라 게임 경로와 반드시 갈라 둔다.
// 기본은 꺼짐 = 게임 경로 — 빛이 없으면 자라지 않는다.
let TUNING_MODE=false;
function setTuningMode(on){ TUNING_MODE=!!on;
  const tm=document.getElementById('tuneMode'); if(tm) tm.checked=TUNING_MODE; if(typeof refreshDayHUD==='function') refreshDayHUD(); return TUNING_MODE; }
function isTuningMode(){ return TUNING_MODE; }

// 오늘 자랄 수 있나. 이력이 7일 미만이면 dliAvg 가 있는 만큼으로 평균을 낸다.
// ★ 빛이 없거나 값이 망가졌으면 '자란다'로 넘어가지 않는다. 그게 지금까지의 거짓말이었다.
function growthBlockReason(){
  if(TUNING_MODE) return null;                       // 명시적으로 켠 단독 튜닝 모드만 예외
  // ★정본이 실렸는지 먼저 본다. 코드 안의 복제값은 튜닝용 폴백이지 게임 기준이 아니다.
  if(!TH_LOADED) return '임계값 정본(data/growth_tuning.json)이 안 실렸습니다 — 서버로 여세요';
  // ★오늘 값을 이동평균보다 먼저 본다. 어제까지 밝았어도 오늘 빛을 모르면 자랄 근거가 없다.
  if(PLANT_DLI==null)           return '오늘 빛이 없습니다(DLI 없음)';
  if(typeof PLANT_DLI!=='number' || !isFinite(PLANT_DLI)) return '오늘 DLI 값이 망가졌습니다';
  const d=dliAvg(7);
  if(d==null || !isFinite(d))   return 'DLI 이력이 없습니다';
  if(d < growthMin())           return '빛 부족 — 7일평균 '+d.toFixed(2)+' < 최소 '+growthMin();
  return null;
}
function canGrow(){ return growthBlockReason()===null; }
// ★ 코어용 — 달력 날짜를 이 값으로 옮긴다. 그 사이 유효 생장은 빛이 될 때만 쌓인다.
//   setGrowth(점프)와 뜻이 다르다. 코어는 반드시 이걸 쓸 것.
// ★ 코어용 — 달력을 하루 진행한다. 유효 생장은 빛이 될 때만 쌓인다.
//   하루 단위만 받는다. 여러 날을 한 번에 넘기면 그 사이 날씨·빛을 알 수 없어
//   저광 정지를 건너뛰게 된다 — 이력 재생 장치를 만들 게 아니면 막는 편이 맞다.
function advanceTo(calDay){
  const target=Math.round(calDay);
  const delta=target-CAL_DAY;
  if(delta!==1)
    throw new Error('[생장] advanceTo 는 하루만 받습니다 — 지금 달력 '+CAL_DAY+', 요청 '+target+'(delta '+delta+'). 하루씩 부르세요');
  const reason=growthBlockReason();
  CAL_DAY=target;
  let matured=[];
  if(reason===null){
    GROWTH=Math.max(0, Math.min(GMAX, GROWTH+1));
    // ★성숙 판정은 형태가 하루 간 뒤에만 돈다. 안 자란 날은 기회도 안 온다.
    matured=stepMaturation();
  }
  // ★잎 건강은 **안 자란 날에도** 돈다. 빛이 모자라 안 자라는 그 상황이 곧 잎이 상하는 상황이라,
  //   자란 날에만 돌리면 정작 나쁜 자리에서 아무 일도 안 일어난다.
  const leaves=stepLeafHealth();
  // ★논리 진행은 위에서 이미 끝났다. 아래는 화면일 뿐이다 —
  //   그리다 난 예외를 여기서 던지면 코어는 "하루가 안 갔다"고 알고 growth 는 갔다고 아는,
  //   서로 어긋난 상태가 된다. 그 갈림은 다음 턴부터 조용히 누적된다.
  //   ★다만 '그렸는가'는 반드시 돌려준다. 안 그러면 게이지는 오르고 그림은 멈춘 채
  //     아무도 모르는 상태가 된다 — 이 게임이 가르치는 게 딱 '빛 → 형태 변화'다.
  const r=redraw();
  return { calDay:CAL_DAY, growth:GROWTH, grew:reason===null, blocked:reason,
           // 그 날 굴린 잎들. 빈 배열이면 굴릴 잎이 없었던 것이고, ok:false 가 있으면
           // 화면이 "이번엔 성숙하지 않았습니다"를 띄워야 한다 — 게이지가 절반으로 준 이유다.
           matured,
           // 그 날 색이 바래거나 되돌아오거나 떨어진 잎. kind: fade | recover | drop
           leaves,
           drawn:r.drawn, drawError:r.drawError, hudError:r.hudError };
}
let _warnedSetGrowth=false;
// 코어·테스트가 상태를 읽고 쓰는 자리. let 전역은 밖에서 못 만지므로 함수로 낸다.
function calendarDay(){ return CAL_DAY; }          // 달력 경과일
function growthDays(){ return GROWTH; }            // 유효 생장 진행도(형태를 결정)
// 씨앗이 바뀌면 다른 개체다 — 성숙 이력도 같이 버린다(잠금 판정이 SEED 기반이라 안 지우면 어긋난다)
function plantSeed(v){ if(v!=null){ SEED=v>>>0; matResetAll(); buildPlant(); } return SEED; }
function isGrowing(){ return canGrow(); }          // 지금 자라는 중인가
function growthBlocked(){ return growthBlockReason(); }   // 왜 안 자라나(문자열) · null이면 자라는 중
// 임계값 정본이 실렸는가(읽기 전용). 코어가 "서버로 안 열었네"를 화면에 띄울 수 있게 낸다.
// ⚠ 세터는 두지 않는다 — 밖에서 켤 수 있으면 로딩 게이트가 그 순간 장식이 된다.
function thLoaded(){ return TH_LOADED; }

/* ═══════════════════════════════════════════════════════════════════════════
   ★★★ 여러 그루 — 전역 교체(context swap)          (2026-08-15)
   설계 정본: docs/handoff/growth-multiplant-design.md §방식
   ───────────────────────────────────────────────────────────────────────────
   개체 상태를 만지는 함수가 마흔 개가 넘는다. 전부 인자를 받게 고치면 큰 수술이고
   그만큼 버그가 들어온다. 그럴 필요가 없다 — **생장은 동기 처리**라서
   「한 번에 한 그루씩」 전역에 꽂아 두고 굴리면 된다.
   `buildPlant()` 는 원래부터 "지금 전역에 꽂힌 그루"를 그린다. 그루를 바꿔 꽂을 뿐이다.

   ★ 아무도 `addPlant`·`selectPlant` 를 안 부르면 **이 블록은 한 줄도 안 돈다.**
     `PLANTS` 가 비어 있고 `CUR_PLANT` 가 null 이라, 옛 한 그루 판은 예전과 비트 단위로 같다.

   ★ 무엇이 그루마다인가 (전수 조사, 2026-08-15 다시 셈 — 설계 문서의 8개는 낡았다)
       SEED · GROWTH · CAL_DAY · PLANT_SLOT · PLANT_DLI · DLI_HIST · PROP_MODE
       MAT_STATE · LEAF_HEALTH · VARIE_STATE · PROLOGUE_VARIE · plantGroup
     ⇒ 열둘이다. 설계 당시엔 성숙·무늬·잎건강 이력(2026-08-03)과 프롤로그 보장(2026-08-13)이
       아직 없었다. 이 넷을 빠뜨리면 **그루끼리 잎 이력이 샌다** — 조용히 틀리는 유형이다.

   ★ 무엇이 공용인가 — ASSETS·PET_COLOR·PET_AXIS·SHEATH_* 캐시(에셋 단위라 그루와 무관),
     P·ADJ·GT·TH_MONSTERA(튜닝 정본), TUNING_MODE, scene·cam·renderer.
     PLANT_HUE·PLANT_SAT·PLANT_MID·PLANT_AGE·PLANT_GROW·SOIL_Y·PLACED·STEMS·USE_COUNT 은
     **파생값**이다 — `buildPlant()` 도입부가 SEED·GROWTH 에서 매번 다시 만든다. 옮기면 두 벌이 된다.

   ⚠ 참조만 바꾼다. `DLI_HIST`·`MAT_STATE` 따위를 **복사**하면 두 벌이 되고,
     한쪽만 자라는 날이 온다. 그래서 저 넷을 const 에서 let 으로 바꿨다.
   ⚠ 그룹은 **scene 에 계속 둔다.** 뗐다 붙이면 다른 그루가 화면에서 사라진다.
     대신 지금 고른 그루만 `visible` 로 둔다 — 확대창은 「그 그루의 창」이기 때문이다.
     ★ 그루가 하나뿐이면 그 하나가 늘 보인다(옛 판과 같다).
   ⚠ 진짜 동시 실행은 안 된다(비동기 중간에 다른 그루를 꽂으면 깨진다). 지금 구조에
     비동기 생장은 없다. 생기면 그때 파일을 모듈 팩토리로 가른다(설계 문서 §C).
═══════════════════════════════════════════════════════════════════════════ */
const PLANTS=new Map();               // id → 개체 기록
const MAIN_PLANT='__main__';          // 옛 한 그루 판이 쓰던 그 그루
let CUR_PLANT=null;                   // null = 아직 아무도 다개체를 안 썼다

/* 지금 전역에 꽂혀 있는 것을 그대로 기록으로 만든다(사본이 아니라 **같은 것**을 가리킨다) */
function _plantRecordNow(id){
  return { id, seed:SEED, growth:GROWTH, calDay:CAL_DAY,
           slot:PLANT_SLOT, dli:PLANT_DLI, dliHist:DLI_HIST, propMode:PROP_MODE,
           mat:MAT_STATE, health:LEAF_HEALTH, varie:VARIE_STATE, prologue:PROLOGUE_VARIE,
           group:plantGroup };
}
function _ensureMain(){
  if(!PLANTS.has(MAIN_PLANT)) PLANTS.set(MAIN_PLANT, _plantRecordNow(MAIN_PLANT));
  if(CUR_PLANT==null) CUR_PLANT=MAIN_PLANT;
  const m=PLANTS.get(MAIN_PLANT);
  if(!m.group && plantGroup) m.group=plantGroup;   // init() 이 그릇을 늦게 만든 경우
  return m;
}
/* 전역 → 기록. 스칼라만 옮긴다(컬렉션은 이미 같은 것을 가리키고 있다). */
function _plantCapture(){
  const p=PLANTS.get(CUR_PLANT); if(!p) return;
  p.seed=SEED; p.growth=GROWTH; p.calDay=CAL_DAY;
  p.slot=PLANT_SLOT; p.dli=PLANT_DLI; p.propMode=PROP_MODE;
  p.dliHist=DLI_HIST; p.mat=MAT_STATE; p.health=LEAF_HEALTH;
  p.varie=VARIE_STATE; p.prologue=PROLOGUE_VARIE; p.group=plantGroup;
}
/* 기록 → 전역. ★ rng 도 같이 되세운다 — buildPlant 가 매번 다시 만들지만,
   그 사이에 rng 을 읽는 코드가 옛 그루의 흐름을 이어받으면 안 된다. */
function _plantInstall(p){
  SEED=p.seed>>>0; rng=mulberry32(SEED);
  GROWTH=p.growth; CAL_DAY=p.calDay;
  PLANT_SLOT=p.slot; PLANT_DLI=p.dli; PROP_MODE=p.propMode;
  DLI_HIST=p.dliHist; MAT_STATE=p.mat; LEAF_HEALTH=p.health;
  VARIE_STATE=p.varie; PROLOGUE_VARIE=p.prologue;
  plantGroup=p.group;
}
function _plantShow(id){
  const one=PLANTS.size<=1;
  for(const [k,v] of PLANTS) if(v.group) v.group.visible = one ? true : (k===id);
  requestRender();
}

/* 새 그루를 등록한다. **꽂지는 않는다** — 고르는 것은 selectPlant 다.
     addPlant({ id, seed, day, calDay, slotId })
   ⚠ 3D 무대(scene)가 있어야 한다. init() 뒤에 부를 것. */
function addPlant(o){
  o=o||{};
  _ensureMain();
  const id=String(o.id!=null? o.id : ('plant'+PLANTS.size));
  if(PLANTS.has(id)) return plantInfo(id);
  /* ★ 무대가 없어도 만든다 — 헤드리스 하네스(tools/test_*)와 방 조립기는 `init()` 을 걷어내고
     이 파일을 돌린다. 거기서 던지면 「그리기 없이 형태만 굴리는」 길이 통째로 막힌다.
     그릴 곳이 있으면 붙이고, 없으면 그릇만 든다. */
  const g=new THREE.Group(); if(scene) scene.add(g);
  const day=Math.max(0, Math.min(GMAX, Math.round(Number(o.day)||0)));
  PLANTS.set(id, { id,
    seed: (o.seed!=null && isFinite(o.seed)) ? (o.seed>>>0) : ((Math.random()*4294967296)>>>0),
    growth: day,
    calDay: Math.max(0, Math.min(GMAX, Math.round(o.calDay!=null? Number(o.calDay) : day))),
    slot: (o.slotId!=null? o.slotId : null),
    dli: null, dliHist: [], propMode: 'batch',
    mat:new Map(), health:new Map(), varie:new Map(),
    prologue:{ leafNo:0, used:false, leafBirth:null },
    group: g });
  _plantShow(CUR_PLANT);
  return plantInfo(id);
}
/* 이 그루를 전역에 꽂는다. 이 뒤의 setDailyLight·advanceTo·leafStats… 는 전부 이 그루의 것이다.
   ★ 여기서 다시 그리지 않는다 — 그루마다 그룹이 따로라 마지막에 그린 모습이 그대로 서 있다.
     매 교체마다 buildPlant 를 부르면 그루 수만큼 그리기가 늘어난다(부팅·하루가 그만큼 무거워진다). */
function selectPlant(id){
  _ensureMain();
  const key=(id==null)? MAIN_PLANT : String(id);
  const rec=PLANTS.get(key);
  if(!rec) throw new Error('[생장] 모르는 그루입니다: '+key+
                           ' (있는 것: '+[...PLANTS.keys()].join(', ')+')');
  if(key===CUR_PLANT) return key;
  _plantCapture();
  CUR_PLANT=key;
  _plantInstall(rec);
  _plantShow(key);
  return key;
}
/* 잠깐 그 그루로 굴리고 **반드시 되돌린다**(예외가 나도). */
function usePlant(id, fn){
  _ensureMain();
  const prev=CUR_PLANT;
  selectPlant(id);
  try { return typeof fn==='function' ? fn(PLANTS.get(CUR_PLANT)) : null; }
  finally { try{ selectPlant(prev); }catch(e){ console.error('[생장] 그루 되돌리기 실패', e); } }
}
/* 그루를 거둔다. 기본 그루(__main__)는 못 지운다 — 지우면 꽂을 것이 없어진다. */
function removePlant(id){
  _ensureMain();
  const key=String(id);
  if(key===MAIN_PLANT) throw new Error('[생장] 기본 그루는 지울 수 없습니다');
  const rec=PLANTS.get(key); if(!rec) return false;
  if(CUR_PLANT===key) selectPlant(MAIN_PLANT);
  /* ★ 무대가 있을 때만 치운다 — 무대가 없으면 치울 메시도 없다(위 §addPlant 와 같은 사정) */
  if(rec.group && scene){ clearGroup(rec.group); scene.remove(rec.group); }
  PLANTS.delete(key);
  _plantShow(CUR_PLANT);
  return true;
}
function plantIds(){ return [...PLANTS.keys()]; }
function plantCount(){ return PLANTS.size; }
function currentPlant(){ _ensureMain(); return CUR_PLANT; }
/* 읽기용 요약. 지금 꽂힌 그루는 **전역에서** 읽는다 — 기록은 교체할 때만 갱신되기 때문이다. */
function plantInfo(id){
  const key=(id==null)? CUR_PLANT : String(id);
  const p=PLANTS.get(key); if(!p) return null;
  const cur=(key===CUR_PLANT);
  return { id:key, current:cur,
           seed: cur? SEED : p.seed,
           growth: cur? GROWTH : p.growth,
           calDay: cur? CAL_DAY : p.calDay,
           slotId: cur? PLANT_SLOT : p.slot,
           dli: cur? PLANT_DLI : p.dli,
           dliDays: (cur? DLI_HIST : p.dliHist).length,
           leaves: (cur? VARIE_STATE : p.varie).size };
}

// ===== 형태 단계 (표시 전용) =====
// 코어가 143·146 같은 숫자를 갖지 않게, 이름과 0..1 만 낸다. 경계는 growth 소유다.
// ⚠ 여기서 새 숫자를 만들지 않는다 — 격자(seedEnd·spawnStep)도 임계값(0.10·0.22·
//   stageYoung·stageMid)도 전부 buildPlant·drawLeafStage 가 쓰는 것 그대로다.
//   그래서 timeCurve·spawnStep·matSpan 을 나중에 조정해도 이 함수는 안 고친다.
//
// 축이 언제 생기고 그 잎이 언제 나는지만 따진다(기하 없음). buildPlant 의 시간 축과 같은 루프다.
// 마디를 고르는 난수는 '어느 마디에 혹이 붙나'만 바꾸고 '언제'는 안 바꾸므로 여기선 첫 후보를 쓴다.
function axisTimeline(gMax){
  const t0=P.seedEnd, STEP=Math.max(1,P.spawnStep), M_MID=P.stageYoung;
  const mk=(birth)=>({birth, leafBirth:birth+P.petGrow, segs:[], triggered:false, grew:false});
  const axes=[mk(t0)];
  const leafM=(ax,T)=>Math.max(0, Math.min(1,(T-ax.leafBirth)/P.matSpan));
  for(let T=t0; T<=gMax+1e-6; T+=STEP){
    const trig=axes.find(ax=>!ax.triggered && leafM(ax,T)>=M_MID);
    if(trig){
      trig.triggered=true; axes.forEach(a=>a.grew=false);
      let cand=null;
      for(const ax of axes) for(const s of ax.segs) if(!s.activated && T-s.birth>=P.stemTrans){ cand=s; break; }
      if(cand){ cand.activated=true;                                 // 혹이 다 돋은 뒤 가지가 난다
        const nax=mk(T+P.bumpGrow); axes.push(nax);
        nax.segs.push({birth:nax.birth, activated:false});           // ★가지도 제 생일에 첫 마디(잎자루) — growTopology 와 같은 규칙
      }
    }
    for(const ax of axes){
      if(ax.birth>T || ax.segs.length>=P.maxLeaves) continue;
      if(ax.triggered && ax.grew) continue;
      if(ax.segs.length && T-ax.segs[ax.segs.length-1].birth < STEP) continue;   // 마디는 STEP 보다 촘촘히 안 난다
      ax.segs.push({birth:T, activated:false}); ax.grew=true;
    }
  }
  return axes;
}
// ageOf 의 역함수 — 생장 나이를 실제 유효 생장일로 되돌린다. 단계 경계를 '며칠'로 말하려면 필요하다.
// ★ ageOf 와 **같은 꺾은선**을 거꾸로 탄다. 두 벌을 따로 적으면 반드시 어긋난다.
function dayOfAge(g){
  if(g<=0) return 0;
  const m=leafDayMap();
  if(!m){ const k=P.timeCurve||1; if(k===1) return Math.max(0,g);
    return GMAX*Math.pow(Math.min(1, g/GMAX), 1/k); }
  const p=m.pts;
  for(let i=1;i<p.length;i++)
    if(g<=p[i][1]) return p[i-1][0]+(p[i][0]-p[i-1][0])*(g-p[i-1][1])/(p[i][1]-p[i-1][1]);
  const last=p[p.length-1];
  return last[0]+(g-last[1])/m.tail;
}
// 잎이 나기 전 구간을 둘로 가른다. 마지막 며칠이 '새순 직전 준비'다.
//   3 은 확정 측정에서 온 표시 상수다 — 적정광 3턴 뒤에 말린 새순이 나온다(146일).
//   ⚠ 첫 플레이 전용 오프셋이 아니다. 모든 새순 주기에 똑같이 적용된다.
//   ⚠ 표시에만 쓴다. 형태·성장 곡선은 이 값을 보지 않는다.
const SPEAR_READY_DAYS=3;
// 그 날 화면에서 "지금 무슨 일이 벌어지는 중인가". 가장 늦게 난 생장점이 기준이다.
function phaseAt(day){
  const d=Math.max(0, day), g=ageOf(d);
  if(g<P.seedEnd)   return 'seed';
  if(g<P.sproutEnd) return 'sprout';
  const born=axisTimeline(g).filter(a=>a.birth<=g);
  const ax=born[born.length-1];
  if(!ax || g<ax.leafBirth){                           // 새 생장점은 났는데 잎은 아직
    if(!ax) return 'spear_ready';
    const leafDay=Math.ceil(dayOfAge(ax.leafBirth));   // 말린 새순이 처음 보이는 날
    return (d >= leafDay-SPEAR_READY_DAYS)? 'spear_ready' : 'axis_rising';
  }
  const m=Math.max(0, Math.min(1,(g-ax.leafBirth)/P.matSpan));
  if(m<0.10)          return 'spear_furled';           // drawLeafStage 와 같은 값
  if(m<0.22)          return 'spear_opening';
  if(m<P.stageYoung)  return 'leaf_young';
  if(m<P.stageMid)    return 'leaf_mid';
  // ★시간이 다 됐다고 성숙잎이 아니다 — 굴림에 성공해야 넘어간다(2026-08-03 확정).
  //   아직 못 넘었거나 중간잎으로 확정된 잎은 계속 중간잎이다.
  return matureOf(ax.leafBirth)? 'leaf_mature' : 'leaf_mid';
}
// 코어용 — 표시 전용이다. 게임 판정은 advanceTo 의 grew·blocked 로 한다.
//   progress01 은 '이 단계 안에서 얼마나 왔나'를 원비율 그대로 낸다(A안).
//   저광으로 멈추면 GROWTH 가 안 늘므로 값도 그대로 멈춘다 — 따로 얼릴 것이 없다.
// ★사람에게 보여줄 이름은 growth 가 낸다. 코어가 자기 표를 들면 단계를 하나 늘리거나
//   이름을 바꿀 때 **오류 없이 틀린 라벨**이 뜬다 — 조용히 틀리는 유형이다.
//   phaseId(키)와 경계는 그대로다. 이름만 얹는다.
const PHASE_KO={
  seed:'씨앗', sprout:'새싹',
  axis_rising:'새 축이 올라오는 중', spear_ready:'말린 새순을 준비하는 중',
  spear_furled:'말린 새순 등장', spear_opening:'새순이 펴지는 중',
  leaf_young:'어린잎', leaf_mid:'중간잎', leaf_mature:'성숙잎'
};
function phaseKoOf(id){ return PHASE_KO[id] || id; }   // 모르는 키는 키 그대로 — 조용히 비우지 않는다
function growthPhase(){
  const d=Math.max(0, Math.min(GMAX, GROWTH));
  const id=phaseAt(d);
  let s=d; while(s>0 && phaseAt(s-1)===id) s--;                 // 이 단계가 시작한 날
  let e=d+1; while(e<=GMAX && phaseAt(e)===id) e++;             // 다음 단계로 넘어가는 날
  const span=Math.max(1, e-s);
  const next = e<=GMAX? phaseAt(e) : null;
  return { phaseId:id,
           phaseKo:phaseKoOf(id),
           progress01:Math.max(0, Math.min(1,(d-s)/span)),
           nextPhaseId: next,
           nextPhaseKo: next===null? null : phaseKoOf(next) };
}

/* ===== 삽수 — 자를 수 있는 마디 목록 (코어 요청, docs/handoff/core-to-growth.md 2026-08-03) =====
   ★읽기 전용이다. 형태를 만들지도 깎지도 않는다. 이미 자란 것을 그대로 읽어 낼 뿐이다.
   ★ buildPlant 이 그리는 바로 그 트리를 읽는다(같은 growTopology 를 부른다) —
     박사님 확정 "삽수는 실제 자랐던 거를 각각 잘라서" 가 여기서 문자 그대로 성립한다.
     추정값이 섞이는 순간 이 기능의 존재 이유가 사라지므로, 여기서 새로 굴리는 난수는 없다.

   반환 [{ nodeId, stem, leaves, variegatedLeaves, growthDays }, ...] — 마디 하나당 한 줄
     nodeId            그 마디를 다시 가리키는 이름(아래 ★)
     stem              캐논 등급 petiole / pink / thick / main (docs/propagation.md §1)
     leaves            그 마디를 자르면 딸려 나올 잎 수 = 그 마디 위 전부 + 거기서 난 가지 전부
     variegatedLeaves  그중 이미 무늬로 난 잎 수(물리적으로 같은 잎이 딸려간다)
     growthDays        그 조각이 자란 유효 생장일
   자를 수 있나(pink 이상인가)는 코어가 stem 으로 판정한다 — 목록은 마디를 다 낸다.

   ★★ nodeId 는 자리가 아니라 "뿌리에서 그 마디까지 온 길"이다.
     n0#2      원줄기(축0)의 세 번째 마디
     n0.1#0    축0 의 두 번째 마디에서 난 가지의 첫 마디
     n0.1:1#0  그 마디가 쌍혹이라 가지가 둘일 때, 둘째 가지의 첫 마디
     마디는 뒤로만 쌓이고 이미 난 마디의 길은 안 바뀐다 → 더 자라도·다시 그려도 같은 마디를 가리킨다.
     ⚠ 축 배열의 자리(인덱스)로 이름을 지으면 안 된다. 가지가 하나 더 나는 순간 딴 마디를 가리킨다. */
/* 지금 이 그루의 마디 트리를 그리기 없이 한 번 굴린다. 읽기 전용 접근자들이 같이 쓴다.
   ⚠ 난수 스트림을 쓰고 **반드시 되돌린다** — 그리기가 쓰는 rng 와 섞이면 형태가 조용히 달라진다.
     되돌리는 자리가 둘로 갈라지면 한쪽만 고쳐질 수 있어 여기 하나로 모았다. */
function topologyNow(g){
  const keep=rng;
  try{ rng=mulberry32(SEED); return growTopology(g).axes; }
  finally{ rng=keep; }
}
function cuttableNodes(){
  const day=Math.max(0, Math.min(GMAX, GROWTH)), g=ageOf(day);
  if(g<P.seedEnd) return [];                       // 씨앗 — 아직 마디가 없다
  const axes=topologyNow(g);

  const pathOf=new Map(), branchNo=new Map(), kidsOf=new Map();
  for(const ax of axes){
    if(!ax.from){ pathOf.set(ax,'0'); continue; }
    const base=pathOf.get(ax.from.ax)+'.'+ax.from.idx;
    const n=branchNo.get(base)||0; branchNo.set(base, n+1);
    pathOf.set(ax, n? base+':'+n : base);          // 쌍혹이라 한 마디에서 둘이 나면 둘째부터 :1
    const arr=kidsOf.get(ax.from.ax)||[];          // 어느 마디에서 어느 가지가 났나
    arr.push({idx:ax.from.idx, ax}); kidsOf.set(ax.from.ax, arr);
  }
  // 그 축이 지금 달고 있는 잎(생장점의 잎 1장). 떨어진 잎을 빼는 것까지 buildPlant 과 같은 기준이다
  const hasLeaf=(ax)=> g>=ax.leafBirth && !leafDroppedOf(ax.leafBirth);
  // fromIdx 번 마디부터 위로 딸려 나올 잎 — 자기 잎 + fromIdx 이상 마디에서 난 가지의 전부
  const carried=(ax, fromIdx)=>{
    let n=0, v=0;
    if(hasLeaf(ax)){ n++; if(ax.varie) v++; }
    for(const c of (kidsOf.get(ax)||[])){
      if(c.idx<fromIdx || c.ax.birth>g) continue;
      const r=carried(c.ax, 0); n+=r.n; v+=r.v;
    }
    return {n, v};
  };
  // 캐논 등급. 예비혹(pink)은 stemTrans 만큼 묵으면, 혹(thick/main)은 실제로 돋은 뒤부터 —
  // 둘 다 buildPlant 이 후보를 고르고 혹 GLB 를 얹는 기준 그대로다(새 숫자를 안 만들었다).
  const stemOf=(s)=>{
    if(s.activated && g>=s.actT+P.bumpGrow) return s.actType==='main'? 'main' : 'thick';
    return (g-s.birth>=P.stemTrans)? 'pink' : 'petiole';
  };
  const out=[];
  for(const ax of axes){
    if(ax.birth>g) continue;                       // 아직 안 난 가지
    for(let i=0;i<ax.segs.length;i++){
      const s=ax.segs[i]; if(s.birth>g) continue;
      const r=carried(ax, i);
      out.push({ nodeId:'n'+pathOf.get(ax)+'#'+i, stem:stemOf(s),
                 leaves:r.n, variegatedLeaves:r.v,
                 // 마디가 난 '생장 나이'를 실제 생장일로 되돌려 뺀다(ageOf 의 역함수 dayOfAge)
                 growthDays:Math.max(0, Math.round(day-dayOfAge(s.birth))) });
    }
  }
  return out;
}

/* ===== 판매·표시용 잎 집계 (코어 요청 2026-08-03) =====
   가격 공식 '단위기본가 × 크기 × (1+60·v²)' 의 크기(잎 수)와 v(무늬 잎 비율)를
   코어가 읽는 창구다 (docs/propagation.md §6 — "값은 보이는 것으로만 매긴다").

   반환 { leaves, variegatedLeaves, matureLeaves, growthDays }

   ★ cuttableNodes() 와 **같은 트리**(growTopology)를 센다. 두 접근자가 다른 것을 세면
     "자를 때 본 잎 수"와 "팔 때 본 잎 수"가 갈린다. 밑동 마디를 자르면 그루가 통째로
     딸려오므로 leafStats().leaves 는 cuttableNodes() 의 n0#0 잎 수와 **항상 같다**.
   ★ 성숙(갈라짐)의 정본은 MAT_STATE 다. 여기서 새로 굴리지 않고 matureOf 로 읽기만 한다 —
     굴리면 파는 순간 잎이 갈라지는 소급 판정이 된다.

   ★★ 바랜 잎(LEAF_HEALTH.fade)은 **안 뺀다. 떨어진 잎만 뺀다.** 이유 셋:
     ① 값은 보이는 것으로 매긴다 — 바랜 잎은 아직 줄기에 달려 있고 화면에 그려진다
     ② 바램은 되돌아간다(빛이 돌아오면 fade 0). 값에서 빼면 빛 한 번에 그루 값이 소급해서
        오르내린다. 갈라진 잎을 소급해 뒤집지 않기로 한 것(MAT_STATE)과 같은 이유다
     ③ 초보(스토리)는 잎이 안 떨어진다(drop_enabled=false). 바램으로 빼면 초보에서
        그루 값이 조용히 0 으로 간다 — "초보는 안 죽는다"와 정면으로 어긋난다
     ⚠ 바램을 값에 반영할지는 판정이 아니라 기획이다. 정해지면 칸을 **따로** 낸다 —
       여기서 임의로 깎으면 코어가 그걸 정본으로 알고 그 위에 가격을 쌓는다. */
function leafStats(){
  const day=Math.max(0, Math.min(GMAX, GROWTH)), g=ageOf(day);
  let leaves=0, varie=0, mature=0;
  if(g>=P.seedEnd) for(const ax of topologyNow(g)){
    // 살아서 달려 있는 잎만 — buildPlant 이 실제로 그리는 기준 그대로다
    if(ax.birth>g || g<ax.leafBirth || leafDroppedOf(ax.leafBirth)) continue;
    leaves++;
    if(ax.varie) varie++;                     // 무늬는 잎이 날 때 정해진 것을 읽기만 한다
    if(matureOf(ax.leafBirth)) mature++;      // 갈라짐은 MAT_STATE 가 정본
  }
  return { leaves, variegatedLeaves:varie, matureLeaves:mature, growthDays:day };
}

// 형태 진행도를 이 값으로 '점프'한다(디버그 슬라이더·처음·끝 버튼). 달력도 같이 맞춘다.
// ⚠ 코어가 달력 날짜를 넣으면 저광 구간이 그냥 넘어간다 — 코어는 advanceTo 를 써야 한다.
function setGrowth(v){
  const nv=Math.max(0,Math.min(GMAX,Math.round(v)));
  if(!_warnedSetGrowth && nv>GROWTH && dliAvg(7)!=null){
    _warnedSetGrowth=true;
    console.warn('[생장] setGrowth 는 점프입니다. 하루 진행은 advanceTo(달력날짜) 를 쓰세요 — 저광 정지가 무시됩니다');
  }
  // ★점프는 이력을 버리는 행위다. 뒤로 가면 그 뒤에 있었던 성숙 판정도 없던 일이 된다 —
  //   안 지우면 "과거로 돌아갔는데 미래의 갈라진 잎이 그대로"인 화면이 나온다.
  if(nv<GROWTH) matResetAll();
  GROWTH=nv; CAL_DAY=nv;
  matCatchUp();                    // 하루씩 안 걸어온 잎들에게 기회를 한 번씩
  const g=document.getElementById('growth'); if(g) g.value=GROWTH;
  const t=document.getElementById('growthV'); if(t) t.textContent=GROWTH;
  // advanceTo 와 같은 이유로 논리 상태와 화면을 가른다 — 렌더 실패가 점프 실패로 번지지 않게.
  // ★도착(개체 생성)이 이 함수를 쓴다. 코어가 "형태를 세웠다"고 믿는 근거이므로
  //   그렸는지 여부를 반드시 돌려준다 — 안 그리면 화분만 있고 화면엔 없는 개체가 생긴다.
  const r=redraw();
  return { growth:GROWTH, calDay:CAL_DAY, drawn:r.drawn, drawError:r.drawError, hudError:r.hudError };
}
function startPlay(){ playing=true; const b=document.getElementById('btnPlay'); if(b){ b.textContent='⏸ 정지'; b.classList.add('on'); } if(GROWTH>=GMAX) setGrowth(0);
  playTimer=setInterval(()=>{ if(GROWTH>=GMAX){ stopPlay(); return; } setGrowth(GROWTH+Math.max(3,Math.round(GMAX/120))); }, 110); }
function stopPlay(){ playing=false; if(playTimer){ clearInterval(playTimer); playTimer=null; } const b=document.getElementById('btnPlay'); if(b){ b.textContent='▶ 재생'; b.classList.remove('on'); } }
function flashBtn(id,msg){ const b=document.getElementById(id); if(!b)return; if(!b.dataset.t) b.dataset.t=b.textContent; b.textContent=msg; setTimeout(()=>{ b.textContent=b.dataset.t; b.dataset.t=''; }, 1000); }
function applyCfg(verbose){

      if(o.SEED!=null) SEED=o.SEED;
      console.info('[cfg] 옛 저장본('+(o.v||'무버전')+') → 새 기본값 사용. 다시 튜닝 후 ⭐영구저장 하세요.');
      if(verbose) flashBtn('btnLoad','옛 버전·기본값');
      const sel0=document.getElementById('assetSel'); if(sel0){ buildAssetSliders(sel0.value); showPreview(sel0.value); }
      buildPlant(); return;
    }
    if(o.P) P=Object.assign({}, DEF, o.P);
    if(o.ADJ){ ADJ=JSON.parse(JSON.stringify(DEF_ADJ)); for(const k in ADJ) if(o.ADJ[k]) Object.assign(ADJ[k], o.ADJ[k]); }
    if(o.SEED!=null){ SEED=o.SEED; }
    const sel=document.getElementById('assetSel'); if(sel){ buildAssetSliders(sel.value); showPreview(sel.value); } buildShapePanel(); buildPlant();
    if(verbose) flashBtn('btnLoad','✅ 불러옴');
  }catch(e){ if(verbose) flashBtn('btnLoad','오류'); }
}
// ===== B 에셋별 조정 슬라이더 =====
const ADJ_FIELDS=[

// 카테고리 그룹 드롭다운(name_ko). 줄기는 길이=마디 고정이라 '길이(sy)' 슬라이더 숨김.

let prevR, prevScene, prevCam, prevObj;
function initPreview(){
  const c=document.getElementById('assetPrev'); if(!c||typeof THREE==='undefined') return;
  prevR=new THREE.WebGLRenderer({canvas:c, antialias:true, alpha:true});
  prevR.setPixelRatio(Math.min(2,devicePixelRatio||1)); prevR.setSize(c.width,c.height,false);
  prevR.outputEncoding=THREE.sRGBEncoding;
  prevScene=new THREE.Scene();
  prevScene.add(new THREE.HemisphereLight(0xffffff,0x888888,1.25));
  const d=new THREE.DirectionalLight(0xffffff,1.15); d.position.set(3,5,4); prevScene.add(d);
  const d2=new THREE.DirectionalLight(0xffffff,0.5); d2.position.set(-3,2,-2); prevScene.add(d2);
  const asp=c.width/c.height, F=0.62;
  prevCam=new THREE.OrthographicCamera(-F*asp,F*asp,F,-F,0.01,100);
  prevCam.position.set(1.3,0.85,1.9); prevCam.lookAt(0,0,0);   // 오브젝트를 원점 중심으로 맞추므로 원점 응시
}
/* 미리보기 캔버스가 지금 화면에 보이나.
   ★확대(?embed=game)에서는 패널이 통째로 display:none 이라 **한 번도 안 보인다.**
     그런데 전에는 매 프레임 돌면서 WebGL 컨텍스트 둘째 개를 계속 그렸다 — 순수 낭비다.
   패널을 접어도(▾) 마찬가지라 화면에 붙어 있는지까지 본다. */
function previewVisible(){
  if(!prevR || !prevObj) return false;
  if(EMBED_GAME) return false;                       // 확대 화면에는 패널 자체가 없다
  const c=prevR.domElement;
  return !!(c && c.isConnected && c.getClientRects().length);
}
function showPreview(key){                                 // 라이브: 현재 조정값(ADJ) 반영해 미리보기
  if(!prevScene) return;
  if(prevObj){ prevScene.remove(prevObj); prevObj=null; }
  const p=ASSETS[key];
  // ★"아직 안 실렸다"와 "실패했다"를 가른다. showPreview 는 GLB 로딩이 끝나기 전에 한 번 먼저 불리는데,
  //   그걸 실패로 찍으면 로그만 보고 "말린 새순 에셋이 안 실렸다"로 읽힌다 — 실제로 그렇게 오해가 났다.
  //   진짜 404 는 loadAssets 가 따로 찍는다. 여기서는 로딩이 끝난 뒤에만 실패로 본다.
  /* ★ 무늬는 이제 「쓸 때 받는다」(§ensureSkin · 2026-08-17). 튜닝 창에서 고른 무늬는
     아직 안 받았을 수 있으므로, 여기서 받아 오고 도착하면 그 자리에서 다시 그린다.
     ⚠ 안 하면 튜닝 창에서 무늬를 고를 때마다 빈 미리보기가 나온다(부팅 때 다 받던 시절엔 없던 일이다). */
  if(!p && ensureSkin(key, okk=>{ if(okk) showPreview(key); })) return;
  if(!p){ if(ASSETS_READY) console.warn('[preview] 에셋 로드 안됨:', key, ASSET_FILES[key]); return; }
  try{
    const a=adjOf(key), N=(v,d)=>v==null?d:v, sc=N(a.scale,1), sxz=N(a.sxz,1), sy=N(a.sy,1);
    const inner=p.clone(true);
    inner.scale.set(sc*sxz, sc*sy, sc*sxz);
    inner.rotation.set(a.rx||0, a.ry||0, a.rz||0);
    inner.position.set(a.ox||0, a.oy||0, a.oz||0);
    const wrap=new THREE.Group(); wrap.add(inner);
    // 실제 바운딩박스로 원점 중심 + 최대치수 1로 자동 맞춤(얇은 줄기도 항상 화면에)
    const box=new THREE.Box3().setFromObject(wrap), size=new THREE.Vector3(), ctr=new THREE.Vector3();
    box.getSize(size); box.getCenter(ctr);
    const md=Math.max(size.x,size.y,size.z)||1;
    wrap.position.sub(ctr);                                // 중심을 원점으로
    const holder=new THREE.Group(); holder.add(wrap); holder.scale.setScalar(0.9/md);
    prevObj=holder; prevScene.add(prevObj);
  }catch(e){ console.warn('[preview] 렌더 실패:', key, e); }
}
function updateAssetUse(){
  const el=document.getElementById('assetUse'), sel=document.getElementById('assetSel');
  if(!el||!sel) return;
  const k=sel.value, n=USE_COUNT[k]||0;
  if(!ASSETS[k]) el.innerHTML='<span style="color:#e07a5f">GLB 로드 실패 — 파일명 확인 필요</span>';
  else if(n>0)   el.innerHTML='<span style="color:#7ad06a">화면에 '+n+'개 그려짐 · 조절하면 즉시 반영</span>';
  else if(ADJ_UNUSED.has(k)) el.innerHTML='<span style="color:rgba(255,255,255,.45)">미사용 에셋 — 튜브 줄기가 대신 그림</span>';
  else el.innerHTML='<span style="color:#e8a838">지금 화면에 0개 — 성장도를 올리거나 다른 시드를 뽑아보세요</span>';
}
function buildAssetSliders(key){
  const box=document.getElementById('assetSliders'); if(!box) return; box.innerHTML='';
  const a=ADJ[key];
  fieldsFor(key).forEach(it=>{
    const f=document.createElement('div'); f.className='field';
    const lab=document.createElement('label'); lab.innerHTML=`${it.t} <b>${fmtVal(a[it.k])}</b>`;
    attachHelp(lab, it.k);
    const inp=document.createElement('input'); inp.type='range'; inp.min=it.min; inp.max=it.max; inp.step=it.step; inp.value=a[it.k];
    inp.addEventListener('input',()=>{ a[it.k]=+inp.value; lab.querySelector('b').textContent=fmtVal(a[it.k]); buildPlant(); showPreview(key); });   // buildPlant 먼저 → 미리보기 실패해도 조절은 항상 동작
    f.appendChild(lab); f.appendChild(inp); box.appendChild(f);
  });
}

// 설명 말풍선 — 제목에 마우스를 올리면 커서 옆에 뜬다.
function attachHelp(el, key){
  const txt=HELP[key]; if(!txt) return;
  el.classList.add('hashelp');
  el.addEventListener('mouseenter', e=>showHelp(txt, e));
  el.addEventListener('mousemove', e=>moveHelp(e));
  el.addEventListener('mouseleave', hideHelp);
}
let helpEl=null;
function showHelp(txt, e){
  if(!helpEl){ helpEl=document.createElement('div'); helpEl.id='helpTip'; document.body.appendChild(helpEl); }
  helpEl.textContent=txt; helpEl.style.display='block'; moveHelp(e);
}
function moveHelp(e){
  if(!helpEl) return;
  const w=helpEl.offsetWidth, hh=helpEl.offsetHeight;
  let x=e.clientX-w-16, y=e.clientY+14;              // 패널이 오른쪽이라 왼쪽에 띄운다
  if(x<8) x=e.clientX+16;
  if(y+hh>window.innerHeight-8) y=e.clientY-hh-12;
  helpEl.style.left=x+'px'; helpEl.style.top=y+'px';
}
function hideHelp(){ if(helpEl) helpEl.style.display='none'; }

function buildShapePanel(){
  const box=document.getElementById('shapeSliders'); if(!box) return; box.innerHTML='';
  SHAPE_GROUPS.forEach(gr=>{
    const d=document.createElement('details'); d.open=!!gr.open; d.className='sgrp';
    const sum=document.createElement('summary'); sum.textContent=gr.t; d.appendChild(sum);
    gr.items.forEach(it=>{
      const f=document.createElement('div'); f.className='field';
      const lab=document.createElement('label'); lab.innerHTML=`${it.t} <b>${fmtVal(P[it.k])}</b>`;
      attachHelp(lab, it.k);
      const inp=document.createElement('input'); inp.type='range'; inp.min=it.min; inp.max=it.max; inp.step=it.step; inp.value=P[it.k];
      inp.addEventListener('input',()=>{ P[it.k]=+inp.value; lab.querySelector('b').textContent=fmtVal(P[it.k]); buildPlant(); });
      f.appendChild(lab); f.appendChild(inp); d.appendChild(f);
    });
    box.appendChild(d);
  });
}
function fmtVal(v){ return Math.round(v*1000)/1000; }
function buildGlobalPanel(){
  const box=document.getElementById('tab-global'); if(!box) return; box.innerHTML='';
  PARAM_DEFS.forEach(sec=>{
    const h=document.createElement('div'); h.className='psec'; h.textContent=sec.sec; box.appendChild(h);
    sec.items.forEach(it=>{
      const f=document.createElement('div'); f.className='field';
      const lab=document.createElement('label'); lab.innerHTML=`${it.t} <b>${fmtVal(P[it.k])}</b>`;
      const inp=document.createElement('input'); inp.type='range'; inp.min=it.min; inp.max=it.max; inp.step=it.step; inp.value=P[it.k];
      inp.addEventListener('input',()=>{ P[it.k]=+inp.value; lab.querySelector('b').textContent=fmtVal(P[it.k]); buildPlant(); });
      f.appendChild(lab); f.appendChild(inp); box.appendChild(f);
    });
  });
}
function updateSun(){ if(!sunMarker) return; const R=2.3; sunMarker.position.set(Math.sin(LIGHT_AZ)*R, 1.5, Math.cos(LIGHT_AZ)*R); requestRender(); }
/* ★안 보일 때는 그리지 않는다 (2026-08-03).
   game.html 이 이 파일을 iframe 으로 싣고, 평소에는 opacity 0 으로 숨겨 둔 채
   화분을 탭했을 때만 띄운다. 그런데 숨어 있어도 rAF 는 계속 돌아서
   **WebGL 컨텍스트 둘이 동시에 매 프레임 그렸다** — 폰에서 눈에 띄게 렉이 걸렸다.
   보이지 않는 그림에 배터리를 쓸 이유가 없다. 논리 상태는 안 멈춘다(그리기만 쉰다). */
let RENDER_PAUSED=false;
function setRenderPaused(v){ const was=RENDER_PAUSED; RENDER_PAUSED=!!v;
  if(was && !RENDER_PAUSED){ requestRender(); redraw(); }   // 다시 보일 때 한 장은 확실히 그린다
  return RENDER_PAUSED; }
function renderPaused(){ return RENDER_PAUSED; }
/* ===== 그리기 계측 (읽기 전용) =====
   plant_grow 의 renderer·scene·cam 은 <script> 안의 let 이라 window 에 안 붙는다.
   그래서 밖에서 상태를 못 읽었다(코어의 tools/probe_zoom_inside.mjs 가 여기서 막혔다).
   함수 선언은 window 에 붙으므로 이 한 칸만 낸다.
   ⚠ 세는 것 말고는 아무것도 안 한다. 형태·난수·게임 상태에 손대지 않는다.
   ⚠ 세터는 두지 않는다 — 밖에서 그리기를 켜고 끌 수 있으면 계측이 아니라 조작이 된다.
     (그리기를 멈추는 공식 창구는 setRenderPaused 하나다.)
   calls·triangles 는 마지막으로 **실제 그린 프레임**의 값이다 — 안 그린 프레임에는 안 바뀐다. */
const RSTAT={ frames:0, mainDraws:0, prevDraws:0, mainMs:0, prevMs:0, since:0, lastDraw:0, maxGap:0, gapSum:0 };
const _now=()=>(typeof performance!=="undefined"&&performance.now)? performance.now() : Date.now();
function __growthStats(reset){
  const now=_now(), span=Math.max(1e-6,(now-RSTAT.since)/1000);
  const ri=renderer? renderer.info : null, pi=prevR? prevR.info : null;
  const per=(n)=>+(n/span).toFixed(1);
  const out={
    seconds:+span.toFixed(2),
    frames:RSTAT.frames, mainDraws:RSTAT.mainDraws, prevDraws:RSTAT.prevDraws,
    rafFps:per(RSTAT.frames), mainFps:per(RSTAT.mainDraws), prevFps:per(RSTAT.prevDraws),
    mainMsAvg: RSTAT.mainDraws? +(RSTAT.mainMs/RSTAT.mainDraws).toFixed(2) : 0,
    maxGapMs:+RSTAT.maxGap.toFixed(1), avgGapMs: RSTAT.mainDraws>1? +(RSTAT.gapSum/(RSTAT.mainDraws-1)).toFixed(1):0,
    prevMsAvg: RSTAT.prevDraws? +(RSTAT.prevMs/RSTAT.prevDraws).toFixed(2) : 0,
    calls: ri? ri.render.calls : null, triangles: ri? ri.render.triangles : null,
    geometries: ri? ri.memory.geometries : null, textures: ri? ri.memory.textures : null,
    programs: (ri&&ri.programs)? ri.programs.length : null,
    prevCalls: pi? pi.render.calls : null, prevTriangles: pi? pi.render.triangles : null,
    pixelRatio: renderer? renderer.getPixelRatio() : null,
    canvas: renderer? [renderer.domElement.width, renderer.domElement.height] : null,
    paused: RENDER_PAUSED, hidden: !!document.hidden, embed: EMBED_GAME,
    autoRotate: autoRotate, previewOn: !!(prevObj&&prevR),
    previewVisible: (typeof previewVisible==="function")? previewVisible() : null,
    dirty: (typeof NEEDS_RENDER!=="undefined")? NEEDS_RENDER : null
  };
  if(reset){ RSTAT.frames=0; RSTAT.mainDraws=0; RSTAT.prevDraws=0; RSTAT.mainMs=0; RSTAT.prevMs=0;
             RSTAT.since=now; RSTAT.lastDraw=0; RSTAT.maxGap=0; RSTAT.gapSum=0; }
  return out;
}
/* ★프레임 상한은 안 둔다 (재고 정했다).
     rAF 는 이미 화면 주사율에 맞춰 오고, 이제 안 바뀌면 아예 안 그린다 —
     남은 프레임은 전부 "사람이 지금 돌리고 있는 중"이라 그걸 반으로 자르면
     바로 그 회전이 끊겨 보인다. room_view 가 30fps 로 자르는 것은 방이 늘 살아 있기
     때문이고, 여기는 노는 동안 0장이라 자를 대상이 없다. */
function animate(){ requestAnimationFrame(animate);
  RSTAT.frames++;
  if(RENDER_PAUSED || document.hidden) return;
  if(autoRotate){ orbit.az+=0.004; updateCam(); }        // updateCam 이 다시 그릴 것을 표시한다
  if(NEEDS_RENDER){ NEEDS_RENDER=false;
    const t=_now(); if(RSTAT.lastDraw){ const gp=t-RSTAT.lastDraw; RSTAT.gapSum+=gp; if(gp>RSTAT.maxGap) RSTAT.maxGap=gp; } RSTAT.lastDraw=t; renderer.render(scene,cam); RSTAT.mainMs+=_now()-t; RSTAT.mainDraws++; }
  // 미리보기는 스스로 도는 애니메이션이라 따로 본다 — 안 보이면 아예 안 돈다
  if(previewVisible()){ const t=_now(); prevObj.rotation.y+=0.012; prevR.render(prevScene,prevCam);
                        RSTAT.prevMs+=_now()-t; RSTAT.prevDraws++; } }

init(); updateCam();
</script>

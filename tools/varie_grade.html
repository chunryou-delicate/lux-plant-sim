<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무늬 등급 매기기 · 볕</title>
<!--
  tools/varie_grade.html — 변이 원화를 눈으로 보고 무늬 등급을 매기는 도구. 2026-08-09 신설

  왜 있나
  ------
  그루값은 무늬 등급이 정한다(`src/game/shop.js` VARIE_GRADES · 무지 ×1 · 산반 ×8 ·
  섹터 ×320/9 · 하프문 ×640/9). 그런데 도감의 변이들이 **어느 등급인지 아무 데도 없다.**
  지금 값 공식은 「무늬 잎이 몇 장인가」만 보고 **어떤 변이인지는 안 본다.**

  ★ 이 도구는 **판단하지 않는다.** 미리 채워 두지도 않는다. 이름에 「하프문」이 들었어도
    찍어 두지 않는다 — 그림이 이름과 다를 수 있고, 정하는 것은 박사님이다.
    도구가 하는 일은 셋뿐이다: 보여 준다 · 고른 것을 안 잃는다 · 내보낸다.

  어디서 읽나 (여기서 숫자를 짓지 않는다)
  ------------------------------------
    ../assets/manifest.json               이름(name_ko)·단계(category)·원화 경로
    ../assets/existing/thumbs/index.json  원본경로 -> 썸네일 (tools/make_thumbs.py 가 만든다)
    ../src/game/shop.js                   등급 이름·배수·값 (priceOf 를 직접 부른다)
    ../data/balance/homes.json            원룸 이사비 (2,000,000 을 손으로 안 적는다)

  ⚠ ES 모듈·fetch 를 쓴다 — **HTTP 로 열어야 한다.** file:// 로는 안 열린다.
      python tools/serve.py 8963   →  http://localhost:8963/tools/varie_grade.html
-->
<style>
  :root{
    --bg:#faf8f4; --card:#fff; --ink:#20241f; --dim:#6d7268; --line:#e2ded4;
    --accent:#3f7d3a; --warn:#a4442c; --shadow:0 1px 3px rgba(0,0,0,.07);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#16180f; --card:#1f2218; --ink:#eae7dc; --dim:#9aa090; --line:#333727;
           --accent:#8ec97f; --warn:#e08b6f; --shadow:0 1px 3px rgba(0,0,0,.35); }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
       -webkit-text-size-adjust:100%}
  .wrap{max-width:1080px;margin:0 auto;padding:14px 12px 96px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 14px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;
         padding:12px;margin:0 0 14px;box-shadow:var(--shadow)}
  .panel h2{font-size:14px;margin:0 0 8px}
  .muted{color:var(--dim);font-size:12px}

  /* ── 값 표 ─────────────────────────────────────────── */
  .pricebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:13px}
  .pricebar input{width:64px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;
                  background:var(--bg);color:var(--ink);font:inherit}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.over td{color:var(--warn);font-weight:600}
  .tablescroll{overflow-x:auto}
  /* 폰에서 그루값 칸이 잘리면 표가 있으나 마나다 — 좁아지면 글자·여백을 줄인다 */
  @media (max-width:460px){
    th,td{padding:5px 3px;font-size:12px}
    .pricebar{font-size:12px}
  }

  /* ── 도구줄 ─────────────────────────────────────────── */
  .tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);
         color:var(--ink);border-radius:7px;padding:5px 9px;font-size:13px}
  button:active{transform:translateY(1px)}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .count{margin-left:auto;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}

  /* ── 격자 ─────────────────────────────────────────── */
  h2.sec{font-size:15px;margin:20px 0 2px}
  .secnote{font-size:12px;color:var(--dim);margin:0 0 8px}
  .grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
        overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
  .card.done{border-color:var(--accent)}
  .thumb{position:relative;width:100%;aspect-ratio:1/1;background:#fff;border:0;padding:0;
         display:block;cursor:zoom-in;border-radius:0}
  .thumb img{width:100%;height:100%;object-fit:contain;display:block}
  .zoomhint{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.55);color:#fff;
            font-size:10px;padding:1px 5px;border-radius:9px;pointer-events:none}
  .meta{padding:6px 7px 0}
  .name{font-size:12.5px;font-weight:600;line-height:1.3;word-break:keep-all}
  .tags{font-size:10.5px;color:var(--dim);margin-top:2px;word-break:break-all}
  .picks{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:6px 7px 7px;margin-top:auto}
  .picks button{padding:4px 0;font-size:11.5px;border-radius:6px;text-align:center}
  .picks button.ghost{grid-column:span 3;color:var(--warn);border-style:dashed}
  .picks button.ghost.on{background:var(--warn);border-color:var(--warn);color:#fff}

  /* ── 크게 보기 ───────────────────────────────────────── */
  dialog#big{border:0;padding:0;background:transparent;max-width:100vw;max-height:100vh;width:100%}
  dialog#big::backdrop{background:rgba(0,0,0,.85)}
  #big .box{display:flex;flex-direction:column;height:100dvh}
  #big img{flex:1;min-height:0;width:100%;object-fit:contain;background:#fff}
  #big .bar{background:var(--card);color:var(--ink);padding:8px 10px;display:flex;
            gap:8px;align-items:center;flex-wrap:wrap}
  #big .bar .name{font-size:14px}
  /* 등급 넷은 한 줄, 고스트는 아래 한 줄 통째로 — 다섯을 한 줄에 넣으면
     「(등급이 아니라 죽음)」이 세 줄로 접혀 단추가 그림을 밀어낸다 */
  #big .picks{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;
              background:var(--card);padding:0 10px 10px}
  #big .picks button{padding:8px 0;font-size:13px}
  #big .picks button.ghost{grid-column:span 4}

  /* ── 내보내기 ─────────────────────────────────────────── */
  textarea{width:100%;min-height:180px;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;
           border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);
           color:var(--ink);resize:vertical}
  .err{color:var(--warn);white-space:pre-wrap;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>무늬 등급 매기기</h1>
  <p class="sub">원화를 보고 등급을 고른다. 고른 것은 이 브라우저에 남는다(새로고침해도 안 날아간다).
     다 고르면 아래 <b>내보내기</b>로 복사해서 넘긴다.</p>

  <div class="panel" id="pricepanel">
    <h2>이 등급이면 값이 얼마가 되나</h2>
    <div class="pricebar">
      잎 <input id="leaves" type="number" min="1" max="20" value="8"> 장짜리 그루
      <span class="muted">· 무늬 잎은 그 등급이 되는 최소 장수로 잡았다</span>
    </div>
    <div class="tablescroll"><table id="pricetable"></table></div>
    <p class="muted" id="pricenote"></p>
  </div>

  <div class="panel">
    <div class="tools">
      <button id="f-all" class="on">전체</button>
      <button id="f-todo">안 정한 것만</button>
      <button id="t-recolor">색변형도 보기</button>
      <button id="go-export">내보내기</button>
      <span class="count" id="count"></span>
    </div>
  </div>

  <div id="err" class="err"></div>
  <div id="sections"></div>

  <div class="panel" id="exportpanel" style="display:none">
    <h2>내보내기</h2>
    <div class="tools" style="margin-bottom:8px">
      <button id="e-json" class="on">JSON</button>
      <button id="e-md">마크다운 표</button>
      <button id="e-copy">복사</button>
      <button id="e-clear" style="margin-left:auto">전부 지우기</button>
    </div>
    <textarea id="out" readonly></textarea>
  </div>
</div>

<dialog id="big"><div class="box">
  <img id="bigimg" alt="">
  <div class="bar"><span class="name" id="bigname"></span>
    <span class="muted" id="bigmeta"></span>
    <button id="bigclose" style="margin-left:auto">닫기</button></div>
  <div class="picks" id="bigpicks"></div>
</div></dialog>

<script type="module">
import { VARIE_GRADES, priceOf } from '../src/game/shop.js';

const KEY = 'byeot.varie_grade.v1';
const err = (m) => { document.getElementById('err').textContent = m; };

/* ── 고른 것 — localStorage 하나에 { name_ko: 등급id } ───────────────────── */
let picks = {};
try { picks = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch { picks = {}; }
const save = () => localStorage.setItem(KEY, JSON.stringify(picks));

/* ★ 고를 수 있는 것 — 등급 넷은 shop.js 에서 그대로 가져온다(이름을 여기 안 적는다).
   고스트는 **등급이 아니다.** shop.js §고스트: "값의 꼭대기가 아니라 경고로 읽는다 —
   그루가 결국 죽는다". 그래서 사다리 밖에 따로 둔다. */
const GHOST = { id: 'ghost', ko: '고스트', death: true };
const CHOICES = [...VARIE_GRADES.map(g => ({ id: g.id, ko: g.ko, mult: g.leafMult })), GHOST];

/* ── ① 값 표 — 숫자를 손으로 안 적는다. priceOf 를 부른다 ─────────────────── */
let moveCostWon = null;
fetch('../data/balance/homes.json').then(r => r.json()).then(d => {
  const one = (d.homes || []).find(h => h.id === 'oneroom');
  if (one) moveCostWon = one.moveCost;
  drawPrice();
}).catch(() => drawPrice());

const won = n => n.toLocaleString('ko-KR') + '원';

function drawPrice() {
  const leaves = Math.max(1, Math.min(20, Number(document.getElementById('leaves').value) || 8));
  const rows = VARIE_GRADES.map(g => {
    const v = g.minVarieLeaves;
    if (v > leaves) return { g, v, q: null };
    return { g, v, q: priceOf({ species: 'monstera', leaves, variegatedLeaves: v }) };
  });
  const t = document.getElementById('pricetable');
  t.innerHTML =
    '<tr><th>등급</th><th>무늬 잎</th><th style="text-align:right">잎당 배수</th>' +
    '<th style="text-align:right">그루값</th></tr>' +
    rows.map(r => {
      const over = moveCostWon != null && r.q && r.q.won >= moveCostWon;
      return `<tr class="${over ? 'over' : ''}"><td>${r.g.ko}</td>` +
        `<td>${r.v}장</td>` +
        `<td class="num">×${r.g.leafMult === 1 ? 1 : (Math.round(r.g.leafMult * 100) / 100)}</td>` +
        /* ★ 는 「이 한 그루로 원룸에 갈 수 있다」는 표시다. 문장을 칸에 넣으면 폰에서 값이 잘린다 */
        `<td class="num">${r.q ? won(r.q.won) + (over ? ' ★' : '') : '잎이 모자란다'}</td></tr>`;
    }).join('');
  const capped = rows.find(r => r.q && r.q.gradeCapped);
  document.getElementById('pricenote').textContent =
    (moveCostWon != null ? `★ = 이 한 그루로 원룸 이사비 ${won(moveCostWon)}를 넘긴다 (data/balance/homes.json) · ` : '') +
    '값은 src/game/shop.js 의 priceOf 가 낸다 — 코드가 바뀌면 이 표도 따라 바뀐다.' +
    (capped ? ' ⚠ 잎 3장 미만은 삽수라 등급 상한(산반)이 걸린다.' : '');
}
document.getElementById('leaves').addEventListener('input', drawPrice);

/* ── ② 목록 — 매니페스트에서 고른다 ────────────────────────────────────── */
const RASTER = /\.(png|jpe?g|jfif|webp)$/i;
const isRecolor = n => n.endsWith('-쨍') || n.endsWith('-차분');
const stageOf = cat => (String(cat).split('·')[2] || '?');
/* ★ 종을 가른다. category 는 전부 「잎·몬스테라」인데 GLB 이름이 pothos_/heart_ 인 것들이 있다 —
   몬스테라가 아닌 잎 모양을 빌려 쓴 판이다. 값 체계가 다를 수 있으니 갈라서 보여 준다. */
const shapeOf = glb => /^(pothos|heart)_/.test(glb) ? '하트·포토스' : '몬스테라';

let ITEMS = [];
let thumbIndex = {};

Promise.all([
  fetch('../assets/manifest.json').then(r => r.json()),
  fetch('../assets/existing/thumbs/index.json').then(r => r.json()).catch(() => ({ thumbs: {} }))
]).then(([mf, ti]) => {
  thumbIndex = ti.thumbs || {};
  const by = new Map();
  for (const it of mf.items) {
    const name = String(it.name_ko || '');
    const cat = String(it.category || '');
    if (!name.startsWith('변이-') || !cat.startsWith('잎·몬스테라')) continue;
    if (!by.has(name)) by.set(name, { name, cat, src: null, glb: null });
    const row = by.get(name);
    if (!row.src && RASTER.test(it.path)) row.src = it.path;
    const glb = it.glb_matched || (it.path.endsWith('.glb') ? it.path : null);
    if (!row.glb && glb) row.glb = glb.split('/').pop();
  }
  ITEMS = [...by.values()].map(r => ({
    ...r, stage: stageOf(r.cat), shape: shapeOf(r.glb || ''), recolor: isRecolor(r.name),
    thumb: r.src ? thumbIndex[r.src] : null
  }));
  const noThumb = ITEMS.filter(i => !i.thumb);
  if (noThumb.length)
    err(`썸네일이 없는 것 ${noThumb.length}종 — python tools/make_thumbs.py 를 돌려 주세요\n` +
        noThumb.map(i => '  ' + i.name).join('\n'));
  render();
}).catch(e => err('목록을 못 읽었습니다: ' + e.message +
  '\n⚠ HTTP 로 열어야 합니다 — python tools/serve.py 8963 → http://localhost:8963/tools/varie_grade.html'));

/* ── ③ 화면 ──────────────────────────────────────────────────────────── */
const STAGE_ORDER = ['초기', '중간', '성숙'];
let onlyTodo = false, showRecolor = false;

function sectionsOf(list) {
  const out = [];
  for (const shape of ['몬스테라', '하트·포토스'])
    for (const stage of STAGE_ORDER) {
      const rows = list.filter(i => i.shape === shape && i.stage === stage);
      if (rows.length) out.push({
        title: `${shape} 모양 · ${stage}`, rows,
        note: shape === '하트·포토스'
          ? '★ 도감 갈래는 「잎·몬스테라」인데 3D 판이 pothos_/heart_ 다 — 몬스테라 잎 모양이 아니다. 값 체계가 다를 수 있어 갈라 두었다.'
          : ''
      });
    }
  return out;
}

function card(it) {
  const el = document.createElement('div');
  el.className = 'card' + (picks[it.name] ? ' done' : '');
  const t = document.createElement('button');
  t.className = 'thumb'; t.title = '크게 보기';
  t.innerHTML = `<img loading="lazy"><span class="zoomhint">크게 보기</span>`;
  const img = t.querySelector('img');
  img.alt = it.name;
  if (it.thumb) img.src = '../assets/existing/thumbs/' + encodeURIComponent(it.thumb);
  if (it.src) t.addEventListener('click', () => openBig(it));
  el.appendChild(t);

  const m = document.createElement('div');
  m.className = 'meta';
  m.innerHTML = `<div class="name"></div><div class="tags"></div>`;
  m.querySelector('.name').textContent = it.name;
  m.querySelector('.tags').textContent = `${it.stage} · ${it.glb || '3D 없음'}`;
  el.appendChild(m);

  el.appendChild(pickRow(it, () => { el.className = 'card' + (picks[it.name] ? ' done' : ''); }));
  return el;
}

function pickRow(it, after) {
  const p = document.createElement('div');
  p.className = 'picks';
  for (const c of CHOICES) {
    const b = document.createElement('button');
    b.textContent = c.ko + (c.death ? ' (등급이 아니라 죽음)' : '');
    if (c.death) b.classList.add('ghost');
    if (picks[it.name] === c.id) b.classList.add('on');
    b.title = c.death ? '잎 전체가 흰 것. 값의 꼭대기가 아니라 경고다 — 그루가 결국 죽는다'
                      : `잎당 ×${c.mult === 1 ? 1 : Math.round(c.mult * 100) / 100}`;
    b.addEventListener('click', () => {
      if (picks[it.name] === c.id) delete picks[it.name];   /* 다시 누르면 취소 — 되돌릴 수 있어야 한다 */
      else picks[it.name] = c.id;
      save();
      [...p.children].forEach((x, i) => x.classList.toggle('on', picks[it.name] === CHOICES[i].id));
      if (after) after();
      drawCount();
      syncBig(it);
      if (onlyTodo) render();
    });
    p.appendChild(b);
  }
  return p;
}

function visible() {
  let l = ITEMS.filter(i => showRecolor || !i.recolor);
  if (onlyTodo) l = l.filter(i => !picks[i.name]);
  return l;
}

function render() {
  const host = document.getElementById('sections');
  host.textContent = '';
  for (const sec of sectionsOf(visible())) {
    const h = document.createElement('h2');
    h.className = 'sec'; h.textContent = `${sec.title} (${sec.rows.length})`;
    host.appendChild(h);
    if (sec.note) {
      const n = document.createElement('p'); n.className = 'secnote'; n.textContent = sec.note;
      host.appendChild(n);
    }
    const g = document.createElement('div');
    g.className = 'grid';
    for (const it of sec.rows) g.appendChild(card(it));
    host.appendChild(g);
  }
  drawCount();
}

function drawCount() {
  const pool = ITEMS.filter(i => showRecolor || !i.recolor);
  const done = pool.filter(i => picks[i.name]).length;
  const base = ITEMS.filter(i => !i.recolor).length, re = ITEMS.length - base;
  document.getElementById('count').textContent =
    `${done} / ${pool.length}종 정함  (기본 ${base}종 · 색변형 ${re}종)`;
}

/* ── ④ 크게 보기 — 작게만 보면 산반과 스페클을 못 가른다 ────────────────── */
const dlg = document.getElementById('big');
let bigItem = null;
function openBig(it) {
  bigItem = it;
  document.getElementById('bigimg').src = '../assets/' + it.src.split('/').map(encodeURIComponent).join('/');
  document.getElementById('bigname').textContent = it.name;
  document.getElementById('bigmeta').textContent = `${it.stage} · ${it.shape} 모양 · ${it.glb || '3D 없음'}`;
  const p = document.getElementById('bigpicks');
  p.textContent = '';
  const fresh = pickRow(it, () => render());
  while (fresh.firstChild) p.appendChild(fresh.firstChild);
  p.className = 'picks';
  dlg.showModal();
}
function syncBig(it) {
  if (!bigItem || bigItem.name !== it.name) return;
  [...document.getElementById('bigpicks').children]
    .forEach((x, i) => x.classList.toggle('on', picks[it.name] === CHOICES[i].id));
}
document.getElementById('bigclose').addEventListener('click', () => dlg.close());
dlg.addEventListener('close', () => { bigItem = null; render(); });

/* ── ⑤ 내보내기 ─────────────────────────────────────────────────────── */
let expMode = 'json';
function exportText() {
  const rows = ITEMS.filter(i => picks[i.name])
    .sort((a, b) => a.shape.localeCompare(b.shape) ||
                    STAGE_ORDER.indexOf(a.stage) - STAGE_ORDER.indexOf(b.stage) ||
                    a.name.localeCompare(b.name, 'ko'));
  const base = ITEMS.filter(i => !i.recolor).length, re = ITEMS.length - base;
  if (expMode === 'json') {
    return JSON.stringify({
      schema: 'varie_grade/1',
      savedAt: new Date().toISOString().slice(0, 10),
      note: '박사님이 눈으로 매긴 무늬 등급. ghost 는 등급이 아니라 죽음이다(shop.js §고스트).',
      counts: { base, recolor: re, total: ITEMS.length, graded: rows.length },
      grades: Object.fromEntries(rows.map(i => [i.name, picks[i.name]]))
    }, null, 1);
  }
  const ko = id => (CHOICES.find(c => c.id === id) || {}).ko || id;
  return ['| 이름(name_ko) | 등급 | 단계 | 잎 모양 | GLB |', '|---|---|---|---|---|',
    ...rows.map(i => `| ${i.name} | ${ko(picks[i.name])} | ${i.stage} | ${i.shape} | ${i.glb || '-'} |`),
    '', `기본 ${base}종 · 색변형 ${re}종 = ${ITEMS.length}종 중 **${rows.length}종** 정함.`].join('\n');
}
function drawExport() {
  document.getElementById('out').value = exportText();
  document.getElementById('e-json').classList.toggle('on', expMode === 'json');
  document.getElementById('e-md').classList.toggle('on', expMode === 'md');
}
document.getElementById('go-export').addEventListener('click', () => {
  const p = document.getElementById('exportpanel');
  p.style.display = 'block'; drawExport(); p.scrollIntoView({ behavior: 'smooth' });
});
document.getElementById('e-json').addEventListener('click', () => { expMode = 'json'; drawExport(); });
document.getElementById('e-md').addEventListener('click', () => { expMode = 'md'; drawExport(); });
document.getElementById('e-copy').addEventListener('click', async () => {
  const ta = document.getElementById('out');
  ta.select(); ta.setSelectionRange(0, ta.value.length);
  let ok = false;
  try { await navigator.clipboard.writeText(ta.value); ok = true; }
  catch { try { ok = document.execCommand('copy'); } catch { ok = false; } }
  const b = document.getElementById('e-copy');
  b.textContent = ok ? '복사했습니다' : '직접 복사해 주세요';
  setTimeout(() => { b.textContent = '복사'; }, 1600);
});
document.getElementById('e-clear').addEventListener('click', () => {
  if (!confirm('고른 등급을 전부 지웁니다. 되돌릴 수 없습니다.')) return;
  picks = {}; save(); render(); drawExport();
});

/* ── ⑥ 거르개 ───────────────────────────────────────────────────────── */
const fAll = document.getElementById('f-all'), fTodo = document.getElementById('f-todo');
fAll.addEventListener('click', () => { onlyTodo = false; fAll.classList.add('on'); fTodo.classList.remove('on'); render(); });
fTodo.addEventListener('click', () => { onlyTodo = true; fTodo.classList.add('on'); fAll.classList.remove('on'); render(); });
document.getElementById('t-recolor').addEventListener('click', (e) => {
  showRecolor = !showRecolor; e.target.classList.toggle('on', showRecolor); render();
});

drawPrice();
</script>
